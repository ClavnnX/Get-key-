<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClavnnX Get key</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #000000 !important;
            color: #ffffff;
        }
        .container {
            background: #222222 !important;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(255,255,255,0.2);
            border: 2px solid #444444;
        }
        h1 {
            text-align: center;
            color: #ffffff !important;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #btnContinue, #btnGen, #btnTakeKey {
            background: #007bff;
            color: white;
        }
        #btnContinue:hover, #btnGen:hover, #btnTakeKey:hover {
            background: #0056b3;
        }
        #btnTakeKey {
            background: #28a745;
            display: none;
            margin-top: 10px;
        }
        #btnTakeKey:hover {
            background: #1e7e34;
        }
        #btnCopy {
            background: #28a745;
            color: white;
            display: none;
        }
        #btnCopy:hover {
            background: #1e7e34;
        }
        #out {
            background: #2d2d2d;
            border: 1px solid #444444;
            border-radius: 8px;
            padding: 20px;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        .timer {
            background: #dc3545;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        .step-indicator {
            background: #17a2b8;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .success-message {
            background: #28a745;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        .error-message {
            background: #dc3545;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ClavnnX Get key</h1>
        <div class="step-indicator" id="stepIndicator" style="display: none;">Step Progress</div>
        <button id="btnContinue">Complete the step</button>
        <div class="timer" id="timer">Generate key link expires in: <span id="timeLeft">5:00</span></div>
        <div id="out">Click "Complete the step" to proceed through verification steps</div>
        <button id="btnTakeKey" style="display: none;">Take the key</button>
        <button id="btnCopy" style="display: none;">Copy Key</button>
    </div>

    <script>
        const btnContinue = document.getElementById('btnContinue');
        const btnTakeKey = document.getElementById('btnTakeKey');
        const btnCopy = document.getElementById('btnCopy');
        const output = document.getElementById('out');
        const timerDiv = document.getElementById('timer');
        const timeLeftSpan = document.getElementById('timeLeft');
        const stepIndicator = document.getElementById('stepIndicator');
        let currentKey = '';
        let timerInterval = null;
        let timeRemaining = 0;

        // Storage keys
        const TOKEN_STORAGE_KEY = 'clavnnx_verify_token';
        const SESSION_KEY = 'clavnnx_session';
        const VERTISE_COMPLETION_KEY = 'clavnnx_vertise_completion';

        // Session and security management
        function createSession() {
            const sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const sessionData = {
                id: sessionId,
                created: Date.now(),
                currentStep: 0,
                stepsCompleted: [],
                vertiseCompletions: {},
                allowedPaths: ['/'], // Only home page allowed initially
                lastActivity: Date.now()
            };
            
            localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
            sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
            return sessionData;
        }

        function getSession() {
            const stored = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
            if (stored) {
                const session = JSON.parse(stored);
                // Check if session is still valid (not older than 2 hours)
                if (Date.now() - session.created < 2 * 60 * 60 * 1000) {
                    return session;
                }
            }
            return null;
        }

        function updateSession(updates) {
            const session = getSession();
            if (session) {
                const updatedSession = { ...session, ...updates, lastActivity: Date.now() };
                localStorage.setItem(SESSION_KEY, JSON.stringify(updatedSession));
                sessionStorage.setItem(SESSION_KEY, JSON.stringify(updatedSession));
                return updatedSession;
            }
            return null;
        }

        function clearSession() {
            localStorage.removeItem(SESSION_KEY);
            sessionStorage.removeItem(SESSION_KEY);
            localStorage.removeItem(TOKEN_STORAGE_KEY);
            sessionStorage.removeItem(TOKEN_STORAGE_KEY);
            localStorage.removeItem(VERTISE_COMPLETION_KEY);
            sessionStorage.removeItem(VERTISE_COMPLETION_KEY);
        }

        function isPathAllowed(path) {
            const session = getSession();
            
            // Always allow homepage access for new users
            if (path === '/') return true;
            
            // For other paths, check if session exists and path is allowed
            if (!session) return false;
            
            return session.allowedPaths.includes(path);
        }

        function addAllowedPath(path) {
            const session = getSession();
            if (session && !session.allowedPaths.includes(path)) {
                session.allowedPaths.push(path);
                updateSession(session);
            }
        }

        function validateVertiseReturn(step, requiredParam) {
            const urlParams = new URLSearchParams(window.location.search);
            const vertiseParam = urlParams.get('vertise_completed');
            const token = urlParams.get('token');
            
            if (vertiseParam !== requiredParam.toString() || !token) {
                return false;
            }
            
            // Save Vertise completion
            const session = getSession();
            if (session) {
                session.vertiseCompletions[step] = {
                    timestamp: Date.now(),
                    userAgent: navigator.userAgent,
                    referrer: document.referrer
                };
                updateSession(session);
            }
            
            return true;
        }

        // Generate secure token
        function generateToken() {
            const timestamp = Date.now();
            const randomStr = Math.random().toString(36).substring(2, 15);
            return `token_${timestamp}_${randomStr}`;
        }

        function saveToken(token) {
            if (token) {
                localStorage.setItem(TOKEN_STORAGE_KEY, token);
                sessionStorage.setItem(TOKEN_STORAGE_KEY, token);
            }
        }

        function getToken() {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get('token');
            
            if (tokenFromUrl) {
                return tokenFromUrl;
            }
            
            return localStorage.getItem(TOKEN_STORAGE_KEY) || sessionStorage.getItem(TOKEN_STORAGE_KEY);
        }

        // Path and access control
        const currentPath = window.location.pathname;
        const urlParams = new URLSearchParams(window.location.search);
        
        // Initialize page with strict access control
        function initializePage() {
            console.log('Initializing page:', currentPath);
            
            // Check if path is allowed
            if (!isPathAllowed(currentPath)) {
                showAccessDenied();
                return;
            }
            
            // Route to appropriate page
            if (currentPath === '/') {
                initializeHomePage();
            } else if (currentPath === '/step1') {
                initializeStep1Page();
            } else if (currentPath === '/step2') {
                initializeStep2Page();
            } else if (currentPath === '/step3') {
                initializeStep3Page();
            } else if (currentPath === '/generate-key-secure-xyz') {
                initializeGeneratePage();
            } else {
                showAccessDenied();
            }
        }

        function showAccessDenied() {
            stepIndicator.style.display = 'block';
            stepIndicator.className = 'error-message';
            stepIndicator.textContent = '🚫 Access Denied';
            
            btnContinue.textContent = 'Start From Beginning';
            btnContinue.style.background = '#dc3545';
            
            output.textContent = 'Unauthorized access detected!\n\nYou cannot access this page directly.\nPlease start from the beginning and complete all steps in order.\n\nDirect URL access is not allowed for security reasons.';
            
            btnContinue.addEventListener('click', () => {
                clearSession();
                window.location.href = '/';
            });
        }

        function updateStepIndicator(currentStep, totalSteps = 3) {
            stepIndicator.style.display = 'block';
            stepIndicator.className = 'step-indicator';
            stepIndicator.textContent = `Progress: Step ${currentStep}/${totalSteps} Completed`;
            
            if (currentStep >= totalSteps) {
                stepIndicator.className = 'success-message';
                stepIndicator.textContent = '✅ All Steps Completed! Ready to generate key';
            }
        }

        // Page initialization functions
        function initializeHomePage() {
            let session = getSession();
            
            // Create new session if doesn't exist or is expired
            if (!session) {
                session = createSession();
                console.log('Created new session for new user');
            }
            
            // Generate token if needed
            let token = getToken();
            if (!token) {
                token = generateToken();
                saveToken(token);
                console.log('Generated new token:', token);
            }
            
            // Reset to initial state for new users
            if (session.currentStep === 0) {
                updateSession({ 
                    currentStep: 0,
                    stepsCompleted: [],
                    allowedPaths: ['/']  // Reset allowed paths
                });
            }
            
            if (session.currentStep > 0) {
                updateStepIndicator(session.currentStep);
                
                // Allow user to continue from where they left off
                if (session.currentStep >= 3) {
                    btnContinue.textContent = 'Generate API Key';
                    output.textContent = `Welcome back! You have completed ${session.currentStep}/3 steps.\n\nAll verification steps are completed.\nClick below to generate your API key.`;
                    
                    btnContinue.addEventListener('click', () => {
                        addAllowedPath('/generate-key-secure-xyz');
                        window.location.href = `/generate-key-secure-xyz?token=${token}`;
                    });
                } else {
                    btnContinue.textContent = `Continue Step ${session.currentStep + 1}/3`;
                    output.textContent = `Welcome back! You have completed ${session.currentStep}/3 steps.\n\nClick below to continue from where you left off.`;
                    
                    btnContinue.addEventListener('click', () => {
                        const nextStep = session.currentStep + 1;
                        addAllowedPath(`/step${nextStep}`);
                        window.location.href = `/step${nextStep}?token=${token}`;
                    });
                }
            } else {
                btnContinue.textContent = 'Start Verification Process';
                output.textContent = 'Welcome to ClavnnX API Key Generator\n\nTo get your API key, you must complete 3 verification steps.\n\nClick below to start the verification process.';
                
                btnContinue.addEventListener('click', () => {
                    // Add step1 to allowed paths and redirect
                    addAllowedPath('/step1');
                    window.location.href = `/step1?token=${token}`;
                });
            }
        }

        function initializeStep1Page() {
            const session = getSession();
            const token = getToken();
            
            if (!session || !token) {
                showAccessDenied();
                return;
            }
            
            // Check if this is a return from Vertise
            if (urlParams.get('vertise_completed') === '1') {
                // Mark step 1 as completed
                const completedSteps = session.stepsCompleted || [];
                if (!completedSteps.includes(1)) {
                    completedSteps.push(1);
                }
                
                updateSession({
                    currentStep: 1,
                    stepsCompleted: completedSteps
                });
                
                // Allow access to step 2
                addAllowedPath('/step2');
                
                // Redirect to step 2
                setTimeout(() => {
                    window.location.href = `/step2?token=${token}`;
                }, 1000);
                
                updateStepIndicator(1);
                output.textContent = 'Step 1 completed successfully! ✅\n\nRedirecting to Step 2...';
                btnContinue.style.display = 'none';
                return;
            }
            
            updateStepIndicator(0);
            btnContinue.textContent = 'Step 1/3 - Complete Verification';
            output.textContent = 'Step 1 of 3: First Verification\n\nClick the button below to complete the first verification step.\n\nYou will be redirected to complete the verification task.';
            
            btnContinue.addEventListener('click', () => {
                output.textContent = 'Redirecting to verification...';
                btnContinue.textContent = 'Please wait...';
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step1?token=${token}&vertise_completed=1`;
                
                setTimeout(() => {
                    window.location.href = `https://link-hub.net/1385845/qklnqONg4HgC?return=${encodeURIComponent(returnUrl)}`;
                }, 2000);
            });
        }

        function initializeStep2Page() {
            const session = getSession();
            const token = getToken();
            
            if (!session || !token || !session.stepsCompleted.includes(1)) {
                showAccessDenied();
                return;
            }
            
            // Check if this is a return from Vertise
            if (urlParams.get('vertise_completed') === '2') {
                // Mark step 2 as completed
                const completedSteps = session.stepsCompleted || [];
                if (!completedSteps.includes(2)) {
                    completedSteps.push(2);
                }
                
                updateSession({
                    currentStep: 2,
                    stepsCompleted: completedSteps
                });
                
                // Allow access to step 3
                addAllowedPath('/step3');
                
                // Redirect to step 3
                setTimeout(() => {
                    window.location.href = `/step3?token=${token}`;
                }, 1000);
                
                updateStepIndicator(2);
                output.textContent = 'Step 2 completed successfully! ✅\n\nStep 1: ✅ Completed\nStep 2: ✅ Completed\n\nRedirecting to Step 3...';
                btnContinue.style.display = 'none';
                return;
            }
            
            updateStepIndicator(1);
            btnContinue.textContent = 'Step 2/3 - Complete Verification';
            output.textContent = 'Step 2 of 3: Second Verification\n\nStep 1: ✅ Completed\n\nClick the button below to complete the second verification step.';
            
            btnContinue.addEventListener('click', () => {
                output.textContent = 'Redirecting to verification...';
                btnContinue.textContent = 'Please wait...';
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step2?token=${token}&vertise_completed=2`;
                
                setTimeout(() => {
                    window.location.href = `https://link-target.net/1385845/2FtUqPh7m718?return=${encodeURIComponent(returnUrl)}`;
                }, 2000);
            });
        }

        function initializeStep3Page() {
            const session = getSession();
            const token = getToken();
            
            if (!session || !token || !session.stepsCompleted.includes(1) || !session.stepsCompleted.includes(2)) {
                showAccessDenied();
                return;
            }
            
            // Check if this is a return from Vertise
            if (urlParams.get('vertise_completed') === '3') {
                // Mark step 3 as completed
                const completedSteps = session.stepsCompleted || [];
                if (!completedSteps.includes(3)) {
                    completedSteps.push(3);
                }
                
                updateSession({
                    currentStep: 3,
                    stepsCompleted: completedSteps
                });
                
                // Allow access to generate key page
                addAllowedPath('/generate-key-secure-xyz');
                
                updateStepIndicator(3);
                btnContinue.style.display = 'none';
                btnTakeKey.style.display = 'block';
                output.textContent = 'All verification steps completed! ✅\n\nStep 1: ✅ Completed\nStep 2: ✅ Completed\nStep 3: ✅ Completed\n\nClick "Take the key" to generate your API key.';
                
                btnTakeKey.addEventListener('click', () => {
                    window.location.href = `/generate-key-secure-xyz?token=${token}`;
                });
                return;
            }
            
            // Check if already completed all steps
            if (session.stepsCompleted.includes(3)) {
                updateStepIndicator(3);
                btnContinue.style.display = 'none';
                btnTakeKey.style.display = 'block';
                output.textContent = 'All verification steps completed! ✅\n\nStep 1: ✅ Completed\nStep 2: ✅ Completed\nStep 3: ✅ Completed\n\nClick "Take the key" to generate your API key.';
                
                btnTakeKey.addEventListener('click', () => {
                    window.location.href = `/generate-key-secure-xyz?token=${token}`;
                });
                return;
            }
            
            updateStepIndicator(2);
            btnContinue.textContent = 'Step 3/3 - Complete Final Verification';
            output.textContent = 'Step 3 of 3: Final Verification\n\nStep 1: ✅ Completed\nStep 2: ✅ Completed\n\nClick the button below to complete the final verification step.';
            
            btnContinue.addEventListener('click', () => {
                output.textContent = 'Redirecting to final verification...';
                btnContinue.textContent = 'Please wait...';
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step3?token=${token}&vertise_completed=3`;
                
                setTimeout(() => {
                    window.location.href = `https://link-target.net/1385845/GlkP3DeSeukX?return=${encodeURIComponent(returnUrl)}`;
                }, 2000);
            });
        }

        function initializeGeneratePage() {
            const session = getSession();
            const token = getToken();
            
            // Strict validation - must have completed ALL steps
            if (!session || !token || 
                !session.stepsCompleted.includes(1) || 
                !session.stepsCompleted.includes(2) || 
                !session.stepsCompleted.includes(3)) {
                showAccessDenied();
                return;
            }
            
            updateStepIndicator(3);
            
            // Show timer
            timerDiv.style.display = 'block';
            timeRemaining = 15 * 60; // 15 minutes
            startTimer();
            
            btnContinue.textContent = 'Generate API Key';
            btnContinue.id = 'btnGen';
            output.textContent = 'Ready to generate your API key! 🎉\n\nAll verification steps completed:\n✅ Step 1/3: Completed\n✅ Step 2/3: Completed\n✅ Step 3/3: Completed\n\nClick "Generate API Key" below to get your key.';
            
            // Check for existing key
            checkExistingKey();
            
            btnContinue.addEventListener('click', async () => {
                await generateKey();
            });
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                timeLeftSpan.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    output.textContent = 'Generate key access has expired.\n\nPlease complete verification steps again for security.';
                    btnContinue.style.display = 'none';
                    timerDiv.textContent = 'EXPIRED - Please start over';
                    
                    setTimeout(() => {
                        clearSession();
                        window.location.href = '/';
                    }, 3000);
                }
            }, 1000);
        }

        async function checkExistingKey() {
            try {
                const token = getToken();
                const existingKey = localStorage.getItem(`generated_key_${token}`);
                
                if (existingKey) {
                    const keyData = JSON.parse(existingKey);
                    const expiry = new Date(keyData.expires);
                    
                    if (expiry > new Date()) {
                        currentKey = keyData.key;
                        output.textContent = `Your API Key: ${keyData.key}\n\nExpires: ${expiry.toLocaleString()}\n\nValid for 24 hours from generation.\n\nKey retrieved successfully! 🎉`;
                        btnCopy.style.display = 'block';
                        btnContinue.style.display = 'none';
                        
                        if (timerInterval) {
                            clearInterval(timerInterval);
                            timerDiv.style.display = 'none';
                        }
                        return;
                    }
                }
            } catch (error) {
                console.log('No existing valid key found');
            }
        }

        async function generateKey() {
            const btnGen = document.getElementById('btnGen');
            btnGen.disabled = true;
            btnGen.textContent = 'Generating...';
            btnGen.classList.add('loading');
            
            try {
                const token = getToken();
                const session = getSession();
                
                // Final validation
                if (!session || !session.stepsCompleted.includes(1) || 
                    !session.stepsCompleted.includes(2) || !session.stepsCompleted.includes(3)) {
                    throw new Error('All verification steps must be completed');
                }
                
                // Generate key
                const randomKey = 'sk-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                const expires = new Date(Date.now() + 24 * 60 * 60 * 1000); // 24 hours
                
                const keyData = {
                    key: randomKey,
                    expires: expires.toISOString(),
                    generated: new Date().toISOString(),
                    session: session.id
                };
                
                // Save key
                localStorage.setItem(`generated_key_${token}`, JSON.stringify(keyData));
                
                currentKey = keyData.key;
                
                output.textContent = `Your API Key: ${keyData.key}\n\nExpires: ${expires.toLocaleString()}\n\nValid for 24 hours from generation.\n\nKey generated successfully! 🎉`;
                btnCopy.style.display = 'block';
                btnGen.style.display = 'none';
                
                // Clear timer
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerDiv.style.display = 'none';
                }
                
            } catch (error) {
                console.error('Error generating key:', error);
                output.textContent = `Error: Unable to generate key.\n\n${error.message}\n\nPlease start the verification process again.`;
                
                setTimeout(() => {
                    clearSession();
                    window.location.href = '/';
                }, 3000);
            }
            
            btnGen.disabled = false;
            btnGen.textContent = 'Generate API Key';
            btnGen.classList.remove('loading');
        }

        btnCopy.addEventListener('click', async () => {
            if (currentKey) {
                try {
                    await navigator.clipboard.writeText(currentKey);
                    btnCopy.textContent = 'Copied!';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                    }, 2000);
                } catch (error) {
                    // Fallback for older browsers
                    const textArea = document.createElement('textarea');
                    textArea.value = currentKey;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    btnCopy.textContent = 'Copied!';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                    }, 2000);
                }
            }
        });

        // Initialize the page
        initializePage();

        // Debug logging
        console.log('Page initialized:', {
            path: currentPath,
            session: getSession(),
            token: getToken(),
            urlParams: Object.fromEntries(urlParams.entries())
        });
    </script>
</body>
</html>

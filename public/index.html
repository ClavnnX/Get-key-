<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClavnnX Get key</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #000000 !important;
            color: #ffffff;
        }
        .container {
            background: #222222 !important;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(255,255,255,0.2);
            border: 2px solid #444444;
        }
        h1 {
            text-align: center;
            color: #ffffff !important;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #btnContinue, #btnGen, #btnTakeKey {
            background: #007bff;
            color: white;
        }
        #btnContinue:hover, #btnGen:hover, #btnTakeKey:hover {
            background: #0056b3;
        }
        #btnTakeKey {
            background: #28a745;
            display: none;
            margin-top: 10px;
        }
        #btnTakeKey:hover {
            background: #1e7e34;
        }
        #btnCopy {
            background: #28a745;
            color: white;
            display: none;
        }
        #btnCopy:hover {
            background: #1e7e34;
        }
        #out {
            background: #2d2d2d;
            border: 1px solid #444444;
            border-radius: 8px;
            padding: 20px;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        .step-indicator {
            background: #17a2b8;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .success-message {
            background: #28a745;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        .error-message {
            background: #dc3545;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ClavnnX Get key</h1>
        <div class="step-indicator" id="stepIndicator" style="display: none;">Step Progress</div>
        <button id="btnContinue">Complete the step</button>
        <div id="out">Click "Complete the step" to proceed through verification steps</div>
        <button id="btnTakeKey" style="display: none;">Take the key</button>
        <button id="btnCopy" style="display: none;">Copy Key</button>
    </div>

    <script>
        const btnContinue = document.getElementById('btnContinue');
        const btnTakeKey = document.getElementById('btnTakeKey');
        const btnCopy = document.getElementById('btnCopy');
        const output = document.getElementById('out');
        const stepIndicator = document.getElementById('stepIndicator');
        let currentKey = '';

        // Storage keys - simplified for 2-step process
        const TOKEN_STORAGE_KEY = 'clavnnx_token_step1';
        const STEP_STORAGE_KEY = 'clavnnx_current_step';

        // Token management - 8 minutes validity from step 1
        function saveToken(token) {
            if (token) {
                const tokenData = {
                    token: token,
                    created: Date.now(),
                    expires: Date.now() + (8 * 60 * 1000) // 8 menit dalam milliseconds
                };
                
                localStorage.setItem(TOKEN_STORAGE_KEY, JSON.stringify(tokenData));
                sessionStorage.setItem(TOKEN_STORAGE_KEY, JSON.stringify(tokenData));
                
                console.log('Token saved with 8 minute expiry:', {
                    token: token,
                    expiresAt: new Date(tokenData.expires).toLocaleString()
                });
            }
        }

        function getToken() {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get('token');
            
            if (tokenFromUrl) {
                // Create new token data for URL token
                const tokenData = {
                    token: tokenFromUrl,
                    created: Date.now(),
                    expires: Date.now() + (8 * 60 * 1000) // 8 menit
                };
                localStorage.setItem(TOKEN_STORAGE_KEY, JSON.stringify(tokenData));
                sessionStorage.setItem(TOKEN_STORAGE_KEY, JSON.stringify(tokenData));
                return tokenFromUrl;
            }
            
            // Check stored token
            const storedData = localStorage.getItem(TOKEN_STORAGE_KEY) || sessionStorage.getItem(TOKEN_STORAGE_KEY);
            if (storedData) {
                try {
                    const tokenData = JSON.parse(storedData);
                    
                    // Check if token is still valid
                    if (Date.now() < tokenData.expires) {
                        console.log('Valid token found, expires in:', Math.floor((tokenData.expires - Date.now()) / 1000), 'seconds');
                        return tokenData.token;
                    } else {
                        console.log('Token expired, clearing...');
                        clearToken();
                        return null;
                    }
                } catch (e) {
                    console.error('Error parsing token data:', e);
                    clearToken();
                    return null;
                }
            }
            
            return null;
        }

        function clearToken() {
            localStorage.removeItem(TOKEN_STORAGE_KEY);
            sessionStorage.removeItem(TOKEN_STORAGE_KEY);
            localStorage.removeItem(STEP_STORAGE_KEY);
            sessionStorage.removeItem(STEP_STORAGE_KEY);
            console.log('All tokens and steps cleared');
        }

        function generateToken() {
            const timestamp = Date.now();
            const randomStr = Math.random().toString(36).substring(2, 15);
            return `token_${timestamp}_${randomStr}`;
        }

        // Step management - simplified for 2 steps
        function saveStepProgress(step) {
            localStorage.setItem(STEP_STORAGE_KEY, step.toString());
            sessionStorage.setItem(STEP_STORAGE_KEY, step.toString());
        }

        function getStepProgress() {
            const step = localStorage.getItem(STEP_STORAGE_KEY) || sessionStorage.getItem(STEP_STORAGE_KEY) || '0';
            return parseInt(step);
        }

        function updateStepIndicator(currentStep, totalSteps = 3) {
            stepIndicator.style.display = 'block';
            if (currentStep >= totalSteps) {
                stepIndicator.className = 'success-message';
                stepIndicator.textContent = '✅ All Steps Completed! Ready to generate key';
            } else {
                stepIndicator.className = 'step-indicator';
                stepIndicator.textContent = `Progress: Step ${currentStep}/${totalSteps} Completed`;
            }
        }

        // Get current page info
        const currentPath = window.location.pathname;
        const currentHash = window.location.hash.replace('#', '');
        const urlParams = new URLSearchParams(window.location.search);

        // Initialize page based on current path or hash
        initializePage();

        function initializePage() {
            const route = currentHash || currentPath.replace('/', '') || 'home';
            console.log('Initializing page, route:', route);
            
            if (route === 'home' || route === '' || currentPath === '/') {
                initializeHomePage();
            } else if (route === 'step1' || currentPath === '/step1') {
                initializeStep1Page();
            } else if (route === 'step2' || currentPath === '/step2') {
                initializeStep2Page();
            } else if (route === 'get-your-key' || currentPath === '/get-your-key') {
                initializeGetYourKeyPage();
            } else if (route === 'generate-key-secure-xyz' || currentPath === '/generate-key-secure-xyz') {
                initializeGeneratePage();
            } else {
                initializeHomePage();
            }
        }

        function initializeHomePage() {
            console.log('Initializing Home Page');
            const currentStep = getStepProgress();
            
            if (currentStep > 0) {
                updateStepIndicator(currentStep);
            }
            
            btnContinue.textContent = 'Step 1/3';
            output.textContent = 'Complete verification steps to get your API key\n\nClick "Step 1/3" button below to start the verification process.\n\nStep 1/3 will generate your verification token.';
            
            btnContinue.addEventListener('click', () => {
                console.log('Home button clicked - going to Vertise for Step 1/3');
                btnContinue.textContent = 'Redirecting to Step 1/3...';
                btnContinue.disabled = true;
                
                output.textContent = 'Redirecting to Step 1/3 verification...\n\nAfter completing this step, you will receive a token and proceed to Step 2/3.';
                
                const returnUrl = `${window.location.origin}/step1?completed=1`;
                
                setTimeout(() => {
                    window.location.href = `https://direct-link.net/1385845/QhuxogBGSmxB?return=${encodeURIComponent(returnUrl)}`;
                }, 2000);
            });
        }

        function initializeStep1Page() {
            console.log('Initializing Step 1 Page - TOKEN GENERATION STEP');
            
            // Check if returning from Vertise
            if (urlParams.get('completed') === '1') {
                // Generate token for step 1 completion
                const token = generateToken();
                saveToken(token);
                saveStepProgress(1);
                
                console.log('Step 1 completed - Token generated:', {
                    token: token,
                    saved_localStorage: localStorage.getItem(TOKEN_STORAGE_KEY),
                    step_saved: localStorage.getItem(STEP_STORAGE_KEY)
                });
                
                updateStepIndicator(1);
                output.textContent = `Step 1/3 completed successfully! ✅\n\n🎉 TOKEN GENERATED: ${token}\n\nThis token will be used for key generation.\nToken is valid for 8 minutes.\n\nRedirecting to Step 2/3...`;
                btnContinue.style.display = 'none';
                
                setTimeout(() => {
                    if (currentPath.includes('/step1')) {
                        window.location.href = `/step2`;
                    } else {
                        window.location.href = `#step2`;
                    }
                }, 4000); // Show token for 4 seconds
                return;
            }
            
            const currentStep = getStepProgress();
            updateStepIndicator(Math.max(currentStep, 0));
            
            btnContinue.textContent = 'Step 1/3 - Generate Token';
            output.textContent = 'Step 1 of 3: Token Generation Step\n\nThis step will generate your verification token.\nClick the button below to complete Step 1/3.\n\nAfter completion, you will receive a token valid for 8 minutes.';
            
            btnContinue.addEventListener('click', () => {
                output.textContent = 'Step 1/3 starting... You will be redirected to complete verification.\n\nAfter completing this step, you will receive a token and proceed to step 2/3.';
                btnContinue.textContent = 'Redirecting...';
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step1?completed=1`;
                
                setTimeout(() => {
                    window.location.href = `https://direct-link.net/1385845/QhuxogBGSmxB?return=${encodeURIComponent(returnUrl)}`;
                }, 2000);
            });
        }

        function initializeStep2Page() {
            console.log('Initializing Step 2 Page - FINAL VERIFICATION');
            
            const token = getToken();
            
            // Check if returning from Vertise
            if (urlParams.get('completed') === '2') {
                if (!token) {
                    // Token expired during step 2
                    stepIndicator.style.display = 'block';
                    stepIndicator.className = 'error-message';
                    stepIndicator.textContent = '❌ Token Expired';
                    
                    output.textContent = 'Step 2/3 completed, but your token has expired.\n\nTokens are valid for 8 minutes after Step 1/3.\n\nPlease start over from Step 1/3 to generate a new token.';
                    btnContinue.textContent = 'Start Over';
                    btnContinue.addEventListener('click', () => {
                        clearToken();
                        window.location.href = '/';
                    });
                    return;
                }
                
                saveStepProgress(2);
                updateStepIndicator(2);
                output.textContent = 'Step 2/3 completed successfully! ✅\n\nStep 1/3: ✅ Completed (Token Generated)\nStep 2/3: ✅ Completed\n\nAll verification steps completed!\nRedirecting to token validation...';
                btnContinue.style.display = 'none';
                
                setTimeout(() => {
                    if (currentPath.includes('/step2')) {
                        window.location.href = `/get-your-key`;
                    } else {
                        window.location.href = `#get-your-key`;
                    }
                }, 2000);
                return;
            }
            
            // Check if token exists
            if (!token) {
                stepIndicator.style.display = 'block';
                stepIndicator.className = 'error-message';
                stepIndicator.textContent = '❌ No Token Found';
                
                output.textContent = 'Step 2/3: Final Verification\n\n❌ NO TOKEN FOUND\n\nYou need to complete Step 1/3 first to generate a token.\n\nTokens are valid for 8 minutes.\n\nClick "Start Over" to begin from Step 1/3.';
                btnContinue.textContent = 'Start Over';
                btnContinue.addEventListener('click', () => {
                    clearToken();
                    window.location.href = '/';
                });
                return;
            }
            
            const currentStep = getStepProgress();
            updateStepIndicator(Math.max(currentStep, 1));
            
            btnContinue.textContent = 'Step 2/3 - Final Verification';
            output.textContent = `Step 2 of 3: Final Verification\n\nStep 1/3: ✅ Completed (Token Generated)\nToken: ${token}\n\nClick the button below to complete the final verification step.\n\nAfter this step, you can generate your API key.`;
            
            btnContinue.addEventListener('click', () => {
                output.textContent = 'Step 2/3 starting... You will be redirected to complete final verification.\n\nAfter completing this step, you can generate your API key.';
                btnContinue.textContent = 'Redirecting...';
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step2?completed=2`;
                
                setTimeout(() => {
                    window.location.href = `https://link-target.net/1385845/05NfA4wGJcIe?return=${encodeURIComponent(returnUrl)}`;
                }, 2000);
            });
        }

        function initializeGetYourKeyPage() {
            console.log('Initializing Get Your Key Page - TOKEN VALIDATION');
            
            const token = getToken();
            const currentStep = getStepProgress();
            
            console.log('Get Your Key validation:', {
                token: token,
                currentStep: currentStep,
                hasToken: !!token,
                stepComplete: currentStep >= 2
            });
            
            if (!token || currentStep < 2) {
                stepIndicator.style.display = 'block';
                stepIndicator.className = 'error-message';
                stepIndicator.textContent = '❌ Invalid Access';
                
                btnContinue.textContent = 'Start Over';
                output.textContent = `Get Your Key\n\n❌ INVALID ACCESS\n\nDebug Information:\nToken: ${token || 'EXPIRED/NONE'}\nCurrent Step: ${currentStep}/2\nToken Required: YES (from Step 1/3)\nSteps Required: 2/2 completed\n\nMissing:\n${!token ? '- Token from Step 1/3 (may be expired after 8 minutes)\n' : ''}${currentStep < 2 ? '- Complete all verification steps\n' : ''}\nClick "Start Over" to begin verification.`;
                
                btnContinue.addEventListener('click', () => {
                    clearToken();
                    if (currentPath.includes('/get-your-key')) {
                        window.location.href = '/';
                    } else {
                        window.location.href = '#home';
                    }
                });
                return;
            }
            
            // Valid token and completed steps
            updateStepIndicator(3, 3);
            btnContinue.textContent = 'Generate Your API Key';
            btnContinue.style.background = '#28a745';
            
            output.textContent = `Get Your Key\n\n✅ VALID ACCESS CONFIRMED\n\nToken: ${token}\nSteps Completed: ${currentStep}/2\nAll Requirements: ✅ MET\n\nYou can now generate your API key!\n\nClick the button below to proceed to key generation.`;
            
            btnContinue.addEventListener('click', () => {
                btnContinue.textContent = 'Loading...';
                btnContinue.disabled = true;
                
                setTimeout(() => {
                    if (currentPath.includes('/get-your-key')) {
                        window.location.href = `/generate-key-secure-xyz?token=${token}`;
                    } else {
                        window.location.href = `#generate-key-secure-xyz?token=${token}`;
                    }
                }, 1000);
            });
        }

        function initializeGeneratePage() {
            console.log('Initializing Generate Key Page');
            
            const token = getToken();
            const currentStep = getStepProgress();
            
            console.log('Generate page validation:', {
                token: token,
                currentStep: currentStep,
                hasToken: !!token,
                stepComplete: currentStep >= 2
            });
            
            // SIMPLIFIED VALIDATION - only check if token exists and step >= 2
            if (!token || currentStep < 2) {
                stepIndicator.style.display = 'block';
                stepIndicator.className = 'error-message';
                stepIndicator.textContent = '❌ Access Denied';
                
                let errorMsg = 'Error: Invalid access to generate key page.\n\nMissing requirements:\n';
                if (!token) {
                    errorMsg += '- No valid token found (token may have expired after 8 minutes)\n- Please complete Step 1/3 again to generate new token\n';
                }
                if (currentStep < 2) {
                    errorMsg += '- Steps incomplete (complete all verification steps)\n';
                }
                errorMsg += '\nPlease complete all verification steps first.';
                
                output.textContent = errorMsg;
                btnContinue.textContent = 'Start Over';
                btnContinue.addEventListener('click', () => {
                    clearToken();
                    window.location.href = '/';
                });
                return;
            }
            
            // Show final step indicator
            updateStepIndicator(3, 3);
            
            btnContinue.textContent = 'Generate Key';
            btnContinue.id = 'btnGen';
            output.textContent = `Ready to generate your API key! 🎉\n\nToken: ${token}\nAll verification steps completed!\n\nClick "Generate Key" below to get your API key.\n\nNote: Token is valid for 8 minutes from Step 1/3 completion.`;
            
            // Check for existing key first
            checkExistingKey();
            
            btnContinue.addEventListener('click', async () => {
                await generateKey();
            });
        }

        async function checkExistingKey() {
            try {
                const token = getToken();
                if (!token) return;
                
                const existingKey = localStorage.getItem(`generated_key_${token}`);
                if (existingKey) {
                    const keyData = JSON.parse(existingKey);
                    const expiry = new Date(keyData.expires);
                    
                    if (expiry > new Date()) {
                        currentKey = keyData.key;
                        output.textContent = `Key: ${keyData.key}\n\nExpires: ${expiry.toLocaleString()}\n\nValid for 24 hours from generation.\n\nExisting key loaded (anti-refresh protection)`;
                        btnCopy.style.display = 'block';
                        btnContinue.style.display = 'none';
                        return;
                    }
                }
            } catch (error) {
                console.log('No existing key found');
            }
        }

        async function generateKey() {
            const btnGen = document.getElementById('btnGen');
            btnGen.disabled = true;
            btnGen.textContent = 'Generating...';
            btnGen.classList.add('loading');
            
            try {
                const token = getToken();
                const currentStep = getStepProgress();
                
                console.log('Generate key validation:', {
                    token: token,
                    currentStep: currentStep,
                    hasToken: !!token,
                    stepComplete: currentStep >= 2
                });
                
                // SIMPLIFIED VALIDATION - check if token is still valid
                if (!token) {
                    throw new Error('Token expired or not found. Token is valid for 8 minutes after Step 1/3 completion. Please complete Step 1/3 again.');
                }
                
                if (currentStep < 2) {
                    throw new Error('Incomplete verification. Please complete all verification steps.');
                }
                
                // Generate API key
                const randomKey = 'sk-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                const expires = new Date(Date.now() + 24 * 60 * 60 * 1000);
                
                const keyData = {
                    key: randomKey,
                    expires: expires.toISOString(),
                    generated: new Date().toISOString(),
                    generatedWith: token
                };
                
                localStorage.setItem(`generated_key_${token}`, JSON.stringify(keyData));
                
                currentKey = keyData.key;
                
                output.textContent = `Key: ${keyData.key}\n\nExpires: ${expires.toLocaleString()}\n\nValid for 24 hours from generation.\n\nKey generated successfully! 🎉\n\nGenerated with token: ${token}`;
                btnCopy.style.display = 'block';
                btnGen.style.display = 'none';
                
                console.log('Key generated successfully:', keyData);
                
            } catch (error) {
                console.error('Error generating key:', error);
                output.textContent = `Error: ${error.message}\n\nDebug Info:\nToken: ${getToken() || 'EXPIRED/NONE'}\nStep: ${getStepProgress()}\n\nIf token expired, please start from Step 1/3 to generate new token.`;
                
                // Don't auto-redirect, let user see the error
                setTimeout(() => {
                    btnGen.textContent = 'Try Again';
                    btnGen.disabled = false;
                    btnGen.classList.remove('loading');
                }, 2000);
            }
        }

        btnCopy.addEventListener('click', async () => {
            if (currentKey) {
                try {
                    await navigator.clipboard.writeText(currentKey);
                    btnCopy.textContent = 'Copied!';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                    }, 2000);
                } catch (error) {
                    const textArea = document.createElement('textarea');
                    textArea.value = currentKey;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    btnCopy.textContent = 'Copied!';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                    }, 2000);
                }
            }
        });

        // Debug logging - Enhanced
        console.log('=== PAGE LOADED DEBUG INFO ===');
        const tokenData = localStorage.getItem(TOKEN_STORAGE_KEY) || sessionStorage.getItem(TOKEN_STORAGE_KEY);
        let tokenInfo = 'No token';
        
        if (tokenData) {
            try {
                const parsed = JSON.parse(tokenData);
                const timeLeft = Math.max(0, Math.floor((parsed.expires - Date.now()) / 1000));
                tokenInfo = {
                    token: parsed.token,
                    created: new Date(parsed.created).toLocaleString(),
                    expires: new Date(parsed.expires).toLocaleString(),
                    secondsLeft: timeLeft,
                    isValid: timeLeft > 0
                };
            } catch (e) {
                tokenInfo = 'Invalid token data';
            }
        }
        
        console.log('Current Details:', {
            path: currentPath,
            hash: currentHash,
            urlParams: Object.fromEntries(urlParams.entries()),
            currentToken: getToken(),
            tokenDetails: tokenInfo,
            currentStep: getStepProgress(),
            localStorage_step: localStorage.getItem(STEP_STORAGE_KEY),
            sessionStorage_step: sessionStorage.getItem(STEP_STORAGE_KEY)
        });
        console.log('=== END DEBUG INFO ===');
    </script>
</body>
    </html>

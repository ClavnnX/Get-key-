<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClavnnX Get key</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #000000 !important;
            color: #ffffff;
        }
        .container {
            background: #222222 !important;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(255,255,255,0.2);
            border: 2px solid #444444;
        }
        h1 {
            text-align: center;
            color: #ffffff !important;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #btnContinue, #btnGen, #btnTakeKey {
            background: #007bff;
            color: white;
        }
        #btnContinue:hover, #btnGen:hover, #btnTakeKey:hover {
            background: #0056b3;
        }
        #btnTakeKey {
            background: #28a745;
            display: none;
            margin-top: 10px;
        }
        #btnTakeKey:hover {
            background: #1e7e34;
        }
        #btnCopy {
            background: #28a745;
            color: white;
            display: none;
        }
        #btnCopy:hover {
            background: #1e7e34;
        }
        #out {
            background: #2d2d2d;
            border: 1px solid #444444;
            border-radius: 8px;
            padding: 20px;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        .timer {
            background: #dc3545;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        .step-indicator {
            background: #17a2b8;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .success-message {
            background: #28a745;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ClavnnX Get key</h1>
        <div class="step-indicator" id="stepIndicator" style="display: none;">Step Progress</div>
        <button id="btnContinue">Complete the step</button>
        <div class="timer" id="timer">Generate key link expires in: <span id="timeLeft">5:00</span></div>
        <div id="out">Click "Complete the step" to proceed through verification steps</div>
        <button id="btnTakeKey" style="display: none;">Take the key</button>
        <button id="btnCopy" style="display: none;">Copy Key</button>
    </div>

    <script>
        const btnContinue = document.getElementById('btnContinue');
        const btnTakeKey = document.getElementById('btnTakeKey');
        const btnCopy = document.getElementById('btnCopy');
        const output = document.getElementById('out');
        const timerDiv = document.getElementById('timer');
        const timeLeftSpan = document.getElementById('timeLeft');
        const stepIndicator = document.getElementById('stepIndicator');
        let currentKey = '';
        let timerInterval = null;
        let timeRemaining = 0;

        // Storage keys
        const TOKEN_STORAGE_KEY = 'clavnnx_verify_token';
        const STEP_STORAGE_KEY = 'clavnnx_current_step';
        const VERTISE_COMPLETION_KEY = 'clavnnx_vertise_completion';
        const STEP_REDIRECT_KEY = 'clavnnx_step_redirect';

        // Token management functions
        function saveToken(token) {
            if (token) {
                localStorage.setItem(TOKEN_STORAGE_KEY, token);
                sessionStorage.setItem(TOKEN_STORAGE_KEY, token);
            }
        }

        function getToken() {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get('token');
            
            if (tokenFromUrl) {
                saveToken(tokenFromUrl);
                return tokenFromUrl;
            }
            
            return localStorage.getItem(TOKEN_STORAGE_KEY) || sessionStorage.getItem(TOKEN_STORAGE_KEY);
        }

        function clearToken() {
            localStorage.removeItem(TOKEN_STORAGE_KEY);
            sessionStorage.removeItem(TOKEN_STORAGE_KEY);
            localStorage.removeItem(STEP_STORAGE_KEY);
            sessionStorage.removeItem(STEP_STORAGE_KEY);
            localStorage.removeItem(VERTISE_COMPLETION_KEY);
            sessionStorage.removeItem(VERTISE_COMPLETION_KEY);
            localStorage.removeItem(STEP_REDIRECT_KEY);
            sessionStorage.removeItem(STEP_REDIRECT_KEY);
        }

        function generateToken() {
            const timestamp = Date.now();
            const randomStr = Math.random().toString(36).substring(2, 15);
            return `token_${timestamp}_${randomStr}`;
        }

        // Step management with anti-bypass protection
        function saveStepProgress(step) {
            localStorage.setItem(STEP_STORAGE_KEY, step.toString());
            sessionStorage.setItem(STEP_STORAGE_KEY, step.toString());
        }

        function getStepProgress() {
            const step = localStorage.getItem(STEP_STORAGE_KEY) || sessionStorage.getItem(STEP_STORAGE_KEY) || '0';
            return parseInt(step);
        }

        // Vertise completion tracking with proper validation
        function saveVertiseCompletion(step, validationData) {
            const completions = getVertiseCompletions();
            completions[step] = {
                timestamp: Date.now(),
                userAgent: navigator.userAgent,
                referrer: document.referrer,
                validationCode: generateValidationCode(step),
                ...validationData
            };
            
            localStorage.setItem(VERTISE_COMPLETION_KEY, JSON.stringify(completions));
            sessionStorage.setItem(VERTISE_COMPLETION_KEY, JSON.stringify(completions));
        }

        function getVertiseCompletions() {
            const stored = localStorage.getItem(VERTISE_COMPLETION_KEY) || sessionStorage.getItem(VERTISE_COMPLETION_KEY);
            return stored ? JSON.parse(stored) : {};
        }

        // Generate unique validation code to prevent manipulation
        function generateValidationCode(step) {
            const timestamp = Date.now();
            const userAgent = navigator.userAgent.slice(0, 20);
            const random = Math.random().toString(36).substring(2, 8);
            return btoa(`${step}_${timestamp}_${userAgent}_${random}`);
        }

        function validateVertiseCompletion(step) {
            const completions = getVertiseCompletions();
            if (!completions[step]) return false;
            
            // Check if completion was recent (within reasonable time)
            const timeDiff = Date.now() - completions[step].timestamp;
            const maxAllowedTime = 2 * 60 * 60 * 1000; // 2 hours
            
            return timeDiff <= maxAllowedTime && completions[step].validationCode;
        }

        // Track step redirections to Vertise (anti-bypass mechanism)
        function saveStepRedirection(step) {
            const redirections = getStepRedirections();
            redirections[step] = {
                timestamp: Date.now(),
                redirected: true,
                completed: false
            };
            
            localStorage.setItem(STEP_REDIRECT_KEY, JSON.stringify(redirections));
            sessionStorage.setItem(STEP_REDIRECT_KEY, JSON.stringify(redirections));
        }

        function markRedirectionCompleted(step) {
            const redirections = getStepRedirections();
            if (redirections[step]) {
                redirections[step].completed = true;
                redirections[step].completedAt = Date.now();
                
                localStorage.setItem(STEP_REDIRECT_KEY, JSON.stringify(redirections));
                sessionStorage.setItem(STEP_REDIRECT_KEY, JSON.stringify(redirections));
            }
        }

        function getStepRedirections() {
            const stored = localStorage.getItem(STEP_REDIRECT_KEY) || sessionStorage.getItem(STEP_REDIRECT_KEY);
            return stored ? JSON.parse(stored) : {};
        }

        function validateStepRedirection(step) {
            const redirections = getStepRedirections();
            if (!redirections[step]) return false;
            
            // Must have been redirected AND completed
            return redirections[step].redirected && redirections[step].completed;
        }

        function updateStepIndicator(currentStep, totalSteps = 3) {
            stepIndicator.style.display = 'block';
            stepIndicator.textContent = `Progress: Step ${currentStep}/${totalSteps} Completed`;
            
            if (currentStep >= totalSteps) {
                stepIndicator.className = 'success-message';
                stepIndicator.textContent = '✅ All Steps Completed! Ready to generate key';
            }
        }

        // Get current page info - support both path and hash routing
        const currentPath = window.location.pathname;
        const currentHash = window.location.hash.replace('#', '');
        const urlParams = new URLSearchParams(window.location.search);
        let token = getToken();

        // Initialize page based on current path or hash
        initializePage();

        function initializePage() {
            const route = currentHash || currentPath.replace('/', '') || 'home';
            
            if (route === 'home' || route === '') {
                initializeHomePage();
            } else if (route === 'step1') {
                initializeStep1Page();
            } else if (route === 'step2') {
                initializeStep2Page();
            } else if (route === 'step3') {
                initializeStep3Page();
            } else if (route === 'generate-key-secure-xyz') {
                initializeGeneratePage();
            } else if (currentPath === '/') {
                initializeHomePage();
            } else if (currentPath === '/step1') {
                initializeStep1Page();
            } else if (currentPath === '/step2') {
                initializeStep2Page();
            } else if (currentPath === '/step3') {
                initializeStep3Page();
            } else if (currentPath === '/generate-key-secure-xyz') {
                initializeGeneratePage();
            }
        }

        function initializeHomePage() {
            if (!token) {
                token = generateToken();
                saveToken(token);
            }
            
            const currentStep = getStepProgress();
            if (currentStep > 0) {
                updateStepIndicator(currentStep);
            }
            
            btnContinue.textContent = 'Complete the step';
            output.textContent = 'Complete verification steps to get your API key\n\nClick the button below to start the verification process.';
            
            btnContinue.addEventListener('click', () => {
                if (currentStep >= 3) {
                    // Check if all steps were properly completed through Vertise
                    if (validateVertiseCompletion(1) && validateVertiseCompletion(2) && validateVertiseCompletion(3) &&
                        validateStepRedirection(1) && validateStepRedirection(2) && validateStepRedirection(3)) {
                        window.location.href = `#generate-key-secure-xyz?token=${token}`;
                    } else {
                        // Reset if any step was bypassed
                        output.textContent = 'Some verification steps were not completed properly.\n\nPlease complete all steps through the proper verification process.';
                        setTimeout(() => {
                            clearToken();
                            window.location.reload();
                        }, 3000);
                    }
                } else {
                    window.location.href = `#step1?token=${token}`;
                }
            });
        }

        function initializeStep1Page() {
            if (!token) {
                token = generateToken();
                saveToken(token);
            }
            
            const currentStep = getStepProgress();
            updateStepIndicator(Math.max(currentStep, 0));
            
            // Check if returning from Vertise
            if (urlParams.get('vertise_completed') === '1') {
                saveStepProgress(1);
                saveVertiseCompletion(1, { returnUrl: window.location.href });
                markRedirectionCompleted(1);
                
                updateStepIndicator(1);
                output.textContent = 'Step 1 completed successfully! ✅\n\nRedirecting to Step 2...';
                btnContinue.style.display = 'none';
                
                setTimeout(() => {
                    window.location.href = `/step2?token=${token}`;
                }, 2000);
                return;
            }
            
            btnContinue.textContent = 'Step 1/3 - Complete Verification';
            output.textContent = 'Step 1 of 3: Verification Process\n\nClick the button below to complete the first verification step.\n\nAfter clicking, you will be redirected to complete the verification task.';
            
            btnContinue.addEventListener('click', () => {
                // Save that we're redirecting to Vertise for this step
                saveStepRedirection(1);
                
                output.textContent = 'Step 1 starting... You will be redirected to complete verification.\n\nAfter completing the task, you will return to step 2.';
                btnContinue.textContent = 'Redirecting...';
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step1?token=${token}&vertise_completed=1`;
                
                setTimeout(() => {
                    window.location.href = `https://link-hub.net/1385845/vx4xk8JD7x7z?return=${encodeURIComponent(returnUrl)}`;
                }, 2000);
            });
        }

        function initializeStep2Page() {
            if (!token) {
                output.textContent = 'Error: No verification token found. Please start the verification process again.';
                btnContinue.textContent = 'Start Over';
                btnContinue.addEventListener('click', () => {
                    clearToken();
                    window.location.href = '/';
                });
                return;
            }
            
            // Check if returning from Vertise
            if (urlParams.get('vertise_completed') === '2') {
                saveStepProgress(2);
                saveVertiseCompletion(2, { returnUrl: window.location.href });
                markRedirectionCompleted(2);
                
                updateStepIndicator(2);
                output.textContent = 'Step 2 completed successfully! ✅\n\nStep 1: ✅ Completed\nStep 2: ✅ Completed\n\nRedirecting to Step 3...';
                btnContinue.style.display = 'none';
                
                setTimeout(() => {
                    window.location.href = `/step3?token=${token}`;
                }, 2000);
                return;
            }
            
            const currentStep = getStepProgress();
            updateStepIndicator(Math.max(currentStep, 1));
            
            btnContinue.textContent = 'Step 2/3 - Complete Verification';
            output.textContent = 'Step 2 of 3: Verification Process\n\nStep 1 completed successfully! ✅\n\nClick the button below to complete the second verification step.';
            
            btnContinue.addEventListener('click', () => {
                // Save that we're redirecting to Vertise for this step
                saveStepRedirection(2);
                
                output.textContent = 'Step 2 starting... You will be redirected to complete verification.\n\nAfter completing the task, you will return to step 3.';
                btnContinue.textContent = 'Redirecting...';
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step2?token=${token}&vertise_completed=2`;
                
                setTimeout(() => {
                    window.location.href = `https://direct-link.net/1385845/z8W0KStN0g82?return=${encodeURIComponent(returnUrl)}`;
                }, 2000);
            });
        }

        function initializeStep3Page() {
            if (!token) {
                output.textContent = 'Error: No verification token found. Please start the verification process again.';
                btnContinue.textContent = 'Start Over';
                btnContinue.addEventListener('click', () => {
                    clearToken();
                    window.location.href = '/';
                });
                return;
            }
            
            // FIXED: Check if returning from Vertise with proper completion
            if (urlParams.get('vertise_completed') === '3') {
                // Save the completion first
                saveStepProgress(3);
                saveVertiseCompletion(3, { returnUrl: window.location.href });
                markRedirectionCompleted(3);
                
                updateStepIndicator(3);
                output.textContent = 'All verification steps completed! ✅\n\nStep 1: ✅ Completed\nStep 2: ✅ Completed  \nStep 3: ✅ Completed\n\nRedirecting to generate your API key...';
                btnContinue.style.display = 'none';
                
                // FIXED: Immediately redirect to generate key page after completing step 3
                setTimeout(() => {
                    // Remove the completion parameter and redirect to generate key
                    const cleanUrl = `${window.location.origin}/generate-key-secure-xyz?token=${token}`;
                    window.location.href = cleanUrl;
                }, 2000);
                return;
            }
            
            const currentStep = getStepProgress();
            
            // FIXED: Check if all steps are already completed - redirect to generate key
            if (currentStep >= 3 && 
                validateVertiseCompletion(1) && validateVertiseCompletion(2) && validateVertiseCompletion(3) &&
                validateStepRedirection(1) && validateStepRedirection(2) && validateStepRedirection(3)) {
                
                updateStepIndicator(3);
                output.textContent = 'All verification steps completed! ✅\n\nStep 1: ✅ Completed\nStep 2: ✅ Completed  \nStep 3: ✅ Completed\n\nRedirecting to generate your API key...';
                btnContinue.style.display = 'none';
                
                // Auto redirect to generate key page
                setTimeout(() => {
                    window.location.href = `/generate-key-secure-xyz?token=${token}`;
                }, 1500);
                return;
            }
            
            updateStepIndicator(Math.max(currentStep, 2));
            
            btnContinue.textContent = 'Step 3/3 - Complete Verification';
            output.textContent = 'Step 3 of 3: Final Verification\n\nStep 1: ✅ Completed\nStep 2: ✅ Completed\n\nClick the button below to complete the final verification step.';
            
            btnContinue.addEventListener('click', () => {
                // Save redirection BEFORE going to Vertise
                saveStepRedirection(3);
                
                output.textContent = 'Step 3 starting... You will be redirected to complete verification.\n\nAfter completing the task, you will automatically be redirected to generate your API key.';
                btnContinue.textContent = 'Redirecting...';
                btnContinue.disabled = true;
                
                // FIXED: Return URL should come back to step3 first, then auto-redirect
                const returnUrl = `${window.location.origin}/step3?token=${token}&vertise_completed=3`;
                
                setTimeout(() => {
                    window.location.href = `https://link-center.net/1385845/tgUMK8TgIBn1?return=${encodeURIComponent(returnUrl)}`;
                }, 2000);
            });
        }

        function initializeGeneratePage() {
            if (!token) {
                output.textContent = 'Error: No verification token found. Please complete all verification steps first.';
                btnContinue.textContent = 'Start Over';
                btnContinue.addEventListener('click', () => {
                    clearToken();
                    window.location.href = '/';
                });
                return;
            }

            const currentStep = getStepProgress();
            
            // STRICT VALIDATION - Check both completion AND redirection tracking
            if (currentStep < 3 || 
                !validateVertiseCompletion(1) || !validateVertiseCompletion(2) || !validateVertiseCompletion(3) ||
                !validateStepRedirection(1) || !validateStepRedirection(2) || !validateStepRedirection(3)) {
                
                output.textContent = 'Error: All verification steps must be completed through the proper process.\n\nDetected incomplete or bypassed verification.\n\nPlease complete all steps properly.';
                btnContinue.textContent = 'Start Over';
                btnContinue.addEventListener('click', () => {
                    clearToken();
                    window.location.href = '/';
                });
                return;
            }
            
            // Show final step indicator
            updateStepIndicator(3);
            
            // Show timer
            timerDiv.style.display = 'block';
            timeRemaining = 15 * 60; // 15 minutes
            startTimer();
            
            btnContinue.textContent = 'Generate Key';
            btnContinue.id = 'btnGen';
            output.textContent = `Ready to generate your API key! 🎉\n\nAll verification steps completed:\n✅ Step 1/3: Completed\n✅ Step 2/3: Completed\n✅ Step 3/3: Completed\n\nClick "Generate Key" below to get your API key.\n\nNote: This page will expire in 15 minutes for security.`;
            
            // Check for existing key first
            checkExistingKey();
            
            btnContinue.addEventListener('click', async () => {
                await generateKey();
            });
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                timeLeftSpan.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    output.textContent = 'Generate key access has expired. Please complete verification steps again.';
                    btnContinue.style.display = 'none';
                    timerDiv.textContent = 'EXPIRED - Please start over';
                    
                    setTimeout(() => {
                        clearToken();
                        window.location.href = '/';
                    }, 3000);
                }
            }, 1000);
        }

        async function checkExistingKey() {
            try {
                const existingKey = localStorage.getItem(`generated_key_${token}`);
                if (existingKey) {
                    const keyData = JSON.parse(existingKey);
                    const expiry = new Date(keyData.expires);
                    
                    if (expiry > new Date()) {
                        currentKey = keyData.key;
                        output.textContent = `Key: ${keyData.key}\n\nExpires: ${expiry.toLocaleString()}\n\nValid for 24 hours from generation.\n\nExisting key loaded (anti-refresh protection)`;
                        btnCopy.style.display = 'block';
                        btnContinue.style.display = 'none';
                        
                        if (timerInterval) {
                            clearInterval(timerInterval);
                            timerDiv.style.display = 'none';
                        }
                        return;
                    }
                }
            } catch (error) {
                console.log('No existing key found');
            }
        }

        async function generateKey() {
            const btnGen = document.getElementById('btnGen');
            btnGen.disabled = true;
            btnGen.textContent = 'Generating...';
            btnGen.classList.add('loading');
            
            try {
                const currentStep = getStepProgress();
                
                // Final validation before key generation
                if (currentStep < 3 || 
                    !validateVertiseCompletion(1) || !validateVertiseCompletion(2) || !validateVertiseCompletion(3) ||
                    !validateStepRedirection(1) || !validateStepRedirection(2) || !validateStepRedirection(3)) {
                    
                    throw new Error('All verification steps must be completed through proper Vertise flow. Bypass attempt detected.');
                }
                
                // Generate API key
                const randomKey = 'sk-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                const expires = new Date(Date.now() + 24 * 60 * 60 * 1000);
                
                const keyData = {
                    key: randomKey,
                    expires: expires.toISOString(),
                    generated: new Date().toISOString()
                };
                
                localStorage.setItem(`generated_key_${token}`, JSON.stringify(keyData));
                
                currentKey = keyData.key;
                
                output.textContent = `Key: ${keyData.key}\n\nExpires: ${expires.toLocaleString()}\n\nValid for 24 hours from generation.\n\nKey generated successfully! 🎉`;
                btnCopy.style.display = 'block';
                btnGen.style.display = 'none';
                
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerDiv.style.display = 'none';
                }
                
            } catch (error) {
                console.error('Error generating key:', error);
                output.textContent = `Error: ${error.message}\n\nPlease complete all verification steps properly.`;
                
                setTimeout(() => {
                    clearToken();
                    window.location.href = '/';
                }, 3000);
            }
            
            btnGen.disabled = false;
            btnGen.textContent = 'Generate Key';
            btnGen.classList.remove('loading');
        }

        btnCopy.addEventListener('click', async () => {
            if (currentKey) {
                try {
                    await navigator.clipboard.writeText(currentKey);
                    btnCopy.textContent = 'Copied!';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                    }, 2000);
                } catch (error) {
                    const textArea = document.createElement('textarea');
                    textArea.value = currentKey;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    btnCopy.textContent = 'Copied!';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                    }, 2000);
                }
            }
        });

        // Debug logging
        console.log('Page loaded:', {
            path: currentPath,
            token: token,
            currentStep: getStepProgress(),
            vertiseCompletions: getVertiseCompletions(),
            stepRedirections: getStepRedirections()
        });
    </script>
</body>
    </html>

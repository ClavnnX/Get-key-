<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClavnnX Get key</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #000000 !important;
            color: #ffffff;
        }
        .container {
            background: #222222 !important;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(255,255,255,0.2);
            border: 2px solid #444444;
        }
        h1 {
            text-align: center;
            color: #ffffff !important;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }
        #btnContinue, #btnGen, #btnTakeKey {
            background: #007bff;
            color: white;
        }
        #btnContinue:hover, #btnGen:hover, #btnTakeKey:hover {
            background: #0056b3;
        }
        #btnTakeKey {
            background: #28a745;
            display: none;
            margin-top: 10px;
        }
        #btnTakeKey:hover {
            background: #1e7e34;
        }
        #btnCopy {
            background: #28a745;
            color: white;
            display: none;
        }
        #btnCopy:hover {
            background: #1e7e34;
        }
        #out {
            background: #2d2d2d;
            border: 1px solid #444444;
            border-radius: 8px;
            padding: 20px;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        .step-indicator {
            background: #17a2b8;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .success-message {
            background: #28a745;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        .error-message {
            background: #dc3545;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ClavnnX Get key</h1>
        <div class="step-indicator" id="stepIndicator" style="display: none;"></div>
        <button id="btnContinue">Complete the step</button>
        <div id="out">Click the button Step for get the key</div>
        <button id="btnTakeKey" style="display: none;">Take the key</button>
        <button id="btnCopy" style="display: none;">Copy Key</button>
    </div>

    <script>
        // Cache DOM elements for better performance
        const btnContinue = document.getElementById('btnContinue');
        const btnTakeKey = document.getElementById('btnTakeKey');
        const btnCopy = document.getElementById('btnCopy');
        const output = document.getElementById('out');
        const stepIndicator = document.getElementById('stepIndicator');
        let currentKey = '';

        // Storage keys
        const TOKEN_KEY = 'clavnnx_token_step1';
        const STEP_KEY = 'clavnnx_current_step';

        // Optimized storage operations
        const storage = {
            set: (key, value) => {
                try {
                    const data = JSON.stringify(value);
                    localStorage.setItem(key, data);
                    sessionStorage.setItem(key, data);
                } catch (e) {
                    console.warn('Storage failed:', e);
                }
            },
            get: (key) => {
                try {
                    return JSON.parse(localStorage.getItem(key) || sessionStorage.getItem(key) || 'null');
                } catch (e) {
                    return null;
                }
            },
            remove: (key) => {
                localStorage.removeItem(key);
                sessionStorage.removeItem(key);
            }
        };

        // Token management
        function saveToken(token) {
            if (token) {
                storage.set(TOKEN_KEY, {
                    token: token,
                    created: Date.now(),
                    expires: Date.now() + (8 * 60 * 1000)
                });
            }
        }

        function getToken() {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get('token');
            
            if (tokenFromUrl) {
                saveToken(tokenFromUrl);
                return tokenFromUrl;
            }
            
            const tokenData = storage.get(TOKEN_KEY);
            if (tokenData && Date.now() < tokenData.expires) {
                return tokenData.token;
            }
            
            clearToken();
            return null;
        }

        function clearToken() {
            storage.remove(TOKEN_KEY);
            storage.remove(STEP_KEY);
        }

        function generateToken() {
            return `token_${Date.now()}_${Math.random().toString(36).substring(2, 15)}`;
        }

        // Step management
        function saveStepProgress(step) {
            storage.set(STEP_KEY, step);
        }

        function getStepProgress() {
            const step = storage.get(STEP_KEY) || 0;
            return Math.max(0, Math.min(2, parseInt(step)));
        }

        function updateStepIndicator(currentStep, totalSteps = 2) {
            stepIndicator.style.display = 'block';
            if (currentStep >= totalSteps) {
                stepIndicator.className = 'success-message';
                stepIndicator.textContent = '✅ All Steps Completed! Ready to generate key';
            } else {
                stepIndicator.className = 'step-indicator';
                stepIndicator.textContent = `Step ${currentStep}/${totalSteps} Completed`;
            }
        }

        // Page routing - optimized
        const route = window.location.hash.replace('#', '') || window.location.pathname.replace('/', '') || 'home';
        const urlParams = new URLSearchParams(window.location.search);

        // Initialize based on route
        function init() {
            switch(route) {
                case 'step1':
                    initStep1();
                    break;
                case 'step2':  
                    initStep2();
                    break;
                case 'get-your-key':
                    initGetKey();
                    break;
                case 'generate-key-secure-xyz':
                    initGenerate();
                    break;
                default:
                    initHome();
            }
        }

        function initHome() {
            const currentStep = getStepProgress();
            if (currentStep > 0) updateStepIndicator(currentStep);
            
            btnContinue.textContent = 'Step 1/2';
            
            btnContinue.onclick = () => {
                btnContinue.textContent = 'Redirecting...';
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step1?completed=1`;
                window.location.href = `https://direct-link.net/1385845/QhuxogBGSmxB?return=${encodeURIComponent(returnUrl)}`;
            };
        }

        function initStep1() {
            if (urlParams.get('completed') === '1') {
                const token = generateToken();
                saveToken(token);
                saveStepProgress(1);
                
                updateStepIndicator(1);
                output.textContent = 'Step 1/2 completed successfully! ✅\n\nRedirecting to Step 2/2...';
                btnContinue.style.display = 'none';
                
                setTimeout(() => {
                    window.location.href = window.location.pathname.includes('/step1') ? '/step2' : '#step2';
                }, 1500);
                return;
            }
            
            updateStepIndicator(Math.max(getStepProgress(), 0));
            btnContinue.textContent = 'Step 1/2 - Generate Token';
            output.textContent = 'Step 1 of 2: Token Generation Step\n\nClick the button below to complete Step 1/2.';
            
            btnContinue.onclick = () => {
                btnContinue.textContent = 'Redirecting...';
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step1?completed=1`;
                window.location.href = `https://direct-link.net/1385845/QhuxogBGSmxB?return=${encodeURIComponent(returnUrl)}`;
            };
        }

        function initStep2() {
            if (urlParams.get('completed') === '2') {
                if (!getToken()) {
                    showError('Token expired. Please start over.');
                    return;
                }
                
                saveStepProgress(2);
                updateStepIndicator(2);
                output.textContent = 'Step 2/2 completed successfully! ✅\n\nRedirecting...';
                btnContinue.style.display = 'none';
                
                setTimeout(() => {
                    window.location.href = window.location.pathname.includes('/step2') ? '/get-your-key' : '#get-your-key';
                }, 1500);
                return;
            }
            
            if (!getToken()) {
                showError('No token found. Complete Step 1/2 first.');
                return;
            }
            
            updateStepIndicator(Math.max(getStepProgress(), 1));
            btnContinue.textContent = 'Step 2/2 - Final Verification';
            output.textContent = 'Step 2 of 2: Final Verification\n\nStep 1/2: ✅ Completed\n\nClick below to complete final verification.';
            
            btnContinue.onclick = () => {
                btnContinue.textContent = 'Redirecting...';
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step2?completed=2`;
                window.location.href = `https://link-target.net/1385845/05NfA4wGJcIe?return=${encodeURIComponent(returnUrl)}`;
            };
        }

        function initGetKey() {
            const token = getToken();
            const currentStep = getStepProgress();
            
            if (!token || currentStep < 2) {
                showError('Invalid access. Complete all steps first.');
                return;
            }
            
            updateStepIndicator(2, 2);
            btnContinue.textContent = 'Generate Your API Key';
            btnContinue.style.background = '#28a745';
            output.textContent = 'Get Your Key\n\n✅ VALID ACCESS CONFIRMED\n\nYou can now generate your API key!';
            
            btnContinue.onclick = () => {
                btnContinue.textContent = 'Loading...';
                btnContinue.disabled = true;
                
                setTimeout(() => {
                    window.location.href = window.location.pathname.includes('/get-your-key') 
                        ? `/generate-key-secure-xyz?token=${token}` 
                        : `#generate-key-secure-xyz?token=${token}`;
                }, 800);
            };
        }

        function initGenerate() {
            const token = getToken();
            const currentStep = getStepProgress();
            
            if (!token || currentStep < 2) {
                showError('Access denied. Complete verification first.');
                return;
            }
            
            updateStepIndicator(2, 2);
            btnContinue.textContent = 'Generate Key';
            btnContinue.id = 'btnGen';
            output.textContent = 'Ready to generate your API key! 🎉\n\nClick "Generate Key" to proceed.';
            
            checkExistingKey();
            
            btnContinue.onclick = generateKey;
        }

        function showError(message) {
            stepIndicator.style.display = 'block';
            stepIndicator.className = 'error-message';
            stepIndicator.textContent = '❌ Error';
            
            output.textContent = `Error: ${message}\n\nClick "Start Over" to begin verification.`;
            btnContinue.textContent = 'Start Over';
            btnContinue.onclick = () => {
                clearToken();
                window.location.href = '/';
            };
        }

        async function checkExistingKey() {
            const token = getToken();
            if (!token) return;
            
            const existingKey = storage.get(`generated_key_${token}`);
            if (existingKey && new Date(existingKey.expires) > new Date()) {
                currentKey = existingKey.key;
                output.textContent = `Key: ${existingKey.key}\n\nExpires: ${new Date(existingKey.expires).toLocaleString()}\n\nValid for 24 hours.`;
                btnCopy.style.display = 'block';
                btnContinue.style.display = 'none';
            }
        }

        async function generateKey() {
            const btnGen = document.getElementById('btnGen');
            btnGen.disabled = true;
            btnGen.textContent = 'Generating...';
            
            try {
                const token = getToken();
                const currentStep = getStepProgress();
                
                if (!token || currentStep < 2) {
                    throw new Error('Invalid access. Please complete all verification steps.');
                }
                
                const randomKey = 'sk-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                const expires = new Date(Date.now() + 24 * 60 * 60 * 1000);
                
                const keyData = {
                    key: randomKey,
                    expires: expires.toISOString(),
                    generated: new Date().toISOString()
                };
                
                storage.set(`generated_key_${token}`, keyData);
                currentKey = keyData.key;
                
                output.textContent = `Key: ${keyData.key}\n\nExpires: ${expires.toLocaleString()}\n\nKey generated successfully! 🎉`;
                btnCopy.style.display = 'block';
                btnGen.style.display = 'none';
                
            } catch (error) {
                output.textContent = `Error: ${error.message}\n\nPlease start over if verification expired.`;
                setTimeout(() => {
                    btnGen.textContent = 'Try Again';
                    btnGen.disabled = false;
                }, 2000);
            }
        }

        // Copy functionality
        btnCopy.onclick = async () => {
            if (!currentKey) return;
            
            try {
                await navigator.clipboard.writeText(currentKey);
                btnCopy.textContent = 'Copied!';
            } catch (error) {
                const textArea = document.createElement('textarea');
                textArea.value = currentKey;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                btnCopy.textContent = 'Copied!';
            }
            
            setTimeout(() => {
                btnCopy.textContent = 'Copy Key';
            }, 2000);
        };

        // Initialize page
        init();
    </script>
</body>
</html>

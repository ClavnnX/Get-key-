<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClavnnX Get key</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #000000 !important;
            color: #ffffff;
        }
        .container {
            background: #222222 !important;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(255,255,255,0.2);
            border: 2px solid #444444;
        }
        h1 {
            text-align: center;
            color: #ffffff !important;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #btnContinue, #btnGen {
            background: #007bff;
            color: white;
        }
        #btnContinue:hover, #btnGen:hover {
            background: #0056b3;
        }
        #btnCopy {
            background: #28a745;
            color: white;
            display: none;
        }
        #btnCopy:hover {
            background: #1e7e34;
        }
        #out {
            background: #2d2d2d;
            border: 1px solid #444444;
            border-radius: 8px;
            padding: 20px;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ClavnnX Get key</h1>
        <button id="btnContinue">Complete the step</button>
        <div id="out">Click "Complete the step" to proceed through verification steps</div>
        <button id="btnCopy" style="display: none;">Copy Key</button>
    </div>

    <script>
        const btnContinue = document.getElementById('btnContinue');
        const btnCopy = document.getElementById('btnCopy');
        const output = document.getElementById('out');
        let currentKey = '';

        // Get current URL path and parameters
        const currentPath = window.location.pathname;
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        // Determine current page based on URL
        if (currentPath === '/step1') {
            handleStep1();
        } else if (currentPath === '/step2') {
            handleStep2();
        } else if (currentPath === '/step3') {
            handleStep3();
        } else if (currentPath === '/generate') {
            handleGenerate();
        } else if (token) {
            // We're on verify page, verify the token
            verifyToken(token);
        } else {
            // We're on start page, langsung redirect ke step1 dengan token baru
            initializeFirstStep();
        }

        async function initializeFirstStep() {
            try {
                // Request token baru dari server
                const response = await fetch('/verify');
                if (response.redirected) {
                    // Server akan redirect ke /step1?token=xxx
                    window.location.href = response.url;
                } else {
                    const data = await response.json();
                    if (data.error) {
                        output.textContent = `Error: ${data.error}`;
                    }
                }
            } catch (error) {
                output.textContent = 'Error: Unable to initialize verification process.';
            }
        }

        function handleStep1() {
            if (!token) {
                window.location.href = '/';
                return;
            }
            
            btnContinue.textContent = 'Continue 1/3';
            output.textContent = 'Complete verification step 1 of 3\n\nClick "Continue 1/3" to proceed to the first verification link.';
            
            btnContinue.addEventListener('click', () => {
                // Simpan token di localStorage untuk tracking
                localStorage.setItem('verificationToken', token);
                localStorage.setItem('currentStep', '1');
                localStorage.setItem('stepStartTime', Date.now());
                
                // Redirect ke link vertise pertama dengan token di URL
                const vertiseURL = `https://link-hub.net/1385845/0Tpockg8i7RS?ref=${token}`;
                window.open(vertiseURL, '_blank');
                
                // Update instruksi untuk user
                output.textContent = 'Please complete the verification on the opened link.\n\nAfter completing the verification, click "Check Progress" to continue.';
                btnContinue.textContent = 'Check Progress';
                btnContinue.disabled = false;
                
                // Ganti event listener untuk check progress
                btnContinue.removeEventListener('click', arguments.callee);
                btnContinue.addEventListener('click', () => checkStepProgress(1));
            });
        }

        function handleStep2() {
            if (!token) {
                window.location.href = '/';
                return;
            }
            
            btnContinue.textContent = 'Continue 2/3';
            output.textContent = 'Step 1 completed successfully!\n\nComplete verification step 2 of 3\n\nClick "Continue 2/3" to proceed to the second verification link.';
            
            btnContinue.addEventListener('click', () => {
                // Token Vertise Anda
                const vertiseToken = '6457aac2196b55786323be0f9d8580cc1dd63627c32d6d5e34fc74cfaee18c88';
                
                // Gabungkan dengan token website untuk tracking user
                const fullURL = `https://link-target.net/1385845/sCCiJeLQ3BfA?token=${vertiseToken}&user_ref=${token}`;
                window.open(fullURL, '_blank');
                
                // Update instruksi untuk user
                output.textContent = 'Please complete the verification on the opened link.\n\nAfter completing the verification, you will be automatically redirected back to continue with step 3.';
                btnContinue.textContent = 'Verification in Progress...';
                btnContinue.disabled = true;
            });
        }

        function handleStep3() {
            if (!token) {
                window.location.href = '/';
                return;
            }
            
            btnContinue.textContent = 'Continue 3/3';
            output.textContent = 'Step 2 completed successfully!\n\nComplete final verification step 3 of 3\n\nClick "Continue 3/3" to proceed to the final verification link.';
            
            btnContinue.addEventListener('click', () => {
                // Token Vertise Anda
                const vertiseToken = '6457aac2196b55786323be0f9d8580cc1dd63627c32d6d5e34fc74cfaee18c88';
                
                // Gabungkan dengan token website untuk tracking user
                const fullURL = `https://link-target.net/1385845/1NJw6vONwDd5?token=${vertiseToken}&user_ref=${token}`;
                window.open(fullURL, '_blank');
                
                // Update instruksi untuk user
                output.textContent = 'Please complete the final verification on the opened link.\n\nAfter completing the verification, you will be automatically redirected to generate your API key.';
                btnContinue.textContent = 'Final Verification in Progress...';
                btnContinue.disabled = true;
            });
        }

        function handleGenerate() {
            if (!token) {
                window.location.href = '/';
                return;
            }
            
            btnContinue.textContent = 'Generate Key';
            btnContinue.id = 'btnGen';
            output.textContent = 'Congratulations! All verification steps completed successfully!\n\nClick "Generate Key" to get your API key.';
            
            btnContinue.addEventListener('click', async () => {
                await generateKey(token);
            });
        }

        async function verifyToken(token) {
            try {
                const response = await fetch(`/verify?token=${token}`);
                const data = await response.json();
                
                if (response.ok && data.valid) {
                    const currentStep = data.step;
                    
                    if (currentStep === 0) {
                        // User belum complete step apapun, redirect to step1
                        window.location.href = `/step1?token=${token}`;
                        
                    } else if (currentStep === 1) {
                        // User sudah complete step 1, redirect to step2
                        window.location.href = `/step2?token=${token}`;
                        
                    } else if (currentStep === 2) {
                        // User sudah complete step 2, redirect to step3
                        window.location.href = `/step3?token=${token}`;
                        
                    } else if (currentStep >= 3) {
                        // User sudah complete semua step, redirect to generate
                        window.location.href = `/generate?token=${token}`;
                    }
                } else {
                    // Token is invalid
                    btnContinue.style.display = 'none';
                    output.textContent = 'Error: Invalid or expired verification token.\n\nPlease refresh the page to start a new verification process.';
                }
            } catch (error) {
                btnContinue.style.display = 'none';
                output.textContent = 'Error: Unable to verify token.\n\nPlease refresh the page and try again.';
            }
        }

        async function generateKey(token) {
            const btnGen = document.getElementById('btnGen');
            btnGen.disabled = true;
            btnGen.textContent = 'Generating...';
            btnGen.classList.add('loading');
            
            try {
                const response = await fetch(`/getkey?token=${token}`);
                const data = await response.json();
                
                if (response.ok) {
                    currentKey = data.key;
                    const expiry = new Date(data.expires);
                    output.textContent = `SUCCESS!\n\nYour API Key: ${data.key}\n\nExpires: ${expiry.toLocaleString()}\n\nKey is valid for 24 hours from generation.\n\nPlease copy and save your key securely.`;
                    btnCopy.style.display = 'block';
                } else {
                    output.textContent = `Error: ${data.error || 'Failed to generate key'}\n\nPlease make sure you have completed all verification steps properly.`;
                    btnCopy.style.display = 'none';
                }
            } catch (error) {
                output.textContent = `Error: Unable to connect to server.\n\nPlease check your internet connection and try again.`;
                btnCopy.style.display = 'none';
            }
            
            btnGen.disabled = false;
            btnGen.textContent = 'Generate Key';
            btnGen.classList.remove('loading');
        }

        btnCopy.addEventListener('click', async () => {
            if (currentKey) {
                try {
                    await navigator.clipboard.writeText(currentKey);
                    btnCopy.textContent = 'Copied!';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                    }, 2000);
                } catch (error) {
                    // Fallback for older browsers
                    const textArea = document.createElement('textarea');
                    textArea.value = currentKey;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    btnCopy.textContent = 'Copied!';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                    }, 2000);
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClavnnX Key System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f23, #1a1a3e, #0f0f23);
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 150, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 150, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 60%, rgba(0, 150, 255, 0.05) 0%, transparent 50%);
            z-index: -1;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 30, 45, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            position: relative;
            overflow: hidden;
        }

        .main-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 150, 255, 0.5), transparent);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #0096ff, #00d4ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .progress-section {
            margin-bottom: 30px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-label {
            color: #d1d5db;
            font-size: 14px;
            font-weight: 500;
        }

        .progress-step {
            color: #6b7280;
            font-size: 14px;
            font-weight: 600;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(55, 65, 81, 0.6);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #0096ff, #00d4ff);
            border-radius: 4px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .step-indicator {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            padding: 16px 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .url-section {
            margin-bottom: 24px;
        }

        .url-label {
            color: #9ca3af;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .url-input {
            width: 100%;
            background: rgba(55, 65, 81, 0.5);
            border: 1px solid rgba(75, 85, 99, 0.6);
            border-radius: 12px;
            padding: 14px 16px;
            color: #e5e7eb;
            font-size: 15px;
            font-weight: 400;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', monospace;
        }

        .url-input:focus {
            border-color: #0096ff;
            background: rgba(55, 65, 81, 0.8);
            box-shadow: 0 0 0 3px rgba(0, 150, 255, 0.1);
        }

        .main-button {
            width: 100%;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            margin-bottom: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        .main-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .main-button:hover::before {
            transform: translateX(100%);
        }

        .main-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #btnContinue, #btnGen {
            background: linear-gradient(135deg, #0096ff, #00d4ff);
            color: white;
            box-shadow: 0 8px 25px rgba(0, 150, 255, 0.3);
        }

        #btnContinue:hover:not(:disabled), #btnGen:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0, 150, 255, 0.4);
        }

        #btnTakeKey {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
            display: none;
        }

        #btnTakeKey:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(16, 185, 129, 0.4);
        }

        #btnCopy {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
            display: none;
        }

        #btnCopy:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(16, 185, 129, 0.4);
        }

        #btnCheckKey {
            background: linear-gradient(135deg, #0096ff, #00d4ff);
            color: white;
            box-shadow: 0 8px 25px rgba(0, 150, 255, 0.3);
            display: none;
        }

        #btnCheckKey:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0, 150, 255, 0.4);
        }

        .output-section {
            margin-bottom: 20px;
        }

        #out {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(75, 85, 99, 0.4);
            border-radius: 16px;
            padding: 24px;
            min-height: 120px;
            font-family: 'Inter', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            color: #e5e7eb;
            position: relative;
            backdrop-filter: blur(10px);
        }

        #out::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 150, 255, 0.3), transparent);
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
            position: relative;
        }

        .loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            margin: -12px 0 0 -12px;
            border: 2px solid rgba(0, 150, 255, 0.3);
            border-radius: 50%;
            border-top-color: #0096ff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-message {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            padding: 16px 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 16px;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.2);
        }

        .error-message {
            background: linear-gradient(135deg, #ef4444, #f87171);
            color: white;
            padding: 16px 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 16px;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.2);
        }

        .expired-message {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            color: white;
            padding: 16px 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 16px;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.2);
        }

        .countdown-section {
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .countdown-title {
            color: #ef4444;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .countdown-timer {
            font-size: 24px;
            font-weight: 700;
            color: #ef4444;
            font-family: 'Courier New', monospace;
        }

        .check-key-section {
            margin-top: 30px;
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(75, 85, 99, 0.3);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        .check-key-title {
            color: #0096ff;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }

        .key-input {
            width: 100%;
            background: rgba(55, 65, 81, 0.5);
            border: 1px solid rgba(75, 85, 99, 0.6);
            border-radius: 12px;
            padding: 14px 16px;
            color: #e5e7eb;
            font-size: 15px;
            font-weight: 400;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', monospace;
            margin-bottom: 16px;
        }

        .key-input:focus {
            border-color: #0096ff;
            background: rgba(55, 65, 81, 0.8);
            box-shadow: 0 0 0 3px rgba(0, 150, 255, 0.1);
        }

        .key-input.invalid {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .key-input.valid {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .discord-section {
            margin-top: 30px;
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(114, 137, 218, 0.3);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .discord-title {
            color: #7289da;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .discord-button {
            background: linear-gradient(135deg, #7289da, #99aab5);
            color: white;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 6px 20px rgba(114, 137, 218, 0.3);
        }

        .discord-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(114, 137, 218, 0.4);
        }

        .icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
            
            .main-container {
                padding: 30px 24px;
                border-radius: 20px;
            }

            .logo {
                font-size: 28px;
            }

            .subtitle {
                font-size: 14px;
            }

            .main-button {
                padding: 14px 20px;
                font-size: 15px;
            }

            #out {
                padding: 20px;
                min-height: 100px;
                font-size: 13px;
            }

            .check-key-section {
                padding: 20px;
            }

            .discord-section {
                padding: 20px;
            }

            .countdown-timer {
                font-size: 20px;
            }
        }

        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: .8;
            }
        }

        .glow {
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <div class="logo">ClavnnX Key System</div>
            <div class="subtitle">Secure Multi-Step Verification System</div>
        </div>

        <div class="progress-section">
            <div class="progress-header">
                <span class="progress-label">Progress</span>
                <span class="progress-step" id="progressStep">Step 0/2</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 0%"></div>
            </div>
        </div>

        <div class="step-indicator" id="stepIndicator" style="display: none;"></div>

        <div class="countdown-section" id="countdownSection" style="display: none;">
            <div class="countdown-title">⏰ Page Access Expired</div>
            <div class="countdown-timer" id="countdownTimer">00:00</div>
            <div style="margin-top: 10px; color: #9ca3af; font-size: 14px;">
                Please start verification again
            </div>
        </div>

        <div class="url-section" style="display: none;">
            <div class="url-label">
                <span class="icon">🔗</span>
                Current URL:
            </div>
            <input type="text" class="url-input" id="currentUrl" value="/" readonly>
        </div>

        <button id="btnContinue" class="main-button">Complete the step</button>

        <div class="output-section">
            <div id="out">Complete verification steps to get your API key</div>
        </div>

        <button id="btnTakeKey" class="main-button" style="display: none;">Take the key</button>
        <button id="btnCopy" class="main-button" style="display: none;">Copy Key</button>

        <div class="check-key-section" id="checkKeySection">
            <div class="check-key-title">
                <span class="icon">🔑</span>
                Check your key status
            </div>
            <input type="text" class="key-input" id="keyInput" placeholder="Paste your API key here... (Format: 10 uppercase characters/numbers)">
            <button id="btnCheckKey" class="main-button">Check Key Status</button>
        </div>

        <div class="discord-section">
            <div class="discord-title">
                <span class="icon">💬</span>
                Join Discord ClavnnX
            </div>
            <a href="https://discord.gg/QHPFGakSjN" target="_blank" class="discord-button">Join</a>
        </div>
    </div>

<script>
const btnContinue = document.getElementById('btnContinue');
const btnTakeKey = document.getElementById('btnTakeKey');
const btnCopy = document.getElementById('btnCopy');
const btnCheckKey = document.getElementById('btnCheckKey');
const output = document.getElementById('out');
const stepIndicator = document.getElementById('stepIndicator');
const progressBar = document.getElementById('progressBar');
const progressStep = document.getElementById('progressStep');
const currentUrl = document.getElementById('currentUrl');
const countdownSection = document.getElementById('countdownSection');
const countdownTimer = document.getElementById('countdownTimer');
const checkKeySection = document.getElementById('checkKeySection');
const keyInput = document.getElementById('keyInput');
let currentKey = '';
let generatePageStartTime = null;
let countdownInterval = null;

const TOKEN_KEY = 'clavnnx_token_step1';
const STEP_KEY = 'clavnnx_current_step';
const GENERATE_ACCESS_KEY = 'clavnnx_generate_access';
const GENERATED_KEY_STORAGE = 'clavnnx_generated_key';

let generatePageMemory = {
    accessTime: null,
    isExpired: false
};

const storage = {
    data: {},
    set: function(key, value) {
        this.data[key] = value;
    },
    get: function(key) {
        return this.data[key] || null;
    },
    remove: function(key) {
        delete this.data[key];
    }
};

// Improved key validation function
function isValidKeyFormat(key) {
    if (!key || typeof key !== 'string') return false;
    
    // ClavnnX key format: exactly 10 characters, uppercase letters and numbers only
    const keyPattern = /^[A-Z0-9]{10}$/;
    return keyPattern.test(key.trim());
}

// New function to validate key with server
async function validateKeyWithServer(key) {
    try {
        const response = await fetch(`/validate?key=${encodeURIComponent(key)}`);
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        return data;
        
    } catch (error) {
        console.error('Error validating key with server:', error);
        // Return fallback validation for demo purposes
        return {
            status: 'ERROR',
            message: 'Unable to connect to validation server. Please try again later.'
        };
    }
}

// Improved checkKeyExpiry function
async function checkKeyExpiry() {
    const inputKey = keyInput.value.trim().toUpperCase();
    
    // Clear previous styling
    keyInput.classList.remove('valid', 'invalid');
    output.style.border = '1px solid rgba(75, 85, 99, 0.4)';
    
    // Validate input
    if (!inputKey) {
        output.textContent = '⚠️ Please enter an API key to check.';
        keyInput.classList.add('invalid');
        return;
    }

    // Validate key format
    if (!isValidKeyFormat(inputKey)) {
        output.textContent = '❌ INVALID KEY FORMAT\n\n📝 Valid key format:\n- Exactly 10 characters\n- Only uppercase letters (A-Z) and numbers (0-9)\n- Example: ABC1234567\n\n⚠️ Please enter a valid ClavnnX API key.';
        keyInput.classList.add('invalid');
        keyInput.style.borderColor = '#ef4444';
        output.style.border = '2px solid #ef4444';
        
        setTimeout(() => {
            keyInput.style.borderColor = 'rgba(75, 85, 99, 0.6)';
            output.style.border = '1px solid rgba(75, 85, 99, 0.4)';
        }, 3000);
        return;
    }

    // Show loading state
    btnCheckKey.disabled = true;
    btnCheckKey.textContent = 'Checking...';
    btnCheckKey.classList.add('loading');
    
    output.textContent = '🔍 Validating key with server...\n\n⏱️ Please wait...';

    try {
        // Validate with server
        const validationResult = await validateKeyWithServer(inputKey);
        
        let statusText = '';
        let statusEmoji = '';
        let borderColor = '';
        let inputClass = '';
        
        switch (validationResult.status) {
            case 'VALID':
                statusText = '✅ ACTIVE';
                statusEmoji = '✅';
                borderColor = '#10b981';
                inputClass = 'valid';
                break;
                
            case 'EXPIRED':
                statusText = '❌ EXPIRED';
                statusEmoji = '⏰';
                borderColor = '#ef4444';
                inputClass = 'invalid';
                break;
                
            case 'INVALID':
                statusText = '❌ NOT FOUND';
                statusEmoji = '🚫';
                borderColor = '#ef4444';
                inputClass = 'invalid';
                break;
                
            case 'ERROR':
            default:
                statusText = '⚠️ CHECK FAILED';
                statusEmoji = '⚠️';
                borderColor = '#f59e0b';
                inputClass = 'invalid';
                break;
        }
        
        // Update UI based on validation result
        const currentTime = new Date().toLocaleString();
        
        if (validationResult.status === 'VALID') {
            output.textContent = `🔑 Key: ${inputKey}\n\n${statusEmoji} Status: ${statusText}\n\n✅ Key validation successful!\n\n🕐 Checked at: ${currentTime}\n\n💡 This key is currently active and can be used.`;
        } else if (validationResult.status === 'EXPIRED') {
            output.textContent = `🔑 Key: ${inputKey}\n\n${statusEmoji} Status: ${statusText}\n\n❌ This key has expired and cannot be used.\n\n🕐 Checked at: ${currentTime}\n\n💡 Please generate a new key to continue using the service.`;
        } else if (validationResult.status === 'INVALID') {
            output.textContent = `🔑 Key: ${inputKey}\n\n${statusEmoji} Status: ${statusText}\n\n❌ This key was not found in our system.\n\n🕐 Checked at: ${currentTime}\n\n💡 Please check if you entered the key correctly or generate a new one.`;
        } else {
            output.textContent = `🔑 Key: ${inputKey}\n\n${statusEmoji} Status: ${statusText}\n\n${validationResult.message || 'Unable to validate key at this time.'}\n\n🕐 Checked at: ${currentTime}\n\n🔄 Please try again in a few moments.`;
        }
        
        // Apply styling
        keyInput.classList.add(inputClass);
        keyInput.style.borderColor = borderColor;
        output.style.border = `2px solid ${borderColor}`;
        
        // Reset styling after 5 seconds
        setTimeout(() => {
            keyInput.style.borderColor = 'rgba(75, 85, 99, 0.6)';
            output.style.border = '1px solid rgba(75, 85, 99, 0.4)';
            keyInput.classList.remove('valid', 'invalid');
        }, 5000);
        
    } catch (error) {
        console.error('Key validation error:', error);
        
        output.textContent = `🔑 Key: ${inputKey}\n\n⚠️ Status: VALIDATION ERROR\n\n❌ Unable to validate key due to connection issues.\n\n🔄 Please check your internet connection and try again.\n\nError: ${error.message}`;
        
        keyInput.classList.add('invalid');
        keyInput.style.borderColor = '#ef4444';
        output.style.border = '2px solid #ef4444';
        
        setTimeout(() => {
            keyInput.style.borderColor = 'rgba(75, 85, 99, 0.6)';
            output.style.border = '1px solid rgba(75, 85, 99, 0.4)';
            keyInput.classList.remove('invalid');
        }, 5000);
        
    } finally {
        // Reset button state
        btnCheckKey.disabled = false;
        btnCheckKey.textContent = 'Check Key Status';
        btnCheckKey.classList.remove('loading');
    }
}

// Add input formatting and validation
keyInput.addEventListener('input', function(e) {
    // Convert to uppercase and limit to 10 characters
    let value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (value.length > 10) {
        value = value.substring(0, 10);
    }
    e.target.value = value;
    
    // Clear previous validation states
    keyInput.classList.remove('valid', 'invalid');
});

// Add Enter key support for check key
keyInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && !btnCheckKey.disabled) {
        checkKeyExpiry();
    }
});

function saveToken(token) {
    if (token) {
        storage.set(TOKEN_KEY, {
            token: token,
            created: Date.now(),
            expires: Date.now() + (8 * 60 * 1000)
        });
    }
}

function getToken() {
    const urlParams = new URLSearchParams(window.location.search);
    const tokenFromUrl = urlParams.get('token');
    
    if (tokenFromUrl) {
        saveToken(tokenFromUrl);
        return tokenFromUrl;
    }
    
    const tokenData = storage.get(TOKEN_KEY);
    if (tokenData && Date.now() < tokenData.expires) {
        return tokenData.token;
    }
    
    clearToken();
    return null;
}

function clearToken() {
    storage.remove(TOKEN_KEY);
    storage.remove(STEP_KEY);
    storage.remove(GENERATE_ACCESS_KEY);
    storage.remove(GENERATED_KEY_STORAGE);
}

function generateToken() {
    return `token_${Date.now()}_${Math.random().toString(36).substring(2, 15)}`;
}

function saveGeneratedKey(keyData) {
    if (keyData) {
        storage.set(GENERATED_KEY_STORAGE, {
            key: keyData.key,
            expires: keyData.expires,
            generated: Date.now(),
            isValid: true
        });
    }
}

function getGeneratedKey() {
    const keyData = storage.get(GENERATED_KEY_STORAGE);
    if (keyData && keyData.isValid && Date.now() < keyData.expires) {
        return keyData;
    }
    
    if (keyData) {
        storage.remove(GENERATED_KEY_STORAGE);
    }
    return null;
}

function hasValidGeneratedKey() {
    const keyData = getGeneratedKey();
    return keyData && keyData.key;
}

function saveGenerateAccess() {
    const now = Date.now();
    const accessData = {
        accessTime: now,
        expires: now + (8 * 60 * 1000)
    };
    
    storage.set(GENERATE_ACCESS_KEY, accessData);
    generatePageMemory.accessTime = now;
    generatePageMemory.isExpired = false;
}

function getGenerateAccess() {
    const accessData = storage.get(GENERATE_ACCESS_KEY);
    if (accessData && Date.now() < accessData.expires) {
        generatePageMemory.accessTime = accessData.accessTime;
        generatePageMemory.isExpired = false;
        return accessData;
    }
    
    generatePageMemory.isExpired = true;
    return null;
}

function isGeneratePageExpired() {
    const accessData = getGenerateAccess();
    return !accessData || generatePageMemory.isExpired;
}

function getRemainingTime() {
    const accessData = storage.get(GENERATE_ACCESS_KEY);
    if (!accessData) return 0;
    
    const remaining = accessData.expires - Date.now();
    return Math.max(0, remaining);
}

function saveStepProgress(step) {
    storage.set(STEP_KEY, step);
}

function getStepProgress() {
    const step = storage.get(STEP_KEY) || 0;
    return Math.max(0, Math.min(2, parseInt(step)));
}

function updateProgress(currentStep, totalSteps = 2) {
    const percentage = (currentStep / totalSteps) * 100;
    progressBar.style.width = percentage + '%';
    progressStep.textContent = `Step ${currentStep}/${totalSteps}`;
}

function updateStepIndicator(currentStep, totalSteps = 2) {
    stepIndicator.style.display = 'block';
    if (currentStep >= totalSteps) {
        stepIndicator.className = 'success-message pulse';
        stepIndicator.textContent = '✅ All Steps Completed! Ready to generate key';
    } else {
        stepIndicator.className = 'step-indicator pulse';
        stepIndicator.textContent = `Step ${currentStep}/${totalSteps} Completed`;
    }
}

function startCountdown() {
    if (countdownInterval) {
        clearInterval(countdownInterval);
    }

    countdownInterval = setInterval(() => {
        const remaining = getRemainingTime();
        
        if (remaining <= 0) {
            clearInterval(countdownInterval);
            countdownTimer.textContent = '00:00';
            generatePageMemory.isExpired = true;
            return;
        }

        const minutes = Math.floor(remaining / (1000 * 60));
        const seconds = Math.floor((remaining % (1000 * 60)) / 1000);
        
        countdownTimer.textContent = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }, 1000);
}

const route = window.location.hash.replace('#', '') || window.location.pathname.replace('/', '') || 'home';
const urlParams = new URLSearchParams(window.location.search);

function updateCurrentUrl() {
    currentUrl.value = window.location.pathname + window.location.search + window.location.hash;
}

function init() {
    updateCurrentUrl();
    
    if (route === 'home' || route === '') {
        btnCheckKey.style.display = 'block';
        btnCheckKey.onclick = checkKeyExpiry;
    } else {
        checkKeySection.style.display = 'none';
    }
    
    switch(route) {
        case 'step1':
            initStep1();
            break;
        case 'step2':  
            initStep2();
            break;
        case 'get-your-key':
            initGetKey();
            break;
        case 'generate-key-secure-xyz':
            initGenerate();
            break;
        default:
            initHome();
    }
}

function initHome() {
    const currentStep = getStepProgress();
    updateProgress(currentStep);
    if (currentStep > 0) updateStepIndicator(currentStep);
    
    btnContinue.textContent = '🚀 Start Step 1/2';
    
    btnContinue.onclick = () => {
        btnContinue.textContent = 'Redirecting...';
        btnContinue.classList.add('loading');
        btnContinue.disabled = true;
        
        const returnUrl = `${window.location.origin}/step1?completed=1`;
        window.location.href = `https://en.shrinke.me/scriptrblox?return=${encodeURIComponent(returnUrl)}`;
    };
}

function initStep1() {
    if (urlParams.get('completed') === '1') {
        const token = generateToken();
        saveToken(token);
        saveStepProgress(1);
        
        updateProgress(1);
        updateStepIndicator(1);
        output.textContent = '✅ Step 1/2 completed successfully!\n\n🔄 Redirecting to Step 2/2...';
        btnContinue.style.display = 'none';
        
        setTimeout(() => {
            window.location.href = window.location.pathname.includes('/step1') ? '/step2' : '#step2';
        }, 1500);
        return;
    }
    
    updateProgress(Math.max(getStepProgress(), 0));
    updateStepIndicator(Math.max(getStepProgress(), 0));
    btnContinue.textContent = '🔑 Step 1/2 - Generate Token';
    output.textContent = '📋 Step 1 of 2: Token Generation Step\n\n🎯 Click the button below to complete Step 1/2.';
    
    btnContinue.onclick = () => {
        btnContinue.textContent = 'Redirecting...';
        btnContinue.classList.add('loading');
        btnContinue.disabled = true;
        
        const returnUrl = `${window.location.origin}/step1?completed=1`;
        window.location.href = `https://en.shrinke.me/scriptrblox?return=${encodeURIComponent(returnUrl)}`;
    };
}

function initStep2() {
    if (urlParams.get('completed') === '2') {
        if (!getToken()) {
            showError('Token expired. Please start over.');
            return;
        }
        
        saveStepProgress(2);
        updateProgress(2);
        updateStepIndicator(2);
        output.textContent = '✅ Step 2/2 completed successfully!\n\n🎉 Auto-redirecting to key generation...';
        btnContinue.style.display = 'none';
        
        saveGenerateAccess();
        
        setTimeout(() => {
            window.location.href = `/generate-key-secure-xyz?token=${getToken()}`;
        }, 2000);
        return;
    }
    
    if (!getToken()) {
        showError('No token found. Complete Step 1/2 first.');
        return;
    }
    
    updateProgress(Math.max(getStepProgress(), 1));
    updateStepIndicator(Math.max(getStepProgress(), 1));
    btnContinue.textContent = '🛡️ Step 2/2 - Final Verification';
    output.textContent = '📋 Step 2 of 2: Final Verification\n\n✅ Step 1/2: Completed\n\n🎯 Click below to complete final verification.';
    
    btnContinue.onclick = () => {
        btnContinue.textContent = 'Redirecting...';
        btnContinue.classList.add('loading');
        btnContinue.disabled = true;
        
        const returnUrl = `${window.location.origin}/step2?completed=2`;
        window.location.href = `https://en.shrinke.me/scriptrblox2?return=${encodeURIComponent(returnUrl)}`;
    };
}

function initGetKey() {
    const token = getToken();
    const currentStep = getStepProgress();
    
    if (!token || currentStep < 2) {
        showError('Invalid access. Complete all steps first.');
        return;
    }
    
    updateProgress(2, 2);
    updateStepIndicator(2, 2);
    btnContinue.textContent = '🎉 Generate Your API Key';
    btnContinue.classList.add('glow');
    output.textContent = '🔓 Get Your Key\n\n✅ VALID ACCESS CONFIRMED\n\n🎯 You can now generate your API key!';
    
    btnContinue.onclick = () => {
        btnContinue.textContent = 'Loading...';
        btnContinue.classList.add('loading');
        btnContinue.disabled = true;
        
        saveGenerateAccess();
        
        setTimeout(() => {
            window.location.href = `/generate-key-secure-xyz?token=${token}`;
        }, 800);
    };
}

function initGenerate() {
    const token = getToken();
    const currentStep = getStepProgress();
    
    if (!token || currentStep < 2) {
        showError('Access denied. Complete verification first.');
        return;
    }

    if (isGeneratePageExpired()) {
        showExpiredPage();
        return;
    }

    updateProgress(2, 2);
    updateStepIndicator(2, 2);
    
    startCountdown();
    
    const existingKey = getGeneratedKey();
    if (existingKey) {
        showExistingKey(existingKey);
    } else {
        autoGenerateKey();
    }
}

function showExistingKey(keyData) {
    btnContinue.style.display = 'none';
    btnCopy.style.display = 'block';
    
    stepIndicator.style.display = 'block';
    stepIndicator.className = 'success-message';
    stepIndicator.textContent = '✅ API Key Loaded';
    
    const keyExpiresDate = new Date(keyData.expires);
    const remainingKeyTime = Math.max(0, keyData.expires - Date.now());
    const keyHours = Math.floor(remainingKeyTime / (1000 * 60 * 60));
    const keyMinutes = Math.floor((remainingKeyTime % (1000 * 60 * 60)) / (1000 * 60));
    
    currentKey = keyData.key;
    
    output.textContent = `🔑 Your API Key: ${keyData.key}\n\n⏰ Expires: ${keyExpiresDate.toLocaleString()}\n\n⚡ Status: ACTIVE (${keyHours}h ${keyMinutes}m remaining)\n\n🛡️ Refresh Protection: Active`;
    
    btnCopy.textContent = '📋 Copy Key';
    
    output.style.border = '2px solid #f59e0b';
    setTimeout(() => {
        output.style.border = '1px solid rgba(75, 85, 99, 0.4)';
    }, 3000);
}

function showExpiredPage() {
    countdownSection.style.display = 'block';
    
    btnContinue.style.display = 'none';
    btnCopy.style.display = 'none';
    
    stepIndicator.style.display = 'block';
    stepIndicator.className = 'expired-message pulse';
    stepIndicator.textContent = '⏰ Generate Page Access Expired';
    
    output.textContent = '🚫 Generate Key Access Expired\n\n⏰ The 8-minute access window has expired.\n\n🔄 Please complete verification steps again to generate a new key.';
    
    updateProgress(2, 2);
    progressStep.textContent = 'Step 2/2 - EXPIRED';
    
    const restartBtn = document.createElement('button');
    restartBtn.className = 'main-button';
    restartBtn.style.background = 'linear-gradient(135deg, #f59e0b, #fbbf24)';
    restartBtn.textContent = '🔄 Start Over';
    restartBtn.onclick = () => {
        clearToken();
        window.location.href = '/';
    };
    
    output.parentNode.insertBefore(restartBtn, output.nextSibling);
}

async function autoGenerateKey() {
    btnContinue.style.display = 'none';
    btnCopy.style.display = 'none';
    stepIndicator.style.display = 'none';
    
    output.textContent = '🔐 Preparing your secure API key...\n\n⏱️ Please wait...';
    
    try {
        const token = getToken();
        
        // Show loading for 3 seconds
        await new Promise(resolve => setTimeout(resolve, 3000));
        
        // Try to get key from server first
        try {
            const response = await fetch(`/getkey?token=${encodeURIComponent(token)}`);
            
            if (response.ok) {
                const keyData = await response.json();
                
                currentKey = keyData.key;
                
                const keyDataToSave = {
                    key: keyData.key,
                    expires: new Date(keyData.expires).getTime()
                };
                saveGeneratedKey(keyDataToSave);
                
                stepIndicator.style.display = 'block';
                stepIndicator.className = 'success-message pulse';
                stepIndicator.textContent = keyData.isExisting ? '✅ API Key Loaded!' : '✅ API Key Generated!';
                
                const expiresDate = new Date(keyData.expires);
                const remainingTime = Math.max(0, expiresDate.getTime() - Date.now());
                const hours = Math.floor(remainingTime / (1000 * 60 * 60));
                const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
                
                output.textContent = `🔑 Your API Key: ${keyData.key}\n\n⏰ Expires: ${expiresDate.toLocaleString()}\n\n✅ Key ${keyData.isExisting ? 'loaded' : 'generated'} successfully!\n\n⚡ Status: ACTIVE (${hours}h ${minutes}m remaining)\n\n🛡️ Refresh Protection: Active`;
                
                btnCopy.style.display = 'block';
                btnCopy.textContent = '📋 Copy API Key';
                
                output.style.border = '2px solid #10b981';
                setTimeout(() => {
                    output.style.border = '1px solid rgba(75, 85, 99, 0.4)';
                }, 2000);
                
                return;
            }
        } catch (serverError) {
            console.log('Server not available, using fallback generation');
        }
        
        // Fallback: Generate mock key for demo
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let mockKey = '';
        for (let i = 0; i < 10; i++) {
            mockKey += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        const mockExpires = new Date(Date.now() + 24 * 60 * 60 * 1000);
        
        currentKey = mockKey;
        
        const keyData = {
            key: mockKey,
            expires: mockExpires.getTime()
        };
        saveGeneratedKey(keyData);
        
        stepIndicator.style.display = 'block';
        stepIndicator.className = 'success-message pulse';
        stepIndicator.textContent = '✅ API Key Ready!';
        
        output.textContent = `🔑 Your API Key: ${mockKey}\n\n⏰ Expires: ${mockExpires.toLocaleString()}\n\n✅ Key validated successfully!\n\n⚠️ Important: This key is valid for 24 hours.\n\n🛡️ Refresh Protection: Active\n\n💡 Demo Mode: Server integration available for production.`;
        
        btnCopy.style.display = 'block';
        btnCopy.textContent = '📋 Copy API Key';
        
        output.style.border = '2px solid #10b981';
        setTimeout(() => {
            output.style.border = '1px solid rgba(75, 85, 99, 0.4)';
        }, 2000);
        
    } catch (error) {
        console.error('Key generation error:', error);
        
        stepIndicator.style.display = 'block';
        stepIndicator.className = 'error-message pulse';
        stepIndicator.textContent = '❌ Key Generation Failed';
        
        output.textContent = `⚠️ Error: ${error.message}\n\n🔄 This might happen if:\n- Backend API is not deployed\n- Token has expired\n- Network connection issue\n- Server is temporarily unavailable\n\n💡 Please try starting the verification process again.`;
        
        const retryBtn = document.createElement('button');
        retryBtn.className = 'main-button';
        retryBtn.style.background = 'linear-gradient(135deg, #f59e0b, #fbbf24)';
        retryBtn.textContent = '🔄 Start Over';
        retryBtn.onclick = () => {
            clearToken();
            window.location.href = '/';
        };
        
        output.parentNode.insertBefore(retryBtn, output.nextSibling);
    }
}

function showError(message) {
    stepIndicator.style.display = 'block';
    stepIndicator.className = 'error-message pulse';
    stepIndicator.textContent = '❌ Error';
    
    output.textContent = `⚠️ Error: ${message}\n\n🔄 Click "Start Over" to begin verification.`;
    btnContinue.textContent = '🔄 Start Over';
    btnContinue.className = 'main-button';
    btnContinue.onclick = () => {
        clearToken();
        window.location.href = '/';
    };
}

btnCopy.onclick = async () => {
    if (!currentKey) return;
    
    try {
        await navigator.clipboard.writeText(currentKey);
        btnCopy.textContent = '✅ Copied!';
        btnCopy.style.background = 'linear-gradient(135deg, #059669, #10b981)';
        
        const originalText = output.textContent;
        output.textContent = originalText + '\n\n✅ API Key copied to clipboard!';
        
        setTimeout(() => {
            output.textContent = originalText;
        }, 3000);
        
    } catch (error) {
        const textArea = document.createElement('textarea');
        textArea.value = currentKey;
        textArea.style.position = 'fixed';
        textArea.style.left = '-999999px';
        textArea.style.top = '-999999px';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        
        try {
            document.execCommand('copy');
            btnCopy.textContent = '✅ Copied!';
            btnCopy.style.background = 'linear-gradient(135deg, #059669, #10b981)';
        } catch (err) {
            btnCopy.textContent = '❌ Copy Failed';
            btnCopy.style.background = 'linear-gradient(135deg, #ef4444, #f87171)';
        }
        
        document.body.removeChild(textArea);
    }
    
    setTimeout(() => {
        btnCopy.textContent = hasValidGeneratedKey() ? '📋 Copy Existing Key' : '📋 Copy API Key';
        btnCopy.style.background = 'linear-gradient(135deg, #10b981, #34d399)';
    }, 2000);
};

function preventGeneratePageManipulation() {
    if (route === 'generate-key-secure-xyz') {
        window.addEventListener('beforeunload', (e) => {
            if (!generatePageMemory.isExpired && !hasValidGeneratedKey()) {
                e.preventDefault();
                e.returnValue = 'Refreshing this page will reset your key generation session.';
                return e.returnValue;
            }
        });

        window.addEventListener('popstate', (e) => {
            if (!generatePageMemory.isExpired) {
                history.pushState(null, null, window.location.href);
            }
        });
        
        history.pushState(null, null, window.location.href);
    }
}

function handleVisibilityChange() {
    if (route === 'generate-key-secure-xyz') {
        if (document.hidden) {
            console.log('Page hidden, continuing background timer');
        } else {
            if (isGeneratePageExpired()) {
                showExpiredPage();
            }
        }
    }
}

function initSecurityMeasures() {
    if (route === 'generate-key-secure-xyz') {
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) ||
                (e.ctrlKey && e.key === 'u') ||
                (e.ctrlKey && e.key === 'r') ||
                e.key === 'F5') {
                e.preventDefault();
                return false;
            }
        });
    }
}

function cleanup() {
    if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
    }
}

document.addEventListener('visibilitychange', handleVisibilityChange);
window.addEventListener('beforeunload', cleanup);

init();
preventGeneratePageManipulation();
initSecurityMeasures();

setInterval(() => {
    if (isGeneratePageExpired() && route === 'generate-key-secure-xyz') {
        showExpiredPage();
    }
    
    const existingKey = storage.get(GENERATED_KEY_STORAGE);
    if (existingKey && Date.now() >= existingKey.expires) {
        storage.remove(GENERATED_KEY_STORAGE);
    }
}, 60000);

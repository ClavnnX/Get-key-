<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClavnnX Get key</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #000000 !important;
            color: #ffffff;
        }
        .container {
            background: #222222 !important;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(255,255,255,0.2);
            border: 2px solid #444444;
        }
        h1 {
            text-align: center;
            color: #ffffff !important;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #btnContinue, #btnGen, #btnTakeKey {
            background: #007bff;
            color: white;
        }
        #btnContinue:hover, #btnGen:hover, #btnTakeKey:hover {
            background: #0056b3;
        }
        #btnTakeKey {
            background: #28a745;
            display: none;
            margin-top: 10px;
        }
        #btnTakeKey:hover {
            background: #1e7e34;
        }
        #btnCopy {
            background: #28a745;
            color: white;
            display: none;
        }
        #btnCopy:hover {
            background: #1e7e34;
        }
        #out {
            background: #2d2d2d;
            border: 1px solid #444444;
            border-radius: 8px;
            padding: 20px;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        .timer {
            background: #dc3545;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        .step-indicator {
            background: #17a2b8;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .success-message {
            background: #28a745;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ClavnnX Get key</h1>
        <div class="step-indicator" id="stepIndicator" style="display: none;">Step Progress</div>
        <button id="btnContinue">Complete the step</button>
        <div class="timer" id="timer">Generate key link expires in: <span id="timeLeft">5:00</span></div>
        <div id="out">Click "Complete the step" to proceed through verification steps</div>
        <button id="btnTakeKey" style="display: none;">Take the key</button>
        <button id="btnCopy" style="display: none;">Copy Key</button>
    </div>

    <script>
        const btnContinue = document.getElementById('btnContinue');
        const btnTakeKey = document.getElementById('btnTakeKey');
        const btnCopy = document.getElementById('btnCopy');
        const output = document.getElementById('out');
        const timerDiv = document.getElementById('timer');
        const timeLeftSpan = document.getElementById('timeLeft');
        const stepIndicator = document.getElementById('stepIndicator');
        let currentKey = '';
        let timerInterval = null;
        let timeRemaining = 0;

        // Token storage key
        const TOKEN_STORAGE_KEY = 'clavnnx_verify_token';
        const STEP_STORAGE_KEY = 'clavnnx_current_step';

        // Enhanced token management functions
        function saveToken(token) {
            if (token) {
                console.log('Saving token:', token);
                localStorage.setItem(TOKEN_STORAGE_KEY, token);
                sessionStorage.setItem(TOKEN_STORAGE_KEY, token);
            }
        }

        function getToken() {
            // Check URL first
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get('token');
            
            if (tokenFromUrl) {
                console.log('Token found in URL:', tokenFromUrl);
                saveToken(tokenFromUrl);
                return tokenFromUrl;
            }
            
            // Check localStorage and sessionStorage
            const storedToken = localStorage.getItem(TOKEN_STORAGE_KEY) || sessionStorage.getItem(TOKEN_STORAGE_KEY);
            if (storedToken) {
                console.log('Token found in storage:', storedToken);
                return storedToken;
            }
            
            console.log('No token found');
            return null;
        }

        function clearToken() {
            localStorage.removeItem(TOKEN_STORAGE_KEY);
            sessionStorage.removeItem(TOKEN_STORAGE_KEY);
            localStorage.removeItem(STEP_STORAGE_KEY);
            sessionStorage.removeItem(STEP_STORAGE_KEY);
        }

        // Step progress management
        function saveStepProgress(step) {
            localStorage.setItem(STEP_STORAGE_KEY, step.toString());
            sessionStorage.setItem(STEP_STORAGE_KEY, step.toString());
            console.log('Step progress saved:', step);
        }

        function getStepProgress() {
            const step = localStorage.getItem(STEP_STORAGE_KEY) || sessionStorage.getItem(STEP_STORAGE_KEY) || '0';
            return parseInt(step);
        }

        function updateStepIndicator(currentStep, totalSteps = 3) {
            stepIndicator.style.display = 'block';
            stepIndicator.textContent = `Progress: Step ${currentStep}/${totalSteps} Completed`;
            
            if (currentStep >= totalSteps) {
                stepIndicator.className = 'success-message';
                stepIndicator.textContent = '✅ All Steps Completed! Ready to generate key';
            }
        }

        // Generate or get token for new users
        function generateToken() {
            const timestamp = Date.now();
            const randomStr = Math.random().toString(36).substring(2, 15);
            return `token_${timestamp}_${randomStr}`;
        }

        // Get current page info
        const currentPath = window.location.pathname;
        const urlParams = new URLSearchParams(window.location.search);
        let token = getToken();
        const completed = urlParams.get('completed');

        console.log('Current path:', currentPath);
        console.log('Current token:', token);
        console.log('Completed:', completed);

        // Initialize page based on current path
        initializePage();

        function initializePage() {
            if (currentPath === '/') {
                initializeHomePage();
            } else if (currentPath === '/step1') {
                initializeStep1Page();
            } else if (currentPath === '/step2') {
                initializeStep2Page();
            } else if (currentPath === '/step3') {
                initializeStep3Page();
            } else if (currentPath === '/generate-key-secure-xyz') {
                initializeGeneratePage();
            }
        }

        function initializeHomePage() {
            // Generate token if none exists
            if (!token) {
                token = generateToken();
                saveToken(token);
                saveStepProgress(0);
                console.log('Generated new token:', token);
            }
            
            const currentStep = getStepProgress();
            if (currentStep > 0) {
                updateStepIndicator(currentStep);
            }
            
            btnContinue.textContent = 'Complete the step';
            output.textContent = 'Complete verification steps to get your API key\n\nClick the button below to start the verification process.';
            
            btnContinue.addEventListener('click', () => {
                if (currentStep >= 3) {
                    // All steps completed, go to generate key
                    window.location.href = `/generate-key-secure-xyz?token=${token}`;
                } else {
                    // Start verification process
                    window.location.href = `/step1?token=${token}`;
                }
            });
        }

        function initializeStep1Page() {
            if (!token) {
                token = generateToken();
                saveToken(token);
                console.log('Generated new token for step1:', token);
            }
            
            const currentStep = getStepProgress();
            updateStepIndicator(Math.max(currentStep, 0));
            
            btnContinue.textContent = 'Step 1/3 - Complete Verification';
            output.textContent = 'Step 1 of 3: Verification Process\n\nClick the button below to complete the first verification step.\n\nAfter clicking, you will be redirected to complete the verification task.';
            
            btnContinue.addEventListener('click', () => {
                // Mark step 1 as completed before going to Vertise
                saveStepProgress(1);
                updateStepIndicator(1);
                
                // Show success message
                output.textContent = 'Step 1 starting... You will be redirected to complete verification.\n\nAfter completing the task, you will return to step 2.';
                btnContinue.textContent = 'Redirecting...';
                btnContinue.disabled = true;
                
                // Set return URL for after Vertise completion
                const returnUrl = `${window.location.origin}/step2?token=${token}`;
                
                setTimeout(() => {
                    window.location.href = `https://link-hub.net/1385845/qklnqONg4HgC?return=${encodeURIComponent(returnUrl)}`;
                }, 2000);
            });
        }

        function initializeStep2Page() {
            if (!token) {
                output.textContent = 'Error: No verification token found. Please start the verification process again.';
                btnContinue.textContent = 'Start Over';
                btnContinue.addEventListener('click', () => {
                    clearToken();
                    window.location.href = '/';
                });
                return;
            }
            
            const currentStep = getStepProgress();
            
            // Ensure we're at least at step 1
            if (currentStep < 1) {
                saveStepProgress(1);
            }
            
            updateStepIndicator(Math.max(currentStep, 1));
            
            btnContinue.textContent = 'Step 2/3 - Complete Verification';
            output.textContent = 'Step 2 of 3: Verification Process\n\nStep 1 completed successfully! ✅\n\nClick the button below to complete the second verification step.';
            
            btnContinue.addEventListener('click', () => {
                // Mark step 2 as completed before going to Vertise
                saveStepProgress(2);
                updateStepIndicator(2);
                
                // Show success message
                output.textContent = 'Step 2 starting... You will be redirected to complete verification.\n\nAfter completing the task, you will return to step 3.';
                btnContinue.textContent = 'Redirecting...';
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step3?token=${token}`;
                
                setTimeout(() => {
                    window.location.href = `https://link-target.net/1385845/2FtUqPh7m718?return=${encodeURIComponent(returnUrl)}`;
                }, 2000);
            });
        }

        function initializeStep3Page() {
            if (!token) {
                output.textContent = 'Error: No verification token found. Please start the verification process again.';
                btnContinue.textContent = 'Start Over';
                btnContinue.addEventListener('click', () => {
                    clearToken();
                    window.location.href = '/';
                });
                return;
            }
            
            const currentStep = getStepProgress();
            
            // Ensure we're at least at step 2
            if (currentStep < 2) {
                saveStepProgress(2);
            }
            
            if (completed === 'true' || currentStep >= 3) {
                // All steps completed, show "Take the key" button
                saveStepProgress(3);
                updateStepIndicator(3);
                
                btnContinue.style.display = 'none';
                btnTakeKey.style.display = 'block';
                output.textContent = 'All verification steps completed! ✅\n\nStep 1: ✅ Completed\nStep 2: ✅ Completed  \nStep 3: ✅ Completed\n\nClick "Take the key" to generate your API key.';
                
                btnTakeKey.addEventListener('click', () => {
                    window.location.href = '/generate-key-secure-xyz?token=' + token;
                });
            } else {
                updateStepIndicator(Math.max(currentStep, 2));
                
                btnContinue.textContent = 'Step 3/3 - Complete Verification';
                output.textContent = 'Step 3 of 3: Final Verification\n\nStep 1: ✅ Completed\nStep 2: ✅ Completed\n\nClick the button below to complete the final verification step.';
                
                btnContinue.addEventListener('click', () => {
                    // Mark step 3 as completed before going to Vertise
                    saveStepProgress(3);
                    updateStepIndicator(3);
                    
                    // Show success message
                    output.textContent = 'Step 3 starting... You will be redirected to complete verification.\n\nAfter completing the task, you will return to generate your key.';
                    btnContinue.textContent = 'Redirecting...';
                    btnContinue.disabled = true;
                    
                    const returnUrl = `${window.location.origin}/step3?token=${token}&completed=true`;
                    
                    setTimeout(() => {
                        window.location.href = `https://link-target.net/1385845/GlkP3DeSeukX?return=${encodeURIComponent(returnUrl)}`;
                    }, 2000);
                });
            }
        }

        function initializeGeneratePage() {
            if (!token) {
                output.textContent = 'Error: No verification token found. Please complete all verification steps first.';
                btnContinue.textContent = 'Start Over';
                btnContinue.addEventListener('click', () => {
                    clearToken();
                    window.location.href = '/';
                });
                return;
            }

            const currentStep = getStepProgress();
            
            // Show final step indicator
            updateStepIndicator(3);
            
            // Show timer - Extended to 15 minutes for Vertise completion
            timerDiv.style.display = 'block';
            timeRemaining = 15 * 60; // 15 minutes in seconds
            startTimer();
            
            btnContinue.textContent = 'Generate Key';
            btnContinue.id = 'btnGen';
            output.textContent = `Ready to generate your API key! 🎉\n\nAll verification steps completed:\n✅ Step 1/3: Completed\n✅ Step 2/3: Completed\n✅ Step 3/3: Completed\n\nClick "Generate Key" below to get your API key.\n\nNote: This page will expire in 15 minutes for security.`;
            
            // Check for existing key first (anti-refresh protection)
            checkExistingKey();
            
            btnContinue.addEventListener('click', async () => {
                await generateKey();
            });
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                timeLeftSpan.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    // Redirect to home when expired
                    output.textContent = 'Generate key access has expired. Please complete verification steps again.';
                    btnContinue.style.display = 'none';
                    timerDiv.textContent = 'EXPIRED - Please start over';
                    
                    setTimeout(() => {
                        clearToken();
                        window.location.href = '/';
                    }, 3000);
                }
            }, 1000);
        }

        async function verifyTokenAndShowStep(step) {
            // Since we're managing steps locally now, just check our local progress
            const currentStep = getStepProgress();
            
            if (currentStep >= step - 1) {
                return true; // Step requirements met
            } else {
                output.textContent = `Error: Please complete previous steps first. Current progress: Step ${currentStep}/3`;
                btnContinue.style.display = 'none';
                return false;
            }
        }

        async function checkExistingKey() {
            try {
                console.log('Checking existing key with token:', token);
                
                // For demo purposes, we'll simulate the key generation
                // In real implementation, this would connect to your backend
                
                // Check if key was previously generated
                const existingKey = localStorage.getItem(`generated_key_${token}`);
                if (existingKey) {
                    const keyData = JSON.parse(existingKey);
                    const expiry = new Date(keyData.expires);
                    
                    if (expiry > new Date()) {
                        currentKey = keyData.key;
                        output.textContent = `Key: ${keyData.key}\n\nExpires: ${expiry.toLocaleString()}\n\nValid for 24 hours from generation.\n\nExisting key loaded (anti-refresh protection)`;
                        btnCopy.style.display = 'block';
                        btnContinue.style.display = 'none';
                        return;
                    }
                }
                
            } catch (error) {
                console.log('No existing key found, error:', error);
            }
        }

        async function generateKey() {
            const btnGen = document.getElementById('btnGen');
            btnGen.disabled = true;
            btnGen.textContent = 'Generating...';
            btnGen.classList.add('loading');
            
            try {
                console.log('Generating key with token:', token);
                
                // Check if all steps are completed locally
                const currentStep = getStepProgress();
                if (currentStep < 3) {
                    output.textContent = `Error: Not all verification steps completed.\n\nCurrent progress: Step ${currentStep}/3\n\nPlease complete all verification steps first.`;
                    
                    // Add button to go back to appropriate step
                    const backBtn = document.createElement('button');
                    backBtn.textContent = `Continue Step ${currentStep + 1}/3`;
                    backBtn.style.cssText = 'width: 100%; padding: 15px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; font-weight: bold; background: #007bff; color: white;';
                    backBtn.onclick = () => {
                        if (currentStep === 0) {
                            window.location.href = `/step1?token=${token}`;
                        } else if (currentStep === 1) {
                            window.location.href = `/step2?token=${token}`;
                        } else if (currentStep === 2) {
                            window.location.href = `/step3?token=${token}`;
                        }
                    };
                    btnGen.parentNode.appendChild(backBtn);
                    return;
                }
                
                // Simulate API key generation
                const timestamp = Date.now();
                const randomKey = 'sk-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                const expires = new Date(Date.now() + 24 * 60 * 60 * 1000); // 24 hours from now
                
                const keyData = {
                    key: randomKey,
                    expires: expires.toISOString(),
                    generated: new Date().toISOString()
                };
                
                // Save key to prevent regeneration on refresh
                localStorage.setItem(`generated_key_${token}`, JSON.stringify(keyData));
                
                currentKey = keyData.key;
                
                output.textContent = `Key: ${keyData.key}\n\nExpires: ${expires.toLocaleString()}\n\nValid for 24 hours from generation.\n\nKey generated successfully! 🎉`;
                btnCopy.style.display = 'block';
                btnGen.style.display = 'none';
                
                // Clear the timer since key is generated
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerDiv.style.display = 'none';
                }
                
            } catch (error) {
                console.error('Error generating key:', error);
                output.textContent = `Error: Unable to generate key.\n\nPlease try again or contact support.\n\nError: ${error.message}`;
                btnCopy.style.display = 'none';
            }
            
            btnGen.disabled = false;
            btnGen.textContent = 'Generate Key';
            btnGen.classList.remove('loading');
        }

        btnCopy.addEventListener('click', async () => {
            if (currentKey) {
                try {
                    await navigator.clipboard.writeText(currentKey);
                    btnCopy.textContent = 'Copied!';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                    }, 2000);
                } catch (error) {
                    // Fallback for older browsers
                    const textArea = document.createElement('textarea');
                    textArea.value = currentKey;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    btnCopy.textContent = 'Copied!';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                    }, 2000);
                }
            }
        });

        // Debug info for troubleshooting
        console.log('Page loaded:', {
            path: currentPath,
            token: token,
            completed: completed,
            currentStep: getStepProgress(),
            localStorage: localStorage.getItem(TOKEN_STORAGE_KEY),
            sessionStorage: sessionStorage.getItem(TOKEN_STORAGE_KEY)
        });
    </script>
</body>
</html>

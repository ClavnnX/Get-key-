<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClavnnX Get key</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #000000 !important;
            color: #ffffff;
        }
        .container {
            background: #222222 !important;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(255,255,255,0.2);
            border: 2px solid #444444;
        }
        h1 {
            text-align: center;
            color: #ffffff !important;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #btnContinue, #btnGen, #btnTakeKey {
            background: #007bff;
            color: white;
        }
        #btnContinue:hover, #btnGen:hover, #btnTakeKey:hover {
            background: #0056b3;
        }
        #btnTakeKey {
            background: #28a745;
            display: none;
            margin-top: 10px;
        }
        #btnTakeKey:hover {
            background: #1e7e34;
        }
        #btnCopy {
            background: #28a745;
            color: white;
            display: none;
        }
        #btnCopy:hover {
            background: #1e7e34;
        }
        #out {
            background: #2d2d2d;
            border: 1px solid #444444;
            border-radius: 8px;
            padding: 20px;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        .timer {
            background: #dc3545;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        .step-indicator {
            background: #17a2b8;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .success-message {
            background: #28a745;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        .error-message {
            background: #dc3545;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ClavnnX Get key</h1>
        <div class="step-indicator" id="stepIndicator" style="display: none;">Step Progress</div>
        <button id="btnContinue">Complete the step</button>
        <div class="timer" id="timer">Generate key link expires in: <span id="timeLeft">5:00</span></div>
        <div id="out">Click "Complete the step" to proceed through verification steps</div>
        <button id="btnTakeKey" style="display: none;">Take the key</button>
        <button id="btnCopy" style="display: none;">Copy Key</button>
    </div>

    <script>
        const btnContinue = document.getElementById('btnContinue');
        const btnTakeKey = document.getElementById('btnTakeKey');
        const btnCopy = document.getElementById('btnCopy');
        const output = document.getElementById('out');
        const timerDiv = document.getElementById('timer');
        const timeLeftSpan = document.getElementById('timeLeft');
        const stepIndicator = document.getElementById('stepIndicator');
        let currentKey = '';
        let timerInterval = null;
        let timeRemaining = 0;

        // Storage keys
        const TOKEN_STORAGE_KEY = 'clavnnx_verify_token';
        const STEP_STORAGE_KEY = 'clavnnx_current_step';
        const VERTISE_TIMESTAMP_KEY = 'clavnnx_vertise_timestamps';
        const BYPASS_ATTEMPT_KEY = 'clavnnx_bypass_attempts';

        // Token management
        function generateToken() {
            const timestamp = Date.now();
            const randomStr = Math.random().toString(36).substring(2, 15);
            return `token_${timestamp}_${randomStr}`;
        }

        function saveToken(token) {
            if (token) {
                localStorage.setItem(TOKEN_STORAGE_KEY, token);
                sessionStorage.setItem(TOKEN_STORAGE_KEY, token);
            }
        }

        function getToken() {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get('token');
            
            if (tokenFromUrl) {
                saveToken(tokenFromUrl);
                return tokenFromUrl;
            }
            
            return localStorage.getItem(TOKEN_STORAGE_KEY) || sessionStorage.getItem(TOKEN_STORAGE_KEY);
        }

        function clearSession() {
            localStorage.removeItem(TOKEN_STORAGE_KEY);
            sessionStorage.removeItem(TOKEN_STORAGE_KEY);
            localStorage.removeItem(STEP_STORAGE_KEY);
            sessionStorage.removeItem(STEP_STORAGE_KEY);
            localStorage.removeItem(VERTISE_TIMESTAMP_KEY);
            sessionStorage.removeItem(VERTISE_TIMESTAMP_KEY);
            localStorage.removeItem(BYPASS_ATTEMPT_KEY);
            sessionStorage.removeItem(BYPASS_ATTEMPT_KEY);
        }

        // Step progress with anti-bypass protection
        function saveStepProgress(step) {
            localStorage.setItem(STEP_STORAGE_KEY, step.toString());
            sessionStorage.setItem(STEP_STORAGE_KEY, step.toString());
            console.log('Step progress saved:', step);
        }

        function getStepProgress() {
            const step = localStorage.getItem(STEP_STORAGE_KEY) || sessionStorage.getItem(STEP_STORAGE_KEY) || '0';
            return parseInt(step);
        }

        // Vertise completion tracking with timestamps
        function saveVertiseCompletion(step) {
            const timestamps = getVertiseTimestamps();
            timestamps[step] = Date.now();
            localStorage.setItem(VERTISE_TIMESTAMP_KEY, JSON.stringify(timestamps));
            sessionStorage.setItem(VERTISE_TIMESTAMP_KEY, JSON.stringify(timestamps));
            console.log(`Vertise step ${step} completed at:`, new Date());
        }

        function getVertiseTimestamps() {
            const stored = localStorage.getItem(VERTISE_TIMESTAMP_KEY) || sessionStorage.getItem(VERTISE_TIMESTAMP_KEY);
            return stored ? JSON.parse(stored) : {};
        }

        function validateVertiseCompletion(step) {
            const timestamps = getVertiseTimestamps();
            if (!timestamps[step]) return false;
            
            // Check if completion was recent (within 1 hour)
            const timeDiff = Date.now() - timestamps[step];
            const maxAllowedTime = 60 * 60 * 1000; // 1 hour
            
            return timeDiff <= maxAllowedTime;
        }

        // Bypass attempt tracking
        function recordBypassAttempt() {
            const attempts = getBypassAttempts();
            attempts.push({
                timestamp: Date.now(),
                userAgent: navigator.userAgent,
                url: window.location.href,
                referrer: document.referrer
            });
            
            localStorage.setItem(BYPASS_ATTEMPT_KEY, JSON.stringify(attempts));
            sessionStorage.setItem(BYPASS_ATTEMPT_KEY, JSON.stringify(attempts));
        }

        function getBypassAttempts() {
            const stored = localStorage.getItem(BYPASS_ATTEMPT_KEY) || sessionStorage.getItem(BYPASS_ATTEMPT_KEY);
            return stored ? JSON.parse(stored) : [];
        }

        // Check if user is trying to bypass (accessing step pages directly without proper flow)
        function detectBypassAttempt() {
            const currentPath = window.location.pathname;
            const urlParams = new URLSearchParams(window.location.search);
            const token = getToken();
            const currentStep = getStepProgress();
            
            // If accessing step pages
            if (currentPath.includes('/step')) {
                const stepNumber = parseInt(currentPath.replace('/step', ''));
                
                // Check if this is a legitimate return from Vertise
                const vertiseCompleted = urlParams.get('vertise_completed');
                if (vertiseCompleted && parseInt(vertiseCompleted) === stepNumber) {
                    return false; // Legitimate return from Vertise
                }
                
                // Check if user has proper step progression
                if (stepNumber > currentStep + 1) {
                    recordBypassAttempt();
                    return true; // Bypass attempt detected
                }
                
                // Check if user has completed previous steps properly
                if (stepNumber > 1) {
                    for (let i = 1; i < stepNumber; i++) {
                        if (!validateVertiseCompletion(i)) {
                            recordBypassAttempt();
                            return true; // Previous steps not completed properly
                        }
                    }
                }
            }
            
            // If accessing generate page without completing all steps
            if (currentPath === '/generate-key-secure-xyz') {
                if (currentStep < 3 || !validateVertiseCompletion(1) || !validateVertiseCompletion(2) || !validateVertiseCompletion(3)) {
                    recordBypassAttempt();
                    return true;
                }
            }
            
            return false;
        }

        function updateStepIndicator(currentStep, totalSteps = 3) {
            stepIndicator.style.display = 'block';
            stepIndicator.className = 'step-indicator';
            stepIndicator.textContent = `Progress: Step ${currentStep}/${totalSteps} Completed`;
            
            if (currentStep >= totalSteps) {
                stepIndicator.className = 'success-message';
                stepIndicator.textContent = '✅ All Steps Completed! Ready to generate key';
            }
        }

        // Main page initialization
        function initializePage() {
            const currentPath = window.location.pathname;
            console.log('Initializing page:', currentPath);
            
            // Detect bypass attempts
            if (detectBypassAttempt()) {
                showBypassDetected();
                return;
            }
            
            // Route to appropriate page handler
            if (currentPath === '/') {
                initializeHomePage();
            } else if (currentPath === '/step1') {
                initializeStep1Page();
            } else if (currentPath === '/step2') {
                initializeStep2Page();
            } else if (currentPath === '/step3') {
                initializeStep3Page();
            } else if (currentPath === '/generate-key-secure-xyz') {
                initializeGeneratePage();
            } else {
                initializeHomePage(); // Default to homepage for unknown paths
            }
        }

        function showBypassDetected() {
            stepIndicator.style.display = 'block';
            stepIndicator.className = 'error-message';
            stepIndicator.textContent = '🚫 Bypass Attempt Detected';
            
            btnContinue.textContent = 'Start From Beginning';
            btnContinue.style.background = '#dc3545';
            
            const attempts = getBypassAttempts();
            output.textContent = `Bypass attempt detected! 🚨\n\nYou must complete all verification steps in proper order.\n\nAttempting to skip steps is not allowed.\n\nBypass attempts logged: ${attempts.length}\n\nClick below to start the proper verification process.`;
            
            btnContinue.addEventListener('click', () => {
                clearSession();
                window.location.href = '/';
            });
        }

        // Page handlers
        function initializeHomePage() {
            let token = getToken();
            if (!token) {
                token = generateToken();
                saveToken(token);
                console.log('Generated new token:', token);
            }
            
            const currentStep = getStepProgress();
            
            if (currentStep > 0) {
                updateStepIndicator(currentStep);
                
                if (currentStep >= 3 && validateVertiseCompletion(1) && validateVertiseCompletion(2) && validateVertiseCompletion(3)) {
                    btnContinue.textContent = 'Generate API Key';
                    output.textContent = `Welcome back! All steps completed ✅\n\n✅ Step 1/3: Completed\n✅ Step 2/3: Completed\n✅ Step 3/3: Completed\n\nClick below to generate your API key.`;
                    
                    btnContinue.addEventListener('click', () => {
                        window.location.href = `/generate-key-secure-xyz?token=${token}`;
                    });
                } else {
                    btnContinue.textContent = `Continue Step ${currentStep + 1}/3`;
                    output.textContent = `Welcome back! Progress: ${currentStep}/3 steps completed.\n\nClick below to continue verification process.`;
                    
                    btnContinue.addEventListener('click', () => {
                        window.location.href = `/step${currentStep + 1}?token=${token}`;
                    });
                }
            } else {
                btnContinue.textContent = 'Start Verification Process';
                output.textContent = 'Welcome to ClavnnX API Key Generator\n\nTo get your API key, you must complete 3 verification steps.\n\nEach step requires completing a verification task.\n\nClick below to start the verification process.';
                
                btnContinue.addEventListener('click', () => {
                    window.location.href = `/step1?token=${token}`;
                });
            }
        }

        function initializeStep1Page() {
            const token = getToken();
            const urlParams = new URLSearchParams(window.location.search);
            
            if (!token) {
                output.textContent = 'Error: No verification token found. Please start from homepage.';
                btnContinue.textContent = 'Go to Homepage';
                btnContinue.addEventListener('click', () => {
                    window.location.href = '/';
                });
                return;
            }
            
            // Check if returning from Vertise
            if (urlParams.get('vertise_completed') === '1') {
                saveStepProgress(1);
                saveVertiseCompletion(1);
                
                updateStepIndicator(1);
                output.textContent = 'Step 1 completed successfully! ✅\n\nRedirecting to Step 2...';
                btnContinue.style.display = 'none';
                
                setTimeout(() => {
                    window.location.href = `/step2?token=${token}`;
                }, 2000);
                return;
            }
            
            updateStepIndicator(0);
            btnContinue.textContent = 'Step 1/3 - Complete Verification';
            output.textContent = 'Step 1 of 3: First Verification\n\nClick the button below to complete the first verification step.\n\nYou will be redirected to complete the verification task.\n\nAfter completing the task, you will return here automatically.';
            
            btnContinue.addEventListener('click', () => {
                output.textContent = 'Redirecting to verification task...\n\nPlease complete the task and you will return automatically.';
                btnContinue.textContent = 'Redirecting...';
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step1?token=${token}&vertise_completed=1`;
                
                setTimeout(() => {
                    window.location.href = `https://link-hub.net/1385845/qklnqONg4HgC?return=${encodeURIComponent(returnUrl)}`;
                }, 2000);
            });
        }

        function initializeStep2Page() {
            const token = getToken();
            const urlParams = new URLSearchParams(window.location.search);
            const currentStep = getStepProgress();
            
            if (!token || currentStep < 1 || !validateVertiseCompletion(1)) {
                output.textContent = 'Error: Step 1 must be completed first.\n\nPlease complete Step 1 before accessing Step 2.';
                btnContinue.textContent = 'Go to Step 1';
                btnContinue.addEventListener('click', () => {
                    window.location.href = `/step1?token=${token || generateToken()}`;
                });
                return;
            }
            
            // Check if returning from Vertise
            if (urlParams.get('vertise_completed') === '2') {
                saveStepProgress(2);
                saveVertiseCompletion(2);
                
                updateStepIndicator(2);
                output.textContent = 'Step 2 completed successfully! ✅\n\n✅ Step 1: Completed\n✅ Step 2: Completed\n\nRedirecting to Step 3...';
                btnContinue.style.display = 'none';
                
                setTimeout(() => {
                    window.location.href = `/step3?token=${token}`;
                }, 2000);
                return;
            }
            
            updateStepIndicator(1);
            btnContinue.textContent = 'Step 2/3 - Complete Verification';
            output.textContent = 'Step 2 of 3: Second Verification\n\n✅ Step 1: Completed\n\nClick the button below to complete the second verification step.';
            
            btnContinue.addEventListener('click', () => {
                output.textContent = 'Redirecting to verification task...\n\nPlease complete the task and you will return automatically.';
                btnContinue.textContent = 'Redirecting...';
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step2?token=${token}&vertise_completed=2`;
                
                setTimeout(() => {
                    window.location.href = `https://link-target.net/1385845/2FtUqPh7m718?return=${encodeURIComponent(returnUrl)}`;
                }, 2000);
            });
        }

        function initializeStep3Page() {
            const token = getToken();
            const urlParams = new URLSearchParams(window.location.search);
            const currentStep = getStepProgress();
            
            if (!token || currentStep < 2 || !validateVertiseCompletion(1) || !validateVertiseCompletion(2)) {
                let missingStep = !validateVertiseCompletion(1) ? 1 : 2;
                output.textContent = `Error: Previous steps must be completed first.\n\nPlease complete Step ${missingStep} before accessing this page.`;
                btnContinue.textContent = `Go to Step ${missingStep}`;
                btnContinue.addEventListener('click', () => {
                    window.location.href = `/step${missingStep}?token=${token || generateToken()}`;
                });
                return;
            }
            
            // Check if returning from Vertise
            if (urlParams.get('vertise_completed') === '3') {
                saveStepProgress(3);
                saveVertiseCompletion(3);
                
                updateStepIndicator(3);
                btnContinue.style.display = 'none';
                btnTakeKey.style.display = 'block';
                output.textContent = 'All verification steps completed! ✅\n\n✅ Step 1: Completed\n✅ Step 2: Completed\n✅ Step 3: Completed\n\nClick "Take the key" to generate your API key.';
                
                btnTakeKey.addEventListener('click', () => {
                    window.location.href = `/generate-key-secure-xyz?token=${token}`;
                });
                return;
            }
            
            // Check if already completed all steps
            if (currentStep >= 3 && validateVertiseCompletion(3)) {
                updateStepIndicator(3);
                btnContinue.style.display = 'none';
                btnTakeKey.style.display = 'block';
                output.textContent = 'All verification steps completed! ✅\n\n✅ Step 1: Completed\n✅ Step 2: Completed\n✅ Step 3: Completed\n\nClick "Take the key" to generate your API key.';
                
                btnTakeKey.addEventListener('click', () => {
                    window.location.href = `/generate-key-secure-xyz?token=${token}`;
                });
                return;
            }
            
            updateStepIndicator(2);
            btnContinue.textContent = 'Step 3/3 - Complete Final Verification';
            output.textContent = 'Step 3 of 3: Final Verification\n\n✅ Step 1: Completed\n✅ Step 2: Completed\n\nClick the button below to complete the final verification step.';
            
            btnContinue.addEventListener('click', () => {
                output.textContent = 'Redirecting to final verification task...\n\nPlease complete the task and you will return automatically.';
                btnContinue.textContent = 'Redirecting...';
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step3?token=${token}&vertise_completed=3`;
                
                setTimeout(() => {
                    window.location.href = `https://link-target.net/1385845/GlkP3DeSeukX?return=${encodeURIComponent(returnUrl)}`;
                }, 2000);
            });
        }

        function initializeGeneratePage() {
            const token = getToken();
            const currentStep = getStepProgress();
            
            // Strict validation
            if (!token || currentStep < 3 || !validateVertiseCompletion(1) || !validateVertiseCompletion(2) || !validateVertiseCompletion(3)) {
                output.textContent = 'Error: All verification steps must be completed before generating key.\n\nPlease complete all 3 verification steps properly.';
                btnContinue.textContent = 'Start Verification';
                btnContinue.addEventListener('click', () => {
                    clearSession();
                    window.location.href = '/';
                });
                return;
            }
            
            updateStepIndicator(3);
            
            // Show timer
            timerDiv.style.display = 'block';
            timeRemaining = 15 * 60; // 15 minutes
            startTimer();
            
            btnContinue.textContent = 'Generate API Key';
            btnContinue.id = 'btnGen';
            output.textContent = 'Ready to generate your API key! 🎉\n\nAll verification steps completed:\n✅ Step 1/3: Completed\n✅ Step 2/3: Completed\n✅ Step 3/3: Completed\n\nClick "Generate API Key" below to get your key.\n\nNote: This page will expire in 15 minutes for security.';
            
            // Check for existing key
            checkExistingKey();
            
            btnContinue.addEventListener('click', async () => {
                await generateKey();
            });
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                timeLeftSpan.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    output.textContent = 'Generate key session has expired for security.\n\nPlease complete verification steps again.';
                    btnContinue.style.display = 'none';
                    timerDiv.textContent = 'EXPIRED - Please start over';
                    
                    setTimeout(() => {
                        clearSession();
                        window.location.href = '/';
                    }, 3000);
                }
            }, 1000);
        }

        async function checkExistingKey() {
            try {
                const token = getToken();
                const existingKey = localStorage.getItem(`generated_key_${token}`);
                
                if (existingKey) {
                    const keyData = JSON.parse(existingKey);
                    const expiry = new Date(keyData.expires);
                    
                    if (expiry > new Date()) {
                        currentKey = keyData.key;
                        output.textContent = `Your API Key: ${keyData.key}\n\nExpires: ${expiry.toLocaleString()}\n\nValid for 24 hours from generation.\n\nKey retrieved successfully! 🎉`;
                        btnCopy.style.display = 'block';
                        btnContinue.style.display = 'none';
                        
                        if (timerInterval) {
                            clearInterval(timerInterval);
                            timerDiv.style.display = 'none';
                        }
                        return;
                    }
                }
            } catch (error) {
                console.log('No existing valid key found');
            }
        }

        async function generateKey() {
            const btnGen = document.getElementById('btnGen');
            btnGen.disabled = true;
            btnGen.textContent = 'Generating...';
            btnGen.classList.add('loading');
            
            try {
                const token = getToken();
                const currentStep = getStepProgress();
                
                // Final security check
                if (currentStep < 3 || !validateVertiseCompletion(1) || !validateVertiseCompletion(2) || !validateVertiseCompletion(3)) {
                    throw new Error('All verification steps must be completed through proper Vertise flow');
                }
                
                // Generate key
                const randomKey = 'sk-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                const expires = new Date(Date.now() + 24 * 60 * 60 * 1000);
                
                const keyData = {
                    key: randomKey,
                    expires: expires.toISOString(),
                    generated: new Date().toISOString(),
                    token: token
                };
                
                localStorage.setItem(`generated_key_${token}`, JSON.stringify(keyData));
                
                currentKey = keyData.key;
                
                output.textContent = `Your API Key: ${keyData.key}\n\nExpires: ${expires.toLocaleString()}\n\nValid for 24 hours from generation.\n\nKey generated successfully! 🎉`;
                btnCopy.style.display = 'block';
                btnGen.style.display = 'none';
                
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerDiv.style.display = 'none';
                }
                
            } catch (error) {
                console.error('Error generating key:', error);
                output.textContent = `Error: ${error.message}\n\nPlease start the verification process again.`;
                
                setTimeout(() => {
                    clearSession();
                    window.location.href = '/';
                }, 3000);
            }
            
            btnGen.disabled = false;
            btnGen.textContent = 'Generate API Key';
            btnGen.classList.remove('loading');
        }

        btnCopy.addEventListener('click', async () => {
            if (currentKey) {
                try {
                    await navigator.clipboard.writeText(currentKey);
                    btnCopy.textContent = 'Copied!';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                    }, 2000);
                } catch (error) {
                    const textArea = document.createElement('textarea');
                    textArea.value = currentKey;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    btnCopy.textContent = 'Copied!';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                    }, 2000);
                }
            }
        });

        // Initialize the page
        initializePage();

        // Debug logging
        console.log('Page initialized:', {
            path: window.location.pathname,
            step: getStepProgress(),
            token: getToken(),
            vertiseTimestamps: getVertiseTimestamps(),
            bypassAttempts: getBypassAttempts().length
        });
    </script>
</body>
</html>

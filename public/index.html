<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClavnnX Get key</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #000000 !important;
            color: #ffffff;
        }
        .container {
            background: #222222 !important;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(255,255,255,0.2);
            border: 2px solid #444444;
        }
        h1 {
            text-align: center;
            color: #ffffff !important;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #btnContinue, #btnGen, #btnTakeKey {
            background: #007bff;
            color: white;
        }
        #btnContinue:hover, #btnGen:hover, #btnTakeKey:hover {
            background: #0056b3;
        }
        #btnTakeKey {
            background: #28a745;
            display: none;
            margin-top: 10px;
        }
        #btnTakeKey:hover {
            background: #1e7e34;
        }
        #btnCopy {
            background: #28a745;
            color: white;
            display: none;
        }
        #btnCopy:hover {
            background: #1e7e34;
        }
        #out {
            background: #2d2d2d;
            border: 1px solid #444444;
            border-radius: 8px;
            padding: 20px;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        .timer {
            background: #dc3545;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ClavnnX Get key</h1>
        <button id="btnContinue">Complete the step</button>
        <div class="timer" id="timer">Generate key link expires in: <span id="timeLeft">5:00</span></div>
        <div id="out">Click "Complete the step" to proceed through verification steps</div>
        <button id="btnTakeKey" style="display: none;">Take the key</button>
        <button id="btnCopy" style="display: none;">Copy Key</button>
    </div>

    <script>
        const btnContinue = document.getElementById('btnContinue');
        const btnTakeKey = document.getElementById('btnTakeKey');
        const btnCopy = document.getElementById('btnCopy');
        const output = document.getElementById('out');
        const timerDiv = document.getElementById('timer');
        const timeLeftSpan = document.getElementById('timeLeft');
        let currentKey = '';
        let timerInterval = null;
        let timeRemaining = 0;

        // Token storage key
        const TOKEN_STORAGE_KEY = 'clavnnx_verify_token';

        // Enhanced token management functions
        function saveToken(token) {
            if (token) {
                console.log('Saving token:', token);
                localStorage.setItem(TOKEN_STORAGE_KEY, token);
                sessionStorage.setItem(TOKEN_STORAGE_KEY, token);
            }
        }

        function getToken() {
            // Check URL first
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get('token');
            
            if (tokenFromUrl) {
                console.log('Token found in URL:', tokenFromUrl);
                saveToken(tokenFromUrl);
                return tokenFromUrl;
            }
            
            // Check localStorage and sessionStorage
            const storedToken = localStorage.getItem(TOKEN_STORAGE_KEY) || sessionStorage.getItem(TOKEN_STORAGE_KEY);
            if (storedToken) {
                console.log('Token found in storage:', storedToken);
                return storedToken;
            }
            
            console.log('No token found');
            return null;
        }

        function clearToken() {
            localStorage.removeItem(TOKEN_STORAGE_KEY);
            sessionStorage.removeItem(TOKEN_STORAGE_KEY);
        }

        // Get current page info
        const currentPath = window.location.pathname;
        const urlParams = new URLSearchParams(window.location.search);
        const token = getToken();
        const completed = urlParams.get('completed');

        console.log('Current path:', currentPath);
        console.log('Current token:', token);
        console.log('Completed:', completed);

        // Initialize page based on current path
        initializePage();

        function initializePage() {
            if (currentPath === '/') {
                initializeHomePage();
            } else if (currentPath === '/step1') {
                initializeStep1Page();
            } else if (currentPath === '/step2') {
                initializeStep2Page();
            } else if (currentPath === '/step3') {
                initializeStep3Page();
            } else if (currentPath === '/generate-key-secure-xyz') {
                initializeGeneratePage();
            }
        }

        function initializeHomePage() {
            if (token) {
                // If we have a token on home page, redirect to step1
                window.location.href = `/step1?token=${token}`;
                return;
            }
            
            btnContinue.textContent = 'Complete the step';
            output.textContent = 'Complete verification steps to get your API key';
            
            btnContinue.addEventListener('click', () => {
                window.location.href = '/verify';
            });
        }

        function initializeStep1Page() {
            if (!token) {
                output.textContent = 'Error: No verification token found. Please start again.';
                btnContinue.textContent = 'Start Over';
                btnContinue.addEventListener('click', () => {
                    clearToken();
                    window.location.href = '/';
                });
                return;
            }
            
            // Make sure token is saved before going to Vertise
            saveToken(token);
            
            verifyTokenAndShowStep(1);
            btnContinue.textContent = 'Step 1/3';
            
            // Remove any existing event listeners
            btnContinue.replaceWith(btnContinue.cloneNode(true));
            const newBtnContinue = document.getElementById('btnContinue');
            
            newBtnContinue.addEventListener('click', () => {
                // Save token one more time before leaving
                saveToken(token);
                console.log('Going to Vertise 1, token saved:', token);
                window.location.href = 'https://link-hub.net/1385845/qklnqONg4HgC';
            });
        }

        function initializeStep2Page() {
            if (!token) {
                output.textContent = 'Error: No verification token found. Please start the verification process again.';
                btnContinue.textContent = 'Start Over';
                btnContinue.addEventListener('click', () => {
                    clearToken();
                    window.location.href = '/';
                });
                return;
            }
            
            console.log('Step2 initialized with token:', token);
            
            // Make sure we have token in URL for consistency
            if (!urlParams.get('token')) {
                window.location.href = `/step2?token=${token}`;
                return;
            }
            
            // Save token before going to next Vertise
            saveToken(token);
            
            verifyTokenAndShowStep(2);
            btnContinue.textContent = 'Step 2/3';
            
            // Remove any existing event listeners
            btnContinue.replaceWith(btnContinue.cloneNode(true));
            const newBtnContinue = document.getElementById('btnContinue');
            
            newBtnContinue.addEventListener('click', () => {
                // Save token one more time before leaving
                saveToken(token);
                console.log('Going to Vertise 2, token saved:', token);
                window.location.href = 'https://link-target.net/1385845/2FtUqPh7m718';
            });
        }

        function initializeStep3Page() {
            if (!token) {
                output.textContent = 'Error: No verification token found. Please start the verification process again.';
                btnContinue.textContent = 'Start Over';
                btnContinue.addEventListener('click', () => {
                    clearToken();
                    window.location.href = '/';
                });
                return;
            }
            
            console.log('Step3 initialized with token:', token, 'completed:', completed);
            
            // Make sure we have token in URL for consistency
            if (!urlParams.get('token')) {
                const completedParam = completed === 'true' ? '&completed=true' : '';
                window.location.href = `/step3?token=${token}${completedParam}`;
                return;
            }
            
            if (completed === 'true') {
                // All steps completed, show "Take the key" button
                btnContinue.style.display = 'none';
                btnTakeKey.style.display = 'block';
                output.textContent = 'All verification steps completed! Click "Take the key" to generate your API key.';
                
                btnTakeKey.addEventListener('click', () => {
                    window.location.href = '/generate-key-secure-xyz?token=' + token;
                });
            } else {
                // Save token before going to final Vertise
                saveToken(token);
                
                verifyTokenAndShowStep(3);
                btnContinue.textContent = 'Step 3/3';
                
                // Remove any existing event listeners
                btnContinue.replaceWith(btnContinue.cloneNode(true));
                const newBtnContinue = document.getElementById('btnContinue');
                
                newBtnContinue.addEventListener('click', () => {
                    // Save token one more time before leaving
                    saveToken(token);
                    console.log('Going to Vertise 3, token saved:', token);
                    window.location.href = 'https://link-target.net/1385845/GlkP3DeSeukX';
                });
            }
        }

        function initializeGeneratePage() {
            if (!token) {
                output.textContent = 'Error: No verification token found. Please complete all verification steps first.';
                btnContinue.textContent = 'Start Over';
                btnContinue.addEventListener('click', () => {
                    clearToken();
                    window.location.href = '/';
                });
                return;
            }

            // Show timer
            timerDiv.style.display = 'block';
            timeRemaining = 5 * 60; // 5 minutes in seconds
            startTimer();
            
            btnContinue.textContent = 'Generate Key';
            btnContinue.id = 'btnGen';
            output.textContent = 'Ready to generate your API key! Click "Generate Key" below.\n\nNote: This page will expire in 5 minutes for security.';
            
            // Check for existing key first (anti-refresh protection)
            checkExistingKey();
            
            btnContinue.addEventListener('click', async () => {
                await generateKey();
            });
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                timeLeftSpan.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    // Redirect to home when expired
                    output.textContent = 'Generate key access has expired. Please complete verification steps again.';
                    btnContinue.style.display = 'none';
                    timerDiv.textContent = 'EXPIRED - Please start over';
                    
                    setTimeout(() => {
                        clearToken();
                        window.location.href = '/';
                    }, 3000);
                }
            }, 1000);
        }

        async function verifyTokenAndShowStep(step) {
            try {
                console.log('Verifying token:', token, 'for step:', step);
                const response = await fetch(`/verify?token=${token}`);
                const data = await response.json();
                
                if (!response.ok || !data.valid) {
                    output.textContent = 'Error: Invalid or expired verification token. Please start again.';
                    btnContinue.style.display = 'none';
                    return;
                }
                
                const currentStep = data.step;
                const requiredStep = step - 1;
                
                if (currentStep < requiredStep) {
                    output.textContent = `Error: Please complete previous steps first. Current progress: Step ${currentStep}/3`;
                    btnContinue.style.display = 'none';
                    return;
                }
                
                // Show appropriate message based on step
                if (step === 1) {
                    output.textContent = 'Complete verification step 1 of 3\n\nClick the button to proceed with Vertise verification';
                } else if (step === 2) {
                    output.textContent = 'Step 1 completed! Ready for step 2.\n\nComplete verification step 2 of 3';
                } else if (step === 3) {
                    output.textContent = 'Step 2 completed! Ready for final step.\n\nComplete verification step 3 of 3';
                }
                
            } catch (error) {
                console.error('Error verifying token:', error);
                output.textContent = 'Error: Unable to verify token. Please try again.';
                btnContinue.style.display = 'none';
            }
        }

        async function checkExistingKey() {
            try {
                console.log('Checking existing key with token:', token);
                const response = await fetch(`/getkey?token=${token}`);
                console.log('Response status:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Response data:', data);
                    if (data.key) {
                        currentKey = data.key;
                        const expiry = new Date(data.expires);
                        const keyType = data.isExisting ? 'Existing key loaded (anti-refresh protection)' : 'Key generated successfully!';
                        
                        output.textContent = `Key: ${data.key}\n\nExpires: ${expiry.toLocaleString()}\n\nValid for 24 hours from generation.\n\n${keyType}`;
                        btnCopy.style.display = 'block';
                        btnContinue.style.display = 'none';
                    }
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    console.error('Error response:', errorData);
                }
            } catch (error) {
                console.log('No existing key found, error:', error);
            }
        }

        async function generateKey() {
            const btnGen = document.getElementById('btnGen');
            btnGen.disabled = true;
            btnGen.textContent = 'Generating...';
            btnGen.classList.add('loading');
            
            try {
                console.log('Generating key with token:', token);
                
                // First, verify token is still valid
                const verifyResponse = await fetch(`/verify?token=${token}`);
                console.log('Verify response status:', verifyResponse.status);
                
                if (!verifyResponse.ok) {
                    const verifyError = await verifyResponse.json().catch(() => ({}));
                    console.error('Token verification failed:', verifyError);
                    output.textContent = `Error: Token verification failed - ${verifyError.error || 'Unknown error'}`;
                    btnCopy.style.display = 'none';
                    return;
                }
                
                const verifyData = await verifyResponse.json();
                console.log('Token verification data:', verifyData);
                
                if (!verifyData.valid) {
                    output.textContent = 'Error: Token is no longer valid. Please start verification again.';
                    btnCopy.style.display = 'none';
                    setTimeout(() => {
                        clearToken();
                        window.location.href = '/';
                    }, 3000);
                    return;
                }
                
                // Now try to generate key
                console.log('Token verified, generating key...');
                const response = await fetch(`/getkey?token=${token}`);
                console.log('Generate key response status:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Key generated successfully:', data);
                    
                    currentKey = data.key;
                    const expiry = new Date(data.expires);
                    const keyType = data.isExisting ? 'Existing key loaded (anti-refresh protection)' : 'Key generated successfully!';
                    
                    output.textContent = `Key: ${data.key}\n\nExpires: ${expiry.toLocaleString()}\n\nValid for 24 hours from generation.\n\n${keyType}`;
                    btnCopy.style.display = 'block';
                    btnGen.style.display = 'none';
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    console.error('Key generation failed:', errorData);
                    output.textContent = `Error: ${errorData.error || 'Failed to generate key'}\n\nToken: ${token}\nStatus: ${response.status}`;
                    btnCopy.style.display = 'none';
                }
            } catch (error) {
                console.error('Network error:', error);
                output.textContent = `Error: Unable to connect to server. Please try again.\n\nError details: ${error.message}`;
                btnCopy.style.display = 'none';
            }
            
            btnGen.disabled = false;
            btnGen.textContent = 'Generate Key';
            btnGen.classList.remove('loading');
        }

        btnCopy.addEventListener('click', async () => {
            if (currentKey) {
                try {
                    await navigator.clipboard.writeText(currentKey);
                    btnCopy.textContent = 'Copied!';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                    }, 2000);
                } catch (error) {
                    // Fallback for older browsers
                    const textArea = document.createElement('textarea');
                    textArea.value = currentKey;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    btnCopy.textContent = 'Copied!';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                    }, 2000);
                }
            }
        });

        // Debug info for troubleshooting
        console.log('Page loaded:', {
            path: currentPath,
            token: token,
            completed: completed,
            localStorage: localStorage.getItem(TOKEN_STORAGE_KEY),
            sessionStorage: sessionStorage.getItem(TOKEN_STORAGE_KEY)
        });
    </script>
</body>
</html>

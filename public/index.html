<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClavnnX Get key</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #000000 !important;
            color: #ffffff;
        }
        .container {
            background: #222222 !important;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(255,255,255,0.2);
            border: 2px solid #444444;
        }
        h1 {
            text-align: center;
            color: #ffffff !important;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #btnContinue, #btnGen, #btnTakeKey {
            background: #007bff;
            color: white;
        }
        #btnContinue:hover, #btnGen:hover, #btnTakeKey:hover {
            background: #0056b3;
        }
        #btnTakeKey {
            background: #28a745;
            display: none;
            margin-top: 10px;
        }
        #btnTakeKey:hover {
            background: #1e7e34;
        }
        #btnCopy {
            background: #28a745;
            color: white;
            display: none;
        }
        #btnCopy:hover {
            background: #1e7e34;
        }
        #out {
            background: #2d2d2d;
            border: 1px solid #444444;
            border-radius: 8px;
            padding: 20px;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        .timer {
            background: #dc3545;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        .step-indicator {
            background: #17a2b8;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .success-message {
            background: #28a745;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        .error-message {
            background: #dc3545;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ClavnnX Get key</h1>
        <div class="step-indicator" id="stepIndicator" style="display: none;">Step Progress</div>
        <button id="btnContinue">Complete the step</button>
        <div class="timer" id="timer">Generate key link expires in: <span id="timeLeft">5:00</span></div>
        <div id="out">Click "Complete the step" to proceed through verification steps</div>
        <button id="btnTakeKey" style="display: none;">Take the key</button>
        <button id="btnCopy" style="display: none;">Copy Key</button>
    </div>

    <script>
        const btnContinue = document.getElementById('btnContinue');
        const btnTakeKey = document.getElementById('btnTakeKey');
        const btnCopy = document.getElementById('btnCopy');
        const output = document.getElementById('out');
        const timerDiv = document.getElementById('timer');
        const timeLeftSpan = document.getElementById('timeLeft');
        const stepIndicator = document.getElementById('stepIndicator');
        let currentKey = '';
        let timerInterval = null;
        let timeRemaining = 0;

        // Storage keys
        const TOKEN_STORAGE_KEY = 'clavnnx_token_step2';
        const STEP_STORAGE_KEY = 'clavnnx_current_step';

        // Token management - hanya untuk step 2
        function saveToken(token) {
            if (token) {
                localStorage.setItem(TOKEN_STORAGE_KEY, token);
                sessionStorage.setItem(TOKEN_STORAGE_KEY, token);
            }
        }

        function getToken() {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get('token');
            
            if (tokenFromUrl) {
                saveToken(tokenFromUrl);
                return tokenFromUrl;
            }
            
            return localStorage.getItem(TOKEN_STORAGE_KEY) || sessionStorage.getItem(TOKEN_STORAGE_KEY);
        }

        function clearToken() {
            localStorage.removeItem(TOKEN_STORAGE_KEY);
            sessionStorage.removeItem(TOKEN_STORAGE_KEY);
            localStorage.removeItem(STEP_STORAGE_KEY);
            sessionStorage.removeItem(STEP_STORAGE_KEY);
        }

        function generateToken() {
            const timestamp = Date.now();
            const randomStr = Math.random().toString(36).substring(2, 15);
            return `token_${timestamp}_${randomStr}`;
        }

        // Step management
        function saveStepProgress(step) {
            localStorage.setItem(STEP_STORAGE_KEY, step.toString());
            sessionStorage.setItem(STEP_STORAGE_KEY, step.toString());
        }

        function getStepProgress() {
            const step = localStorage.getItem(STEP_STORAGE_KEY) || sessionStorage.getItem(STEP_STORAGE_KEY) || '0';
            return parseInt(step);
        }

        function updateStepIndicator(currentStep, totalSteps = 4) {
            stepIndicator.style.display = 'block';
            if (currentStep >= totalSteps) {
                stepIndicator.className = 'success-message';
                stepIndicator.textContent = '✅ All Steps Completed! Ready to generate key';
            } else {
                stepIndicator.className = 'step-indicator';
                stepIndicator.textContent = `Progress: Step ${currentStep}/${totalSteps} Completed`;
            }
        }

        // Get current page info
        const currentPath = window.location.pathname;
        const currentHash = window.location.hash.replace('#', '');
        const urlParams = new URLSearchParams(window.location.search);

        // Initialize page based on current path or hash
        initializePage();

        function initializePage() {
            const route = currentHash || currentPath.replace('/', '') || 'home';
            console.log('Initializing page, route:', route);
            
            if (route === 'home' || route === '' || currentPath === '/') {
                initializeHomePage();
            } else if (route === 'step1' || currentPath === '/step1') {
                initializeStep1Page();
            } else if (route === 'step2' || currentPath === '/step2') {
                initializeStep2Page();
            } else if (route === 'step3' || currentPath === '/step3') {
                initializeStep3Page();
            } else if (route === 'get-your-key' || currentPath === '/get-your-key') {
                initializeGetYourKeyPage();
            } else if (route === 'generate-key-secure-xyz' || currentPath === '/generate-key-secure-xyz') {
                initializeGeneratePage();
            } else {
                initializeHomePage();
            }
        }

        function initializeHomePage() {
            console.log('Initializing Home Page');
            const currentStep = getStepProgress();
            
            if (currentStep > 0) {
                updateStepIndicator(currentStep);
            }
            
            btnContinue.textContent = 'Start Step 1/3';
            output.textContent = 'Complete verification steps to get your API key\n\nClick the button below to start Step 1 (no token required).';
            
            btnContinue.addEventListener('click', () => {
                console.log('Home button clicked');
                btnContinue.textContent = 'Loading...';
                btnContinue.disabled = true;
                
                setTimeout(() => {
                    if (currentPath === '/') {
                        window.location.href = `/step1`;
                    } else {
                        window.location.href = `#step1`;
                    }
                }, 1000);
            });
        }

        function initializeStep1Page() {
            console.log('Initializing Step 1 Page - NO TOKEN REQUIRED');
            const currentStep = getStepProgress();
            updateStepIndicator(Math.max(currentStep, 0));
            
            // Check if returning from Vertise
            if (urlParams.get('completed') === '1') {
                saveStepProgress(1);
                updateStepIndicator(1);
                output.textContent = 'Step 1 completed successfully! ✅\n\nRedirecting to Step 2...';
                btnContinue.style.display = 'none';
                
                setTimeout(() => {
                    if (currentPath.includes('/step1')) {
                        window.location.href = `/step2`;
                    } else {
                        window.location.href = `#step2`;
                    }
                }, 2000);
                return;
            }
            
            btnContinue.textContent = 'Step 1/3 - Complete Verification';
            output.textContent = 'Step 1 of 3: First Verification\n\nNo token required for this step.\n\nClick the button below to complete the first verification step.';
            
            btnContinue.addEventListener('click', () => {
                output.textContent = 'Step 1 starting... You will be redirected to complete verification.\n\nAfter completing the task, you will return to step 2.';
                btnContinue.textContent = 'Redirecting...';
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step1?completed=1`;
                
                setTimeout(() => {
                    window.location.href = `https://link-hub.net/1385845/vx4xk8JD7x7z?return=${encodeURIComponent(returnUrl)}`;
                }, 2000);
            });
        }

        function initializeStep2Page() {
            console.log('Initializing Step 2 Page - TOKEN REQUIRED');
            
            // Check if returning from Vertise
            if (urlParams.get('completed') === '2') {
                // Generate token for step 2 completion
                const token = generateToken();
                saveToken(token);
                saveStepProgress(2);
                
                console.log('Step 2 completed - Token generated:', {
                    token: token,
                    saved_localStorage: localStorage.getItem(TOKEN_STORAGE_KEY),
                    saved_sessionStorage: sessionStorage.getItem(TOKEN_STORAGE_KEY),
                    step_saved: localStorage.getItem(STEP_STORAGE_KEY)
                });
                
                updateStepIndicator(2);
                output.textContent = `Step 2 completed successfully! ✅\n\nStep 1: ✅ Completed\nStep 2: ✅ Completed\n\n🎉 TOKEN GENERATED: ${token}\n\nThis token will be used for key generation.\nSave this token if needed!\n\nRedirecting to Step 3...`;
                btnContinue.style.display = 'none';
                
                setTimeout(() => {
                    if (currentPath.includes('/step2')) {
                        window.location.href = `/step3`;
                    } else {
                        window.location.href = `#step3`;
                    }
                }, 4000); // Longer delay to show token
                return;
            }
            
            const currentStep = getStepProgress();
            updateStepIndicator(Math.max(currentStep, 1));
            
            btnContinue.textContent = 'Step 2/3 - Complete Verification';
            output.textContent = 'Step 2 of 3: Token Generation Step\n\nStep 1: ✅ Completed\n\nThis step will generate your verification token.\nClick the button below to complete the second verification step.';
            
            btnContinue.addEventListener('click', () => {
                output.textContent = 'Step 2 starting... You will be redirected to complete verification.\n\nAfter completing this step, you will receive a token and proceed to step 3.';
                btnContinue.textContent = 'Redirecting...';
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step2?completed=2`;
                
                setTimeout(() => {
                    window.location.href = `https://direct-link.net/1385845/z8W0KStN0g82?return=${encodeURIComponent(returnUrl)}`;
                }, 2000);
            });
        }

        function initializeStep3Page() {
            console.log('Initializing Step 3 Page - NO TOKEN REQUIRED');
            
            // Check if returning from Vertise
            if (urlParams.get('completed') === '3') {
                saveStepProgress(3);
                updateStepIndicator(3);
                output.textContent = 'Step 3 completed successfully! ✅\n\nStep 1: ✅ Completed\nStep 2: ✅ Completed (Token Generated)\nStep 3: ✅ Completed\n\nRedirecting to token validation page...';
                btnContinue.style.display = 'none';
                
                setTimeout(() => {
                    if (currentPath.includes('/step3')) {
                        window.location.href = `/get-your-key`;
                    } else {
                        window.location.href = `#get-your-key`;
                    }
                }, 2000);
                return;
            }
            
            const currentStep = getStepProgress();
            updateStepIndicator(Math.max(currentStep, 2));
            
            btnContinue.textContent = 'Step 3/3 - Final Verification';
            output.textContent = 'Step 3 of 3: Final Verification\n\nStep 1: ✅ Completed\nStep 2: ✅ Completed (Token Generated)\n\nNo additional token required for this step.\nClick the button below to complete the final verification step.';
            
            btnContinue.addEventListener('click', () => {
                output.textContent = 'Step 3 starting... You will be redirected to complete verification.\n\nAfter completing this step, you will proceed to token validation.';
                btnContinue.textContent = 'Redirecting...';
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step3?completed=3`;
                
                setTimeout(() => {
                    window.location.href = `https://link-center.net/1385845/tgUMK8TgIBn1?return=${encodeURIComponent(returnUrl)}`;
                }, 2000);
            });
        }

        function initializeGetYourKeyPage() {
            console.log('Initializing Get Your Key Page - TOKEN VALIDATION');
            
            const token = getToken();
            const currentStep = getStepProgress();
            
            console.log('Get Your Key validation:', {
                token: token,
                currentStep: currentStep,
                hasToken: !!token,
                stepComplete: currentStep >= 3,
                localStorage_token: localStorage.getItem(TOKEN_STORAGE_KEY),
                sessionStorage_token: sessionStorage.getItem(TOKEN_STORAGE_KEY),
                localStorage_step: localStorage.getItem(STEP_STORAGE_KEY),
                sessionStorage_step: sessionStorage.getItem(STEP_STORAGE_KEY)
            });
            
            if (!token || currentStep < 3) {
                stepIndicator.style.display = 'block';
                stepIndicator.className = 'error-message';
                stepIndicator.textContent = '❌ Invalid Access';
                
                btnContinue.textContent = 'Start Over';
                output.textContent = `Get Your Key\n\n❌ INVALID ACCESS\n\nDebug Information:\nToken: ${token || 'NONE'}\nCurrent Step: ${currentStep}/3\nToken Required: YES (from Step 2/3)\nSteps Required: 3/3 completed\n\nMissing:\n${!token ? '- Token from Step 2/3\n' : ''}${currentStep < 3 ? '- Complete all 3 steps\n' : ''}\nClick "Start Over" to begin verification.`;
                
                btnContinue.addEventListener('click', () => {
                    clearToken();
                    if (currentPath.includes('/get-your-key')) {
                        window.location.href = '/';
                    } else {
                        window.location.href = '#home';
                    }
                });
                return;
            }
            
            // Valid token and completed steps
            updateStepIndicator(4, 4);
            btnContinue.textContent = 'Generate Your API Key';
            btnContinue.style.background = '#28a745';
            
            output.textContent = `Get Your Key\n\n✅ VALID ACCESS CONFIRMED\n\nToken: ${token}\nSteps Completed: ${currentStep}/3\nAll Requirements: ✅ MET\n\nYou can now generate your API key!\n\nClick the button below to proceed to key generation.`;
            
            btnContinue.addEventListener('click', () => {
                btnContinue.textContent = 'Loading...';
                btnContinue.disabled = true;
                
                setTimeout(() => {
                    if (currentPath.includes('/get-your-key')) {
                        window.location.href = `/generate-key-secure-xyz?token=${token}`;
                    } else {
                        window.location.href = `#generate-key-secure-xyz?token=${token}`;
                    }
                }, 1000);
            });
        }

        function initializeGeneratePage() {
            console.log('Initializing Generate Key Page');
            
            const token = getToken();
            const currentStep = getStepProgress();
            
            console.log('Generate page validation:', {
                token: token,
                currentStep: currentStep,
                hasToken: !!token,
                stepComplete: currentStep >= 3
            });
            
            // SIMPLIFIED VALIDATION - only check if token exists and step >= 3
            if (!token || currentStep < 3) {
                stepIndicator.style.display = 'block';
                stepIndicator.className = 'error-message';
                stepIndicator.textContent = '❌ Access Denied';
                
                output.textContent = 'Error: Invalid access to generate key page.\n\nMissing requirements:\n' + 
                    (!token ? '- No token found (complete Step 2/3)\n' : '') +
                    (currentStep < 3 ? '- Steps incomplete (complete all 3 steps)\n' : '') +
                    '\nPlease complete all verification steps first.';
                btnContinue.textContent = 'Start Over';
                btnContinue.addEventListener('click', () => {
                    clearToken();
                    window.location.href = '/';
                });
                return;
            }
            
            // Show final step indicator
            updateStepIndicator(4, 4);
            
            // Show timer
            timerDiv.style.display = 'block';
            timeRemaining = 15 * 60; // 15 minutes
            startTimer();
            
            btnContinue.textContent = 'Generate Key';
            btnContinue.id = 'btnGen';
            output.textContent = `Ready to generate your API key! 🎉\n\nToken: ${token}\nAll verification steps completed!\n\nClick "Generate Key" below to get your API key.\n\nNote: This page will expire in 15 minutes for security.`;
            
            // Check for existing key first
            checkExistingKey();
            
            btnContinue.addEventListener('click', async () => {
                await generateKey();
            });
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                timeLeftSpan.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    output.textContent = 'Generate key access has expired. Please complete verification steps again.';
                    btnContinue.style.display = 'none';
                    timerDiv.textContent = 'EXPIRED - Please start over';
                    
                    setTimeout(() => {
                        clearToken();
                        window.location.href = '/';
                    }, 3000);
                }
            }, 1000);
        }

        async function checkExistingKey() {
            try {
                const token = getToken();
                const existingKey = localStorage.getItem(`generated_key_${token}`);
                if (existingKey) {
                    const keyData = JSON.parse(existingKey);
                    const expiry = new Date(keyData.expires);
                    
                    if (expiry > new Date()) {
                        currentKey = keyData.key;
                        output.textContent = `Key: ${keyData.key}\n\nExpires: ${expiry.toLocaleString()}\n\nValid for 24 hours from generation.\n\nExisting key loaded (anti-refresh protection)`;
                        btnCopy.style.display = 'block';
                        btnContinue.style.display = 'none';
                        
                        if (timerInterval) {
                            clearInterval(timerInterval);
                            timerDiv.style.display = 'none';
                        }
                        return;
                    }
                }
            } catch (error) {
                console.log('No existing key found');
            }
        }

        async function generateKey() {
            const btnGen = document.getElementById('btnGen');
            btnGen.disabled = true;
            btnGen.textContent = 'Generating...';
            btnGen.classList.add('loading');
            
            try {
                const token = getToken();
                const currentStep = getStepProgress();
                
                console.log('Generate key validation:', {
                    token: token,
                    currentStep: currentStep,
                    hasToken: !!token,
                    stepComplete: currentStep >= 3
                });
                
                // SIMPLIFIED VALIDATION - only check basic requirements
                if (!token) {
                    throw new Error('No token found. Please complete Step 2/3 to generate token.');
                }
                
                if (currentStep < 3) {
                    throw new Error('Incomplete verification. Please complete all 3 steps.');
                }
                
                // Generate API key
                const randomKey = 'sk-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                const expires = new Date(Date.now() + 24 * 60 * 60 * 1000);
                
                const keyData = {
                    key: randomKey,
                    expires: expires.toISOString(),
                    generated: new Date().toISOString(),
                    generatedWith: token
                };
                
                localStorage.setItem(`generated_key_${token}`, JSON.stringify(keyData));
                
                currentKey = keyData.key;
                
                output.textContent = `Key: ${keyData.key}\n\nExpires: ${expires.toLocaleString()}\n\nValid for 24 hours from generation.\n\nKey generated successfully! 🎉\n\nGenerated with token: ${token}`;
                btnCopy.style.display = 'block';
                btnGen.style.display = 'none';
                
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerDiv.style.display = 'none';
                }
                
                console.log('Key generated successfully:', keyData);
                
            } catch (error) {
                console.error('Error generating key:', error);
                output.textContent = `Error: ${error.message}\n\nDebug Info:\nToken: ${getToken() || 'NONE'}\nStep: ${getStepProgress()}\n\nPlease complete all verification steps properly.`;
                
                // Don't auto-redirect, let user see the error
                setTimeout(() => {
                    btnGen.textContent = 'Try Again';
                    btnGen.disabled = false;
                    btnGen.classList.remove('loading');
                }, 2000);
            }
        }

        btnCopy.addEventListener('click', async () => {
            if (currentKey) {
                try {
                    await navigator.clipboard.writeText(currentKey);
                    btnCopy.textContent = 'Copied!';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                    }, 2000);
                } catch (error) {
                    const textArea = document.createElement('textarea');
                    textArea.value = currentKey;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    btnCopy.textContent = 'Copied!';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                    }, 2000);
                }
            }
        });

        // Debug logging - Enhanced
        console.log('=== PAGE LOADED DEBUG INFO ===');
        console.log('Current Details:', {
            path: currentPath,
            hash: currentHash,
            urlParams: Object.fromEntries(urlParams.entries()),
            token: getToken(),
            currentStep: getStepProgress(),
            localStorage_token: localStorage.getItem(TOKEN_STORAGE_KEY),
            sessionStorage_token: sessionStorage.getItem(TOKEN_STORAGE_KEY),
            localStorage_step: localStorage.getItem(STEP_STORAGE_KEY),
            sessionStorage_step: sessionStorage.getItem(STEP_STORAGE_KEY)
        });
        console.log('=== END DEBUG INFO ===');
    </script>
</body>
</html>

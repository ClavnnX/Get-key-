<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClavnnX Key System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f23, #1a1a3e, #0f0f23);
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 150, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 150, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 60%, rgba(0, 150, 255, 0.05) 0%, transparent 50%);
            z-index: -1;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 30, 45, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            position: relative;
            overflow: hidden;
        }

        .main-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 150, 255, 0.5), transparent);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #0096ff, #00d4ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .progress-section {
            margin-bottom: 30px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-label {
            color: #d1d5db;
            font-size: 14px;
            font-weight: 500;
        }

        .progress-step {
            color: #6b7280;
            font-size: 14px;
            font-weight: 600;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(55, 65, 81, 0.6);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #0096ff, #00d4ff);
            border-radius: 4px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .step-indicator {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            padding: 16px 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .url-section {
            margin-bottom: 24px;
        }

        .url-label {
            color: #9ca3af;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .url-input {
            width: 100%;
            background: rgba(55, 65, 81, 0.5);
            border: 1px solid rgba(75, 85, 99, 0.6);
            border-radius: 12px;
            padding: 14px 16px;
            color: #e5e7eb;
            font-size: 15px;
            font-weight: 400;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', monospace;
        }

        .url-input:focus {
            border-color: #0096ff;
            background: rgba(55, 65, 81, 0.8);
            box-shadow: 0 0 0 3px rgba(0, 150, 255, 0.1);
        }

        .main-button {
            width: 100%;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            margin-bottom: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        .main-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .main-button:hover::before {
            transform: translateX(100%);
        }

        #btnContinue, #btnGen {
            background: linear-gradient(135deg, #0096ff, #00d4ff);
            color: white;
            box-shadow: 0 8px 25px rgba(0, 150, 255, 0.3);
        }

        #btnContinue:hover, #btnGen:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0, 150, 255, 0.4);
        }

        #btnContinue:active, #btnGen:active {
            transform: translateY(0);
            box-shadow: 0 4px 15px rgba(0, 150, 255, 0.3);
        }

        #btnTakeKey {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
            display: none;
        }

        #btnTakeKey:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(16, 185, 129, 0.4);
        }

        #btnCopy {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
            display: none;
        }

        #btnCopy:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(16, 185, 129, 0.4);
        }

        .output-section {
            margin-bottom: 20px;
        }

        #out {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(75, 85, 99, 0.4);
            border-radius: 16px;
            padding: 24px;
            min-height: 120px;
            font-family: 'Inter', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            color: #e5e7eb;
            position: relative;
            backdrop-filter: blur(10px);
        }

        #out::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 150, 255, 0.3), transparent);
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
            position: relative;
        }

        .loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            margin: -12px 0 0 -12px;
            border: 2px solid rgba(0, 150, 255, 0.3);
            border-radius: 50%;
            border-top-color: #0096ff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-message {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            padding: 16px 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 16px;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.2);
        }

        .error-message {
            background: linear-gradient(135deg, #ef4444, #f87171);
            color: white;
            padding: 16px 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 16px;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.2);
        }

        .urls-section {
            margin-top: 30px;
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(75, 85, 99, 0.3);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        .urls-title {
            color: #0096ff;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }

        .url-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(75, 85, 99, 0.2);
        }

        .url-item:last-child {
            border-bottom: none;
        }

        .url-step-label {
            color: #9ca3af;
            font-size: 14px;
            font-weight: 500;
        }

        .url-step-value {
            background: rgba(55, 65, 81, 0.8);
            color: #0096ff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }

        .icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
        }

        .timer-display {
            background: linear-gradient(135deg, #f59e0b, #f97316);
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 16px;
            font-weight: 600;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
            display: none;
        }

        .expired-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .expired-content {
            background: linear-gradient(135deg, #ef4444, #f87171);
            color: white;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(239, 68, 68, 0.5);
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
            
            .main-container {
                padding: 30px 24px;
                border-radius: 20px;
            }

            .logo {
                font-size: 28px;
            }

            .subtitle {
                font-size: 14px;
            }

            .main-button {
                padding: 14px 20px;
                font-size: 15px;
            }

            #out {
                padding: 20px;
                min-height: 100px;
                font-size: 13px;
            }

            .urls-section {
                padding: 20px;
            }
        }

        /* Pulse animation for active elements */
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: .8;
            }
        }

        /* Glow effect for important elements */
        .glow {
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header Section -->
        <div class="header">
            <div class="logo">ClavnnX Key System</div>
            <div class="subtitle">Secure Multi-Step Verification System</div>
        </div>

        <!-- Timer Display -->
        <div class="timer-display" id="timerDisplay">⏰ Time remaining: 08:00</div>

        <!-- Progress Section -->
        <div class="progress-section">
            <div class="progress-header">
                <span class="progress-label">Progress</span>
                <span class="progress-step" id="progressStep">Step 0/2</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 0%"></div>
            </div>
        </div>

        <!-- Step Indicator -->
        <div class="step-indicator" id="stepIndicator" style="display: none;"></div>

        <!-- URL Section -->
        <div class="url-section">
            <div class="url-label">
                <span class="icon">🔗</span>
                Current URL:
            </div>
            <input type="text" class="url-input" id="currentUrl" value="/" readonly>
        </div>

        <!-- Main Action Button -->
        <button id="btnContinue" class="main-button">Complete the step</button>

        <!-- Output Section -->
        <div class="output-section">
            <div id="out">Complete verification steps to get your API key</div>
        </div>

        <!-- Additional Buttons -->
        <button id="btnTakeKey" class="main-button" style="display: none;">Take the key</button>
        <button id="btnCopy" class="main-button" style="display: none;">Copy Key</button>

        <!-- URLs Information -->
        <div class="urls-section">
            <div class="urls-title">
                <span class="icon">⚙️</span>
                URLs for Vertise Integration:
            </div>
            <div class="url-item">
                <span class="url-step-label">Step 1:</span>
                <span class="url-step-value">/step1</span>
            </div>
            <div class="url-item">
                <span class="url-step-label">Step 2:</span>
                <span class="url-step-value">/step2</span>
            </div>
        </div>
    </div>

    <script>
        // Cache DOM elements for better performance
        const btnContinue = document.getElementById('btnContinue');
        const btnTakeKey = document.getElementById('btnTakeKey');
        const btnCopy = document.getElementById('btnCopy');
        const output = document.getElementById('out');
        const stepIndicator = document.getElementById('stepIndicator');
        const progressBar = document.getElementById('progressBar');
        const progressStep = document.getElementById('progressStep');
        const currentUrl = document.getElementById('currentUrl');
        const timerDisplay = document.getElementById('timerDisplay');
        let currentKey = '';
        let pageTimer = null;
        let remainingTime = 8 * 60; // 8 minutes in seconds

        // Storage keys
        const TOKEN_KEY = 'clavnnx_token_step1';
        const STEP_KEY = 'clavnnx_current_step';
        const PAGE_ACCESS_KEY = 'clavnnx_page_access_time';
        const GENERATED_KEY_TIMESTAMP = 'clavnnx_key_generated_time';

        // Enhanced storage operations with validation
        const storage = {
            set: (key, value) => {
                try {
                    const data = JSON.stringify(value);
                    // Store in variables instead of localStorage/sessionStorage
                    window[`storage_${key}`] = data;
                } catch (e) {
                    console.warn('Storage failed:', e);
                }
            },
            get: (key) => {
                try {
                    const data = window[`storage_${key}`];
                    return data ? JSON.parse(data) : null;
                } catch (e) {
                    return null;
                }
            },
            remove: (key) => {
                delete window[`storage_${key}`];
            }
        };

        // Enhanced token management with time validation
        function saveToken(token) {
            if (token) {
                const tokenData = {
                    token: token,
                    created: Date.now(),
                    expires: Date.now() + (8 * 60 * 1000), // 8 minutes
                    step1Complete: Date.now()
                };
                storage.set(TOKEN_KEY, tokenData);
            }
        }

        function getToken() {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get('token');
            
            if (tokenFromUrl) {
                // Validate token freshness from URL
                const tokenData = storage.get(TOKEN_KEY);
                if (tokenData && tokenData.token === tokenFromUrl && Date.now() < tokenData.expires) {
                    return tokenFromUrl;
                }
                return null; // Token expired or invalid
            }
            
            const tokenData = storage.get(TOKEN_KEY);
            if (tokenData && Date.now() < tokenData.expires) {
                return tokenData.token;
            }
            
            clearToken();
            return null;
        }

        function clearToken() {
            storage.remove(TOKEN_KEY);
            storage.remove(STEP_KEY);
            storage.remove(PAGE_ACCESS_KEY);
            storage.remove(GENERATED_KEY_TIMESTAMP);
        }

        function generateToken() {
            return `token_${Date.now()}_${Math.random().toString(36).substring(2, 15)}`;
        }

        // Enhanced step management with time validation
        function saveStepProgress(step) {
            const stepData = {
                step: step,
                timestamp: Date.now(),
                expires: Date.now() + (8 * 60 * 1000)
            };
            storage.set(STEP_KEY, stepData);
        }

        function getStepProgress() {
            const stepData = storage.get(STEP_KEY);
            if (stepData && Date.now() < stepData.expires) {
                return Math.max(0, Math.min(2, parseInt(stepData.step)));
            }
            return 0;
        }

        // Page access control
        function setPageAccessTime() {
            storage.set(PAGE_ACCESS_KEY, Date.now());
        }

        function validatePageAccess() {
            const accessTime = storage.get(PAGE_ACCESS_KEY);
            if (!accessTime) return false;
            
            const timeElapsed = Date.now() - accessTime;
            return timeElapsed <= (8 * 60 * 1000); // 8 minutes
        }

        // Timer functions
        function startPageTimer() {
            const accessTime = storage.get(PAGE_ACCESS_KEY);
            if (accessTime) {
                const timeElapsed = Math.floor((Date.now() - accessTime) / 1000);
                remainingTime = (8 * 60) - timeElapsed;
                
                if (remainingTime <= 0) {
                    showExpiredPage();
                    return;
                }
            } else {
                setPageAccessTime();
                remainingTime = 8 * 60;
            }

            timerDisplay.style.display = 'block';
            updateTimerDisplay();
            
            pageTimer = setInterval(() => {
                remainingTime--;
                updateTimerDisplay();
                
                if (remainingTime <= 0) {
                    clearInterval(pageTimer);
                    showExpiredPage();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(remainingTime / 60);
            const seconds = remainingTime % 60;
            const timeString = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            timerDisplay.textContent = `⏰ Time remaining: ${timeString}`;
            
            if (remainingTime <= 60) {
                timerDisplay.style.background = 'linear-gradient(135deg, #ef4444, #f87171)';
                timerDisplay.classList.add('pulse');
            }
        }

        function showExpiredPage() {
            clearToken();
            
            const overlay = document.createElement('div');
            overlay.className = 'expired-overlay';
            overlay.innerHTML = `
                <div class="expired-content">
                    <h2 style="font-size: 24px; margin-bottom: 16px;">⏰ Session Expired</h2>
                    <p style="margin-bottom: 24px;">Your session has expired after 8 minutes. Please start the verification process again.</p>
                    <button onclick="window.location.href='/'" style="padding: 12px 24px; background: white; color: #ef4444; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Start Over</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function updateProgress(currentStep, totalSteps = 2) {
            const percentage = (currentStep / totalSteps) * 100;
            progressBar.style.width = percentage + '%';
            progressStep.textContent = `Step ${currentStep}/${totalSteps}`;
        }

        function updateStepIndicator(currentStep, totalSteps = 2) {
            stepIndicator.style.display = 'block';
            if (currentStep >= totalSteps) {
                stepIndicator.className = 'success-message pulse';
                stepIndicator.textContent = '✅ All Steps Completed! Ready to generate key';
            } else {
                stepIndicator.className = 'step-indicator pulse';
                stepIndicator.textContent = `Step ${currentStep}/${totalSteps} Completed`;
            }
        }

        // Page routing with enhanced security
        const route = window.location.hash.replace('#', '') || window.location.pathname.replace('/', '') || 'home';
        const urlParams = new URLSearchParams(window.location.search);

        // Update current URL display
        function updateCurrentUrl() {
            currentUrl.value = window.location.pathname + window.location.search + window.location.hash;
        }

        // Initialize based on route with security checks
        function init() {
            updateCurrentUrl();
            
            switch(route) {
                case 'step1':
                    initStep1();
                    break;
                case 'step2':  
                    initStep2();
                    break;
                case 'get-your-key':
                    initGetKey();
                    break;
                case 'generate-key-secure-xyz':
                    initGenerate();
                    break;
                default:
                    initHome();
            }
        }

        function initHome() {
            const currentStep = getStepProgress();
            updateProgress(currentStep);
            if (currentStep > 0) updateStepIndicator(currentStep);
            
            btnContinue.textContent = '🚀 Start Step 1/2';
            
            btnContinue.onclick = () => {
                btnContinue.textContent = 'Redirecting...';
                btnContinue.classList.add('loading');
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step1?completed=1`;
                window.location.href = `https://direct-link.net/1385845/QhuxogBGSmxB?return=${encodeURIComponent(returnUrl)}`;
            };
        }

        function initStep1() {
            if (urlParams.get('completed') === '1') {
                const token = generateToken();
                saveToken(token);
                saveStepProgress(1);
                setPageAccessTime();
                
                updateProgress(1);
                updateStepIndicator(1);
                output.textContent = '✅ Step 1/2 completed successfully!\n\n🔄 Redirecting to Step 2/2...';
                btnContinue.style.display = 'none';
                
                setTimeout(() => {
                    window.location.href = window.location.pathname.includes('/step1') ? '/step2' : '#step2';
                }, 1500);
                return;
            }
            
            updateProgress(Math.max(getStepProgress(), 0));
            updateStepIndicator(Math.max(getStepProgress(), 0));
            btnContinue.textContent = '🔑 Step 1/2 - Generate Token';
            output.textContent = '📋 Step 1 of 2: Token Generation Step\n\n🎯 Click the button below to complete Step 1/2.';
            
            btnContinue.onclick = () => {
                btnContinue.textContent = 'Redirecting...';
                btnContinue.classList.add('loading');
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step1?completed=1`;
                window.location.href = `https://direct-link.net/1385845/QhuxogBGSmxB?return=${encodeURIComponent(returnUrl)}`;
            };
        }

        function initStep2() {
            if (!validatePageAccess()) {
                showError('Access expired. Please start over.');
                return;
            }

            if (urlParams.get('completed') === '2') {
                const token = getToken();
                if (!token) {
                    showError('Token expired. Please start over.');
                    return;
                }
                
                saveStepProgress(2);
                updateProgress(2);
                updateStepIndicator(2);
                output.textContent = '✅ Step 2/2 completed successfully!\n\n🎉 Redirecting to key generation...';
                btnContinue.style.display = 'none';
                
                setTimeout(() => {
                    window.location.href = window.location.pathname.includes('/step2') ? '/get-your-key' : '#get-your-key';
                }, 1500);
                return;
            }
            
            const token = getToken();
            if (!token) {
                showError('No token found or token expired. Complete Step 1/2 first.');
                return;
            }
            
            updateProgress(Math.max(getStepProgress(), 1));
            updateStepIndicator(Math.max(getStepProgress(), 1));
            btnContinue.textContent = '🛡️ Step 2/2 - Final Verification';
            output.textContent = '📋 Step 2 of 2: Final Verification\n\n✅ Step 1/2: Completed\n\n🎯 Click below to complete final verification.';
            
           btnContinue.onclick = () => {
                btnContinue.textContent = 'Redirecting...';
                btnContinue.classList.add('loading');
                btnContinue.disabled = true;
                
                const returnUrl = `${window.location.origin}/step2?completed=2`;
                window.location.href = `https://link-target.net/1385845/05NfA4wGJcIe?return=${encodeURIComponent(returnUrl)}`;
            };
        }

        function initGetKey() {
            if (!validatePageAccess()) {
                showError('Access expired. Please start over.');
                return;
            }

            const token = getToken();
            const currentStep = getStepProgress();
            
            if (!token || currentStep < 2) {
                showError('Invalid access. Complete all steps first.');
                return;
            }
            
            updateProgress(2, 2);
            updateStepIndicator(2, 2);
            btnContinue.textContent = '🎉 Generate Your API Key';
            btnContinue.classList.add('glow');
            output.textContent = '🔓 Get Your Key\n\n✅ VALID ACCESS CONFIRMED\n\n🎯 You can now generate your API key!';
            
            btnContinue.onclick = () => {
                btnContinue.textContent = 'Loading...';
                btnContinue.classList.add('loading');
                btnContinue.disabled = true;
                
                setTimeout(() => {
                    window.location.href = window.location.pathname.includes('/get-your-key') 
                        ? `/generate-key-secure-xyz?token=${token}` 
                        : `#generate-key-secure-xyz?token=${token}`;
                }, 800);
            };
        }

        function initGenerate() {
            // Enhanced security validation
            const token = getToken();
            const currentStep = getStepProgress();
            const tokenData = storage.get(TOKEN_KEY);
            
            if (!token || currentStep < 2 || !tokenData) {
                showError('Access denied. Complete verification first.');
                return;
            }

            // Validate token freshness and prevent manipulation
            if (!validatePageAccess() || Date.now() > tokenData.expires) {
                showError('Session expired. Please start over.');
                return;
            }

            // Check if user is trying to refresh or access page multiple times
            const generatedTime = storage.get(GENERATED_KEY_TIMESTAMP);
            if (generatedTime) {
                const timeSinceGeneration = Date.now() - generatedTime;
                if (timeSinceGeneration < 30000) { // 30 seconds cooldown
                    showError('Please wait before generating another key.');
                    return;
                }
            }
            
            // Start 8-minute timer for this page
            startPageTimer();
            
            updateProgress(2, 2);
            updateStepIndicator(2, 2);
            btnContinue.textContent = '✨ Auto-Generate Key';
            btnContinue.id = 'btnGen';
            btnContinue.classList.add('glow');
            output.textContent = '🎉 Ready to generate your API key!\n\n⏰ Auto-generation will start in 3 seconds...\n\n🚀 Or click "Generate Key" to proceed immediately.';
            
            // Auto-generate key after 3 seconds
            setTimeout(() => {
                if (remainingTime > 0) { // Only if page hasn't expired
                    generateKey();
                }
            }, 3000);
            
            btnContinue.onclick = () => {
                if (remainingTime > 0) {
                    generateKey();
                }
            };
        }

        function showError(message) {
            if (pageTimer) {
                clearInterval(pageTimer);
            }
            timerDisplay.style.display = 'none';
            
            stepIndicator.style.display = 'block';
            stepIndicator.className = 'error-message pulse';
            stepIndicator.textContent = '❌ Error';
            
            output.textContent = `⚠️ Error: ${message}\n\n🔄 Click "Start Over" to begin verification.`;
            btnContinue.textContent = '🔄 Start Over';
            btnContinue.className = 'main-button';
            btnContinue.onclick = () => {
                clearToken();
                window.location.href = '/';
            };
        }

        async function checkExistingKey() {
            const token = getToken();
            if (!token) return;
            
            const existingKey = storage.get(`generated_key_${token}`);
            if (existingKey && new Date(existingKey.expires) > new Date()) {
                // Check if key was generated within valid timeframe
                const keyData = storage.get(GENERATED_KEY_TIMESTAMP);
                if (keyData && (Date.now() - keyData) <= (24 * 60 * 60 * 1000)) {
                    currentKey = existingKey.key;
                    output.textContent = `🔑 Key: ${existingKey.key}\n\n⏰ Expires: ${new Date(existingKey.expires).toLocaleString()}\n\n✅ Valid for 24 hours.`;
                    btnCopy.style.display = 'block';
                    btnContinue.style.display = 'none';
                }
            }
        }

        async function generateKey() {
            const btnGen = document.getElementById('btnGen');
            if (!btnGen) return;
            
            // Prevent multiple generations
            const generatedTime = storage.get(GENERATED_KEY_TIMESTAMP);
            if (generatedTime && (Date.now() - generatedTime) < 30000) {
                output.textContent = '⚠️ Please wait 30 seconds before generating another key.';
                return;
            }
            
            btnGen.disabled = true;
            btnGen.textContent = '⚡ Generating...';
            btnGen.classList.add('loading');
            
            try {
                const token = getToken();
                const currentStep = getStepProgress();
                const tokenData = storage.get(TOKEN_KEY);
                
                // Enhanced validation
                if (!token || currentStep < 2 || !tokenData) {
                    throw new Error('Invalid access. Please complete all verification steps.');
                }

                if (!validatePageAccess() || Date.now() > tokenData.expires) {
                    throw new Error('Session expired. Please start over.');
                }

                // Validate that enough time has passed since step completion
                const stepData = storage.get(STEP_KEY);
                if (!stepData || (Date.now() - stepData.timestamp) < 5000) {
                    throw new Error('Please wait a moment before generating key.');
                }
                
                // Generate secure random key
                const randomKey = 'sk-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                const expires = new Date(Date.now() + 24 * 60 * 60 * 1000);
                
                const keyData = {
                    key: randomKey,
                    expires: expires.toISOString(),
                    generated: new Date().toISOString(),
                    tokenUsed: token,
                    secure: true
                };
                
                // Store key data and generation timestamp
                storage.set(`generated_key_${token}`, keyData);
                storage.set(GENERATED_KEY_TIMESTAMP, Date.now());
                currentKey = keyData.key;
                
                output.textContent = `🔑 Key: ${keyData.key}\n\n⏰ Expires: ${expires.toLocaleString()}\n\n🎉 Key generated successfully!\n\n⚠️ This key is valid for 24 hours only.`;
                btnCopy.style.display = 'block';
                btnGen.style.display = 'none';
                
                // Clear timer as key is generated
                if (pageTimer) {
                    clearInterval(pageTimer);
                }
                timerDisplay.style.display = 'none';
                
            } catch (error) {
                output.textContent = `⚠️ Error: ${error.message}\n\n🔄 Please start over if verification expired.`;
                setTimeout(() => {
                    if (remainingTime > 0) {
                        btnGen.textContent = '🔄 Try Again';
                        btnGen.classList.remove('loading');
                        btnGen.disabled = false;
                    }
                }, 2000);
            }
        }

        // Enhanced copy functionality
        btnCopy.onclick = async () => {
            if (!currentKey) return;
            
            try {
                // Create a temporary textarea for copying (fallback method)
                const textArea = document.createElement('textarea');
                textArea.value = currentKey;
                textArea.style.position = 'fixed';
                textArea.style.left = '-999999px';
                textArea.style.top = '-999999px';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                
                const successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                
                if (successful) {
                    btnCopy.textContent = '✅ Copied!';
                    btnCopy.style.background = 'linear-gradient(135deg, #059669, #10b981)';
                } else {
                    throw new Error('Copy failed');
                }
            } catch (error) {
                // Try navigator.clipboard as fallback
                try {
                    await navigator.clipboard.writeText(currentKey);
                    btnCopy.textContent = '✅ Copied!';
                    btnCopy.style.background = 'linear-gradient(135deg, #059669, #10b981)';
                } catch (clipboardError) {
                    btnCopy.textContent = '❌ Copy Failed';
                    btnCopy.style.background = 'linear-gradient(135deg, #ef4444, #f87171)';
                }
            }
            
            setTimeout(() => {
                btnCopy.textContent = 'Copy Key';
                btnCopy.style.background = 'linear-gradient(135deg, #10b981, #34d399)';
            }, 2000);
        };

        // Enhanced page visibility handling
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // User switched tabs/minimized - don't pause timer but log the action
                console.log('Page hidden - timer continues');
            } else {
                // User returned - validate session is still valid
                if (route === 'generate-key-secure-xyz' && !validatePageAccess()) {
                    showExpiredPage();
                }
            }
        });

        // Prevent right-click and common shortcuts on generate page
        if (route === 'generate-key-secure-xyz') {
            document.addEventListener('contextmenu', (e) => e.preventDefault());
            document.addEventListener('keydown', (e) => {
                // Prevent F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
                if (e.key === 'F12' || 
                    (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) ||
                    (e.ctrlKey && e.key === 'u')) {
                    e.preventDefault();
                }
            });
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (pageTimer) {
                clearInterval(pageTimer);
            }
        });

        // Initialize page with all security checks
        init();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClavnnX Get key</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #000000 !important;
            color: #ffffff;
        }
        .container {
            background: #222222 !important;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(255,255,255,0.2);
            border: 2px solid #444444;
        }
        h1 {
            text-align: center;
            color: #ffffff !important;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #btnContinue, #btnGen {
            background: #007bff;
            color: white;
        }
        #btnContinue:hover, #btnGen:hover {
            background: #0056b3;
        }
        #btnContinue:disabled, #btnGen:disabled {
            background: #555555;
            cursor: not-allowed;
        }
        #btnCopy {
            background: #28a745;
            color: white;
            display: none;
        }
        #btnCopy:hover {
            background: #1e7e34;
        }
        #out {
            background: #2d2d2d;
            border: 1px solid #444444;
            border-radius: 8px;
            padding: 20px;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        .step-info {
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #cccccc;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ClavnnX Get key</h1>
        <div class="step-info" id="stepInfo">
            Loading verification system...
        </div>
        <button id="btnContinue">Complete the step</button>
        <div id="out">Click "Complete the step" to proceed through verification steps</div>
        <button id="btnCopy" style="display: none;">Copy Key</button>
    </div>

    <script>
        const btnContinue = document.getElementById('btnContinue');
        const btnCopy = document.getElementById('btnCopy');
        const output = document.getElementById('out');
        const stepInfo = document.getElementById('stepInfo');
        let currentKey = '';

        // Check if we're on verify page (has token parameter)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const currentStep = urlParams.get('currentstep');
        
        if (token) {
            // We're on verify page, verify the token
            verifyToken(token, currentStep);
        } else {
            // We're on start page, show initial step
            btnContinue.textContent = 'Complete the step';
            stepInfo.textContent = 'Step 0/3: Initialize verification process';
            output.textContent = 'Click "Complete the step" to start the 3-step verification process';
            
            btnContinue.addEventListener('click', () => {
                // Start verification process
                window.location.href = '/verify';
            });
        }

        async function verifyToken(token, currentStepFromURL) {
            try {
                const response = await fetch(`/verify?token=${token}`);
                const data = await response.json();
                
                if (response.ok && data.valid) {
                    const currentStep = data.step;
                    
                    // Update URL to show current step
                    const newURL = `${window.location.origin}/?token=${token}&step=${currentStep}`;
                    window.history.replaceState({}, '', newURL);
                    
                    if (currentStep === 0) {
                        // User belum complete step apapun, show step 1/3
                        btnContinue.textContent = 'Continue 1/3';
                        stepInfo.textContent = 'Step 1/3: First verification step';
                        output.textContent = 'Complete the first verification step to proceed.\n\nCopy URL dari address bar untuk setup Vertise link pertama.\n\nURL saat ini untuk Step 1:\n' + newURL.replace('step=0', 'step=1');
                        
                        btnContinue.onclick = () => {
                            // Di sini nanti akan diganti dengan link vertise
                            // window.location.href = 'YOUR_VERTISE_LINK_1';
                            
                            // Untuk testing sementara, langsung ke step berikutnya:
                            window.location.href = `/verify?token=${token}&step=1&bypass=dac4c4fd65791af6212f7b69f1a28f97259082835ee9d0eddca7f95732275509`;
                        };
                        
                    } else if (currentStep === 1) {
                        // User sudah complete step 1, show step 2/3
                        btnContinue.textContent = 'Continue 2/3';
                        stepInfo.textContent = 'Step 2/3: Second verification step';
                        output.textContent = 'Great! Step 1 completed.\n\nCopy URL dari address bar untuk setup Vertise link kedua.\n\nURL saat ini untuk Step 2:\n' + newURL.replace('step=1', 'step=2');
                        
                        btnContinue.onclick = () => {
                            // Di sini nanti akan diganti dengan link vertise
                            // window.location.href = 'YOUR_VERTISE_LINK_2';
                            
                            // Untuk testing sementara, langsung ke step berikutnya:
                            window.location.href = `/verify?token=${token}&step=2&bypass=dac4c4fd65791af6212f7b69f1a28f97259082835ee9d0eddca7f95732275509`;
                        };
                        
                    } else if (currentStep === 2) {
                        // User sudah complete step 2, show step 3/3
                        btnContinue.textContent = 'Continue 3/3';
                        stepInfo.textContent = 'Step 3/3: Final verification step';
                        output.textContent = 'Excellent! Steps 1 & 2 completed.\n\nCopy URL dari address bar untuk setup Vertise link ketiga.\n\nURL saat ini untuk Step 3:\n' + newURL.replace('step=2', 'step=3');
                        
                        btnContinue.onclick = () => {
                            // Di sini nanti akan diganti dengan link vertise
                            // window.location.href = 'YOUR_VERTISE_LINK_3';
                            
                            // Untuk testing sementara, langsung ke step berikutnya:
                            window.location.href = `/verify?token=${token}&step=3&bypass=dac4c4fd65791af6212f7b69f1a28f97259082835ee9d0eddca7f95732275509`;
                        };
                        
                    } else if (currentStep >= 3) {
                        // User sudah complete semua step, show generate key button
                        btnContinue.textContent = 'Generate Key';
                        btnContinue.id = 'btnGen';
                        stepInfo.textContent = 'All steps completed! Ready to generate key.';
                        stepInfo.style.background = '#0f4f0f';
                        stepInfo.style.borderColor = '#28a745';
                        
                        // Update URL to show step 3 (final step)
                        const finalURL = `${window.location.origin}/?token=${token}&step=3`;
                        window.history.replaceState({}, '', finalURL);
                        
                        output.textContent = '🎉 Congratulations!\n\nAll 3 verification steps completed successfully!\n\nURL untuk Generate Key:\n' + finalURL + '\n\nClick "Generate Key" to get your API key.';
                        
                        btnContinue.onclick = async () => {
                            await generateKey(token);
                        };
                    }
                } else {
                    // Token is invalid
                    btnContinue.style.display = 'none';
                    stepInfo.textContent = 'Error: Invalid verification session';
                    stepInfo.style.background = '#4f0f0f';
                    stepInfo.style.borderColor = '#dc3545';
                    output.textContent = 'Error: Invalid or expired verification token.\n\nPlease start the verification process again.';
                    
                    // Show restart button
                    setTimeout(() => {
                        btnContinue.style.display = 'block';
                        btnContinue.textContent = 'Start Again';
                        btnContinue.onclick = () => {
                            window.location.href = '/';
                        };
                    }, 3000);
                }
            } catch (error) {
                btnContinue.style.display = 'none';
                stepInfo.textContent = 'Error: Connection failed';
                stepInfo.style.background = '#4f0f0f';
                stepInfo.style.borderColor = '#dc3545';
                output.textContent = 'Error: Unable to verify token. Please check your connection and try again.';
                
                // Show retry button
                setTimeout(() => {
                    btnContinue.style.display = 'block';
                    btnContinue.textContent = 'Retry';
                    btnContinue.onclick = () => {
                        window.location.reload();
                    };
                }, 3000);
            }
        }

        async function generateKey(token) {
            const btnGen = document.getElementById('btnGen');
            btnGen.disabled = true;
            btnGen.textContent = 'Generating Key...';
            btnGen.classList.add('loading');
            
            try {
                const response = await fetch(`/getkey?token=${token}`);
                const data = await response.json();
                
                if (response.ok) {
                    currentKey = data.key;
                    const expiry = new Date(data.expires);
                    
                    stepInfo.textContent = 'Key generated successfully!';
                    stepInfo.style.background = '#0f4f0f';
                    stepInfo.style.borderColor = '#28a745';
                    
                    output.textContent = `🔑 Your API Key:\n${data.key}\n\n⏰ Expires: ${expiry.toLocaleString()}\n\n✅ Valid for 24 hours from generation\n\nKeep this key safe and do not share it!`;
                    
                    btnCopy.style.display = 'block';
                    btnGen.style.display = 'none';
                } else {
                    stepInfo.textContent = 'Key generation failed';
                    stepInfo.style.background = '#4f0f0f';
                    stepInfo.style.borderColor = '#dc3545';
                    
                    if (data.error && data.error.includes('verification steps must be completed')) {
                        output.textContent = `❌ Generation Failed!\n\nReason: Not all verification steps were completed.\n\nPlease complete all 3 verification steps before generating a key.`;
                    } else {
                        output.textContent = `❌ Generation Failed!\n\nError: ${data.error || 'Unknown error occurred'}\n\nPlease try again or contact support.`;
                    }
                    
                    btnCopy.style.display = 'none';
                }
            } catch (error) {
                stepInfo.textContent = 'Connection error during key generation';
                stepInfo.style.background = '#4f0f0f';
                stepInfo.style.borderColor = '#dc3545';
                output.textContent = `❌ Connection Error!\n\nUnable to connect to server for key generation.\n\nPlease check your internet connection and try again.`;
                btnCopy.style.display = 'none';
            }
            
            btnGen.disabled = false;
            btnGen.textContent = 'Generate Key';
            btnGen.classList.remove('loading');
        }

        btnCopy.addEventListener('click', async () => {
            if (currentKey) {
                try {
                    await navigator.clipboard.writeText(currentKey);
                    btnCopy.textContent = '✅ Copied!';
                    btnCopy.style.background = '#155724';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                        btnCopy.style.background = '#28a745';
                    }, 2000);
                } catch (error) {
                    // Fallback for older browsers
                    const textArea = document.createElement('textarea');
                    textArea.value = currentKey;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    
                    btnCopy.textContent = '✅ Copied!';
                    btnCopy.style.background = '#155724';
                    setTimeout(() => {
                        btnCopy.textContent = 'Copy Key';
                        btnCopy.style.background = '#28a745';
                    }, 2000);
                }
            }
        });
    </script>
</body>
</html>
